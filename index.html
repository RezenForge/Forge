<script>

// run engine
let last=Date.now(),lastSave=0,wl;

function adj(t,n){const f=calib();return f?t*f:t+n*60}
function exLeft(e,c){const r=S.set.rep,u=e.uni?2:1,sw=e.uni?10:0,F=e.reps*r*u+sw;
 if(!c)return e.sets*F+(e.sets-1)*e.rest;
 if(c.ph=='rate')return 0;const rem=e.sets-c.set;let t;

 else if(c.ph=='swap')t=c.left+e.reps*r+rem*(e.rest+F);

function tick(){const n=Date.now(),dt=Math.max(0,Math.min((n-last)/1000,14400));last=n;const c=S.cur;if(!c)return;
 if(c.started!==false){const g=(n-(c.lt||n))/1000;if(g<10800)c.elapsed+=g;c.lt=n}

 if(!c.paused&&x&&TIMED(x.ph)&&dt>1.5){/* rattrapage : écran verrouillé ou appli en arrière-plan */FF=true;try{let r=dt;for(let g=0;g<3000&&r>0;g++){const y=c.ex;if(!y||!TIMED(y.ph))break;if(y.left>r){y.left-=r;r=0}else{r-=y.left;y.left=0;advance()}}}finally{FF=false}save();if(!document.hidden)render()}
 else if(!c.paused&&x&&TIMED(x.ph)){const p0=x.left;x.left-=dt;if(x.ph!='rep'&&x.left>0&&Math.ceil(x.left)<=3&&Math.ceil(p0)!=Math.ceil(x.left))beep(520,.06,.7);if(x.left<=0)advance()}

/* ===== Progression : bilan série par série (hypertrophie) =====
   - réussi : toutes les répétitions de toutes les séries => +incrément (ou +1 rép en double progression)
   - presque : 1re série complète et seule la fin manque (dernière série ou >= 90 % des reps) => même charge
   - échec : calé tôt ou < 90 % => même charge au 1er échec, allègement de 10 % au 2e d'affilée
   - < 60 % des reps : charge clairement trop lourde => allègement immédiat
   - 3 séances sans progrès sur la même charge => allègement de 10 %
   - énergie basse (< 35 %) : l'échec est excusé et ne compte pas dans les échecs d'affilée */
function progEval(e,sr){const n=e.sets,T=e.reps,r=[];for(let i=0;i<n;i++)r.push(Math.max(0,Math.min(T,sr&&sr[i]!=null?sr[i]:0)));
 const tot=r.reduce((a,b)=>a+b,0),pct=n*T?tot/(n*T):0,fm=r.findIndex(v=>v<T);
 const res=fm<0?'ok':(r[0]>=T&&(fm==n-1||pct>=.9))?'mid':'ko';return{r,pct,fm,res}}
function progRound(v,inc){const st=inc>0?inc:.5;return Math.max(0,Math.round(v/st)*st)}
function progPlan(e,ev){const pg=Object.assign({f:0,s:0},e.pg||{}),fat=fatigue(),low=!!(fat&&fat.e<35),inc=e.inc||0,DP=e.rmax>0&&e.rmin>0,P=Math.round(ev.pct*100),RP=!(inc>0),AS=isAs(e),LT=l=>AS?'assistance '+kg(l)+' kg':ldT(l),tot=ev.r.reduce((a,b)=>a+b,0),prevT=(pg.ll===e.load&&pg.lr===e.reps&&pg.lt!=null)?pg.lt:null,gain=prevT!=null?tot-prevT:0;
 let load=e.load,reps=e.reps,txt='',ic='';
 const deload=why=>{pg.f=0;pg.s=0;ic='📉';if(AS){load=progRound(e.load+Math.max(inc||2.5,effLoad(e)*.1),inc||2.5);if(DP)reps=e.rmin;txt=why+` On remet de l'assistance : ${kg(load)} kg${DP?' × '+reps:''}, puis on la réduira de nouveau.`;return}if(RP&&!(e.load>0)){reps=DP?e.rmin:Math.max(1,Math.round(e.reps*.85));txt=why+` On allège : ${reps} répétitions par série, puis on remonte.`;return}
  load=progRound(e.load*.9,inc);if(inc>0&&load>e.load-inc)load=Math.max(0,e.load-inc);if(DP)reps=e.rmin;txt=why+` On allège de 10 % : ${LT(load)}${DP?' × '+reps:''}, puis on remonte.`};
 if(ev.res=='ok'){pg.f=0;pg.s=0;ic='✅';
  if(DP&&e.reps<e.rmax){reps=e.reps+1;txt=`Toutes les répétitions ! Double progression : même charge, vise ${reps} répétitions la prochaine fois.`}
  else if(AS){load=Math.max(0,progRound(e.load-(inc||2.5),inc||2.5));if(DP)reps=e.rmin;txt=load>0?`Toutes les répétitions ! L'assistance baisse : ${kg(load)} kg (tu soulèveras ≈ ${kg(Math.max(0,bwPart(e)-load))} kg)${DP?', et tu repars à '+reps+' répétitions':''}.`:`Toutes les répétitions ! Plus besoin d'assistance : passe à la version classique de l'exercice.`}
  else if(RP){if(DP)txt=`Toutes les répétitions, au maximum de ta plage (${e.rmax}) ! Pour progresser encore, ajoute du lest ou passe à une variante plus dure.`;else{reps=e.reps+1;txt=`Toutes les répétitions ! Sans charge à ajouter, on progresse en répétitions : vise ${reps} la prochaine fois.`}}
  else{load=e.load+inc;if(DP)reps=e.rmin;txt=`Toutes les répétitions ! La charge monte : ${kg(load)} kg${DP?', et tu repars à '+reps+' répétitions':''}.`}}
 else if(ev.res=='mid'&&gain>0){pg.s=0;pg.f=0;ic='📈';txt=`Presque (${P} %), et +${gain} rép par rapport à la dernière fois : tu progresses, on garde ${LT(load)} × ${reps}.`}
 else if(ev.res=='mid'){pg.s++;if(pg.s>=3)deload('3 séances sans progrès.');else{ic='⚠️';txt=`Presque (${P} %) : seule la fin a manqué, c'est de la fatigue normale. On garde ${LT(load)} × ${reps} pour le valider.`}}
 else if(low){pg.s++;ic='🛡️';txt=`Échec (${P} %), mais ton énergie était basse (${fat.e} %) : échec excusé, on garde ${LT(load)} × ${reps}.`}
 else if(ev.pct<.6)deload(`Calé dès la série ${ev.fm+1} avec seulement ${P} % des répétitions : c'est trop dur pour l'instant.`);
 else if(gain>0){pg.f=0;pg.s=0;ic='📈';txt=`Calé à la série ${ev.fm+1} (${P} %), mais +${gain} rép par rapport à la dernière fois : on garde ${LT(load)} × ${reps}.`}
 else{pg.f++;pg.s++;if(pg.f>=2)deload("2e échec d'affilée.");else if(pg.s>=3)deload('3 séances sans progrès.');else{ic='❌';txt=`Calé à la série ${ev.fm+1} (${P} %). On garde ${LT(load)} × ${reps} ; si ça se reproduit la prochaine fois, on allégera.`}}
 pg.lt=tot;pg.ll=e.load;pg.lr=e.reps;return{res:ev.res,load:Math.round(load*100)/100,reps,txt,ic,pg}}
function adjSR(i,d){const c=S.cur,x=c&&c.ex;if(!x)return;const e=sess(c.sid).ex.find(a=>a.id==x.id);x.sr=x.sr||[];x.sr[i]=Math.max(0,Math.min(e.reps,(x.sr[i]??e.reps)+d));save();render()}
function failSet(){const c=S.cur,x=c&&c.ex;if(!x||x.ph!='rep')return;const e=sess(c.sid).ex.find(a=>a.id==x.id);x.sr=x.sr||[];x.sr[x.set-1]=Math.max(0,x.rep-1);x.side=0;
 if(x.set<e.sets){x.ph='rest';x.left=e.rest}else x.ph='rate';beep(330,.3);save();render()}
function valEx(){const c=S.cur,s=sess(c.sid),e=s.ex.find(a=>a.id==c.ex.id),x=c.ex,ev=progEval(e,x.sr),pl=progPlan(e,ev);
 c.done[e.id]=pl.res;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};{const lg=c.log[e.id],nr=ev.r.reduce((a,b)=>a+b,0)*(e.uni?2:1),nv=Math.round(nr*effLoad(e)*100)/100;c.vol=Math.max(0,Math.round((c.vol+nv-(lg.vol||0))*100)/100);lg.reps=nr;lg.vol=nv}Object.assign(c.log[e.id],{load:e.load,bw:bwPart(e),res:pl.res,sr:ev.r,tr:e.reps});
 e.load=pl.load;e.reps=pl.reps;e.pg=pl.pg;c.ex=null;c.paused=false;last=Date.now();save();go('train2')}
function rateHtml(c,x,e){const ev=progEval(e,x.sr),pl=progPlan(e,ev);
 return`<h2>Bilan de l'exercice</h2><div class="mu">${e.name} · ${ldE(e)} · ${e.sets}×${e.reps}${e.uni?' / côté':''}</div>${x.stopped?`<div class="mu">Exercice arrêté : les séries non faites comptent 0.</div>`:''}
 <div class="card" style="margin-top:10px"><div class="mu" style="margin-bottom:6px">Répétitions réussies par série (corrige si besoin)</div>${ev.r.map((v,i)=>`<div class="row" style="padding:4px 0"><span>Série ${i+1}</span><span style="display:flex;align-items:center;gap:8px"><button class="btn s" style="width:40px;margin:0;padding:6px" onclick="adjSR(${i},-1)">−</button><b style="font:11px var(--px);min-width:52px;text-align:center;color:${v>=e.reps?'var(--ok)':'var(--ac)'}">${v}/${e.reps}</b><button class="btn s" style="width:40px;margin:0;padding:6px" onclick="adjSR(${i},1)">+</button></span></div>`).join('')}</div>
 <div class="card"><div style="font-size:21px">${pl.ic} ${pl.txt}</div><div class="mu" style="margin-top:6px">Prochaine fois : ${ldT(pl.load)} × ${pl.reps}</div></div>
 <button class="btn p" onclick="valEx()">Valider</button>`}
function rateEx(res){const c=S.cur,s=sess(c.sid),e=s.ex.find(a=>a.id==c.ex.id);c.done[e.id]=res;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].load=e.load;c.log[e.id].res=res;
 if(res=='ok')e.load+=e.inc;else if(res=='ko')e.load=Math.max(0,e.load-e.inc);e.load=Math.round(e.load*100)/100;c.ex=null;c.paused=false;last=Date.now();save();go('train2')}
function finish(){const c=S.cur,s=sess(c.sid);const exs=s.ex.filter(e=>c.log[e.id]).map(e=>({id:e.id,name:e.name,load:c.log[e.id].load??e.load,reps:c.log[e.id].reps,vol:c.log[e.id].vol,res:c.log[e.id].res||'-',stop:c.log[e.id].stop||0,sr:c.log[e.id].sr,tr:c.log[e.id].tr,bw:c.log[e.id].bw||0}));
 if(!exs.length)return ask("Aucun exercice effectué. Quitter la séance sans l'enregistrer ?",()=>{S.cur=null;save();go('home')});
 let recs=[];const pv=Math.max(0,...S.hist.filter(h=>h.sid==c.sid).map(h=>h.vol));if(c.vol>pv&&S.hist.some(h=>h.sid==c.sid))recs.push('Volume de séance : '+kg(Math.round(c.vol))+' kg');
 exs.forEach(x=>{const pr=S.hist.flatMap(h=>h.ex.filter(y=>y.id==x.id&&y.res=='ok').map(y=>xL(y)));if(x.res=='ok'&&pr.length&&xL(x)>Math.max(...pr))recs.push(x.name+' : '+kg(xL(x))+' kg')});
 if(exs.length)S.hist.push({t:Date.now(),sid:c.sid,name:s.name,dur:c.elapsed,vol:c.vol,th:s.ex.filter(e=>c.done[e.id]).reduce((a,e)=>a+exLeft(e,null),0),ex:exs,sk:c.sk||0});
 const q0=lvl();LOOT={xp:0,pr:0,items:[],recs,L0:q0.L,p0:Math.round(q0.x/q0.n*100),name:s.name,dur:c.elapsed,vol:c.vol};
 S.lastG=mkLast(c,s);{const bx=boostM('xp'),bp=boostM('pr');addXP(Math.round(S.lastG.list.filter(x=>x.ok).reduce((a,x)=>a+x.xp,0)*bx),bx>1?'Boost ×'+fm(bx):null,bp);addXP(Math.round(20*xpMult()*bx),'Séance terminée',bp);if(S.lastG.list.length>0&&S.lastG.list.every(x=>x.ok))addXP(Math.round(25*xpMult()*bx),'Séance parfaite',bp);boostUse()}
 if(LOOT.items.length)LOOT.items[0][0]=LOOT.items[0][0]=='Quêtes'?'Quêtes de séance':LOOT.items[0][0];
 S.cur=null;try{claimMonth()}catch(e){}
 if(Math.random()<.1){if(!(S.boost&&S.boost.xp)){S.boost=S.boost||{};S.boost.xp={id:'shk',nm:"Shaker de Prot's",m:1.5,n:3};LOOT.rare="Shaker de Prot's offert (XP ×1,5 sur 3 séances)"}else{const p=Math.round(40*xpMult());S.prots=(S.prots||0)+p;LOOT.pr+=p;LOOT.rare='+'+p+" Prot's"}}
 if(recs.length)S.lastRec={t:Date.now(),list:recs};const L=LOOT;LOOT=null;save();go('home');showChest(L)}

const tpGauge=v=>Array.from({length:10},(_,i)=>`<u class="${i<Math.round(v)?'on':''}"></u>`).join(''),f1t=v=>String(Math.round(v*10)/10).replace('.',',')+' s/rép';

 wk[7].lab='Auj.';const pw=wk.slice(0,7).filter(x=>x.v>0),avg=pw.length?pw.reduce((a,x)=>a+x.v,0)/pw.length:0,dv=avg?Math.round((wk[7].v/avg-1)*100):null;

 const P=L.slice(-20),pts=P.map(y=>{const r=e1rm(y,e),sr=y.sr&&y.sr.length?y.sr.join('-')+' rép':y.reps+' rép';return{v:bw?Math.round(avgReps(y,e)*10)/10:xL(y),v2:bw||!r?null:Math.round(r*2)/2,m:y.res,lab:dfr(y.t),tip:`<b>${dfrY(y.t)}</b> · ${bw?'':AS?'≈ '+kg(xL(y))+' kg (assistance '+kg(y.load)+') · ':kg(y.load)+' kg · '}${sr} ${ICO[y.res]||''}${y.stop?' ⛔':''}${!bw&&r?` · <span class="h">1RM ≈ ${kg(Math.round(r*2)/2)} kg</span>`:''}`}});

const REMB=[[0,"À l'heure"],[15,'15 min avant'],[30,'30 min avant'],[60,'1 h avant'],[120,'2 h avant']],BYD=['SU','MO','TU','WE','TH','FR','SA'];
const remT=()=>S.set.remT||'18:00',remB=()=>S.set.remB??60;
function nextOcc(day,hm){const n=new Date(),[h,m]=hm.split(':').map(Number),r=new Date(n.getFullYear(),n.getMonth(),n.getDate(),h||0,m||0);let a=(day-n.getDay()+7)%7;if(a==0&&r<n)a=7;r.setDate(r.getDate()+a);return r}
const icsD=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
const icsT=s=>String(s).replace(/\\/g,'\\\\').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n');
const sessMin=s=>Math.max(20,Math.round(adj(s.ex.reduce((a,e)=>a+exLeft(e,null),0),Math.max(0,s.ex.length-1))/60));
function notify(title,body,tag){try{const o={body,tag,icon:'icon-192.png',badge:'icon-192.png'};if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});else new Notification(title,o)}catch(e){}}
function remToggle(on){if(!on){S.set.remOn=false;save();return render()}
 if(!('Notification' in window)){toast("Ce navigateur ne gère pas les notifications : utilise l'agenda");S.set.remOn=false;save();return render()}
 Notification.requestPermission().then(p=>{S.set.remOn=p=='granted';save();if(p=='granted'){toast('Rappels activés');notify('Rappels activés 💪','Tu seras prévenu avant tes séances.','dg-test')}else toast('Notifications refusées dans les réglages du navigateur');render()})}
function remCheck(){if(!S||!S.set||!S.set.remOn||!('Notification' in window)||Notification.permission!='granted')return;
 const n=new Date(),td=n.toDateString(),sent=S.set.remSent=(S.set.remSent&&S.set.remSent.d==td)?S.set.remSent:{d:td,ids:[]};
 S.sessions.filter(s=>s.day==n.getDay()&&s.ex.length).forEach(s=>{if(sent.ids.includes(s.id))return;if(S.cur&&S.cur.sid==s.id)return;if(S.hist.some(h=>h.sid==s.id&&new Date(h.t).toDateString()==td))return;
  const st=nextOcc(s.day,remT());if(st.toDateString()!=td)st.setDate(st.getDate()-7);const at=new Date(st.getTime()-remB()*6e4);
  if(n>=at&&n<=new Date(st.getTime()+3*36e5)){sent.ids.push(s.id);save();const mi=Math.round((st-n)/6e4),lab=mi>=60?Math.floor(mi/60)+' h'+(mi%60?' '+String(mi%60).padStart(2,'0'):''):mi+' min';
   notify(`🏋️ ${s.name}${mi>0?' dans '+lab:" c'est maintenant"}`,`${s.ex.length} exercice${s.ex.length>1?'s':''} · environ ${sessMin(s)} min. Ouvre l'appli pour lancer le minuteur.`,'dg-'+s.id)}})}
function remIcs(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dungeon Gains//FR','CALSCALE:GREGORIAN'],now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),b=remB();
 const ss=S.sessions.filter(s=>s.ex.length);if(!ss.length)return toast('Ajoute au moins une séance avec des exercices');
 ss.forEach(s=>{const st=nextOcc(s.day,remT()),en=new Date(st.getTime()+sessMin(s)*6e4);
  L.push('BEGIN:VEVENT','UID:dg-'+s.id+'@dungeon-gains','DTSTAMP:'+stamp,'DTSTART:'+icsD(st),'DTEND:'+icsD(en),'RRULE:FREQ=WEEKLY;BYDAY='+BYD[s.day],'SUMMARY:'+icsT('🏋️ Séance : '+s.name),'DESCRIPTION:'+icsT(s.ex.length+' exercice(s) · environ '+sessMin(s)+' min. Ouvre Dungeon Gains pour lancer le minuteur.'),
   'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsT('Séance '+s.name),'TRIGGER:-PT'+b+'M','END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');try{const bl=new Blob([L.join('\r\n')],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='dungeon-gains-seances.ics';document.body.append(a);a.click();a.remove();toast('Fichier agenda téléchargé : ouvre-le pour importer tes séances')}catch(e){toast("Impossible de créer le fichier agenda")}}

function remHtml(){const t=S.set,ss=S.sessions.filter(s=>s.ex.length),ok='Notification' in window;

/* ===== Énergie : basée uniquement sur ce qui a été FAIT =====
   chaque série réellement faite = 1 point de fatigue (×1,15 si « presque », ×1,3 si échec, +10 % si exercice arrêté),
   la fatigue se récupère de moitié toutes les 40 h ; 70 points = réservoir vide. La séance en cours compte en direct. */
const FAT_HL=40*36e5,FAT_CAP=70,FAT_SC={ok:1,mid:1.15,ko:1.3};
function setsDone(x){if(x.sr&&x.sr.length)return x.sr.filter(r=>r>0).length;const r=x.reps||0;if(!r)return 0;return Math.max(1,Math.round(r/(x.tr||10)))}
function fatigue(dt){const H=S.hist,T=Date.now(),t0=T+(dt||0),L=[];
 H.forEach(h=>(h.ex||[]).forEach(x=>L.push({t:h.t,n:setsDone(x),w:(FAT_SC[x.res]||1)*(x.stop?1.1:1)})));
 const c=S.cur;if(c&&c.started&&c.log)Object.values(c.log).forEach(g=>L.push({t:T,n:g.sr?g.sr.filter(r=>r>0).length:Math.max(0,Math.round((g.reps||0)/((g.tr)||10))),w:FAT_SC[g.res]||1}));
 let F=0,n7=0;L.forEach(o=>{const age=t0-o.t;if(age<0||age>12*864e5)return;F+=o.n*o.w*Math.pow(.5,age/FAT_HL);if(T-o.t<7*864e5)n7+=o.n});
 return{e:Math.max(0,Math.min(100,Math.round(100*(1-F/FAT_CAP)))),n:H.filter(h=>T-h.t<7*864e5).length,s7:n7}}

function gPick(slot,eq,used,skip){const L=(GSL[slot]||[]).map(id=>CATI[id]).filter(c=>c&&gOk(c,eq)&&!used.has(c.id)&&c.id!=skip);if(!L.length)return null;const r=Math.random(),i=Math.min(L.length-1,r<.65?0:r<.9?1:2);return L[i]}
function gBuild(f,eq,n){const F=GFO.find(x=>x[0]==f)||GFO[0],used=new Set(),out=[];for(const sl of F[2]){if(out.length>=n)break;const c=gPick(sl,eq,used);if(c){used.add(c.id);out.push({c,sl})}}return ordSort(out,it=>({name:it.c.n}))}

dm:"Debout, barre devant les clavicules, prise un peu plus large que les épaules.|Pousse la barre au-dessus de la tête en reculant légèrement la tête, finis bras tendus barre au-dessus des oreilles.|Serre fesses et abdos pour ne pas cambrer.|Se cambrer en arrière, pousser la barre loin devant.",
dmh:"Assis dossier droit, haltères à hauteur d'épaules.|Pousse au-dessus de la tête, redescends à hauteur d'oreilles.|Coudes légèrement devant le corps, pas complètement sur les côtés.|Cambrer le dos, cogner les haltères.",
arn:"Assis, haltères devant le visage, paumes vers toi.|Pousse en tournant les poignets pour finir paumes vers l'avant, redescends en sens inverse.|Mouvement fluide et contrôlé.|Charge trop lourde qui casse la rotation.",
dmm:"Règle le siège : poignées à hauteur d'épaules. Dos collé.|Pousse vers le haut, redescends lentement.|Bon exercice pour pousser près de l'échec en sécurité.|Siège mal réglé, dos qui décolle.",
el:"Debout, haltères le long du corps, buste très légèrement penché.|Monte les bras sur les côtés jusqu'à hauteur d'épaules, coudes un peu fléchis, redescends lentement.|Pense « écarter les mains loin de toi », petit doigt légèrement plus haut.|Prendre de l'élan, hausser les épaules, charge trop lourde.",
elp:"Poulie basse, poignée dans la main opposée, debout de profil.|Monte le bras sur le côté jusqu'à l'épaule, redescends lentement.|Tension constante : un des meilleurs exercices pour les épaules.|Tirer avec le trapèze.",
elm:"Règle le siège : épaules alignées avec l'axe de la machine.|Monte les coudes sur les côtés jusqu'à l'horizontale, redescends.|Mouvement lent, sans à-coups.|Hausser les épaules.",
elf:"Debout, haltères devant les cuisses.|Monte un bras ou les deux devant toi jusqu'à hauteur des yeux, redescends.|Souvent inutile si tu fais déjà des développés.|Balancer le buste.",
ois:"Penché en avant (ou assis buste sur les cuisses), haltères sous la poitrine.|Ouvre les bras sur les côtés, coudes légèrement fléchis, jusqu'à hauteur d'épaules.|Charge légère : c'est l'arrière de l'épaule, un petit muscle.|Serrer les omoplates à fond (ça devient du dos), élan.",
rpd:"Face à la machine, poitrine contre le dossier, poignées à hauteur d'épaules.|Ouvre les bras en arrière, coudes légèrement fléchis, reviens lentement.|Garde les épaules basses.|Plier les coudes pour tirer.",
fp:"Poulie à hauteur du visage, corde en mains.|Tire la corde vers le front en écartant les mains, coudes hauts, termine les poings à côté des oreilles.|Excellent pour la santé des épaules : léger et contrôlé.|Tirer vers le cou, coudes bas.",
rm:"Debout, barre devant les cuisses, prise largeur d'épaules.|Monte la barre le long du corps jusqu'au bas de la poitrine, coudes au-dessus des poignets.|Prise pas trop serrée pour ménager les épaules.|Monter trop haut, prise très serrée.",
cb:"Debout, barre en supination, bras le long du corps.|Plie les coudes pour monter la barre, coudes fixes contre le corps, redescends lentement.|Barre EZ si les poignets tirent.|Balancer le buste, avancer les coudes.",
ch:"Debout ou assis, haltères le long du corps, paumes vers l'avant.|Monte en pliant les coudes, redescends lentement. En alterné ou ensemble.|Tourne le petit doigt vers le haut en fin de mouvement.|Élan, coudes qui avancent.",
cm:"Debout, haltères paumes face à face.|Monte en gardant la prise neutre, redescends lentement.|Travaille aussi l'avant-bras.|Balancer.",
cinc:"Banc incliné à 45-60°, bras pendants derrière le buste.|Monte les haltères sans avancer les coudes, redescends jusqu'à l'étirement.|Étirement maximal du biceps : charge plus légère.|Avancer les coudes.",
cpu:"Bras posés sur le pupitre, aisselles au bord.|Monte la barre, redescends presque bras tendus sans verrouiller.|Contrôle la descente, c'est là que le coude est sollicité.|Décoller les bras du pupitre.",
cpo:"Face à la poulie basse, barre ou corde en mains.|Plie les coudes pour monter, coudes fixes, redescends lentement.|Tension constante sur toute l'amplitude.|Reculer les épaules pour aider.",
ccon:"Assis, coude calé contre l'intérieur de la cuisse.|Monte l'haltère vers l'épaule, redescends lentement.|Idéal pour sentir le muscle.|Bouger le haut du bras.",
ext:"Face à la poulie haute, coudes collés au corps.|Pousse la barre ou la corde vers le bas jusqu'à bras tendus, remonte jusqu'à 90°.|Avec la corde, écarte les mains en bas.|Coudes qui bougent, buste qui pousse.",
bf:"Allongé, barre EZ au-dessus du front, bras verticaux.|Plie les coudes pour descendre la barre vers le front (ou juste derrière la tête), remonte.|Coudes fixes et serrés.|Coudes qui s'écartent, charge trop lourde.",
exn:"Assis ou debout, un haltère tenu à deux mains au-dessus de la tête.|Descends l'haltère derrière la tête en pliant les coudes, remonte.|Coudes vers le plafond, proches de la tête.|Cambrer le dos, coudes trop écartés.",
kbk:"Penché, une main en appui, bras collé au corps, coude à 90°.|Tends le bras vers l'arrière, marque une pause, reviens.|Seul l'avant-bras bouge.|Balancer l'haltère.",
dcs:"Comme le développé couché, mains largeur d'épaules.|Descends au bas des pectoraux, coudes près du corps, pousse.|Pas plus serré que les épaules : les poignets souffrent sinon.|Prise trop serrée, coudes écartés.",
cpoi:"Assis, avant-bras sur les cuisses, poignets dans le vide.|Enroule les poignets vers le haut, redescends lentement.|Amplitude complète, charge légère.|Bouger les avant-bras.",
farm:"Debout, une charge lourde dans chaque main.|Marche à petits pas, buste droit, épaules basses.|Gaine fort, respire normalement.|Se pencher d'un côté.",
sq:"Barre sur le haut du dos, pieds largeur d'épaules, pointes légèrement ouvertes.|Descends en poussant les fesses en arrière et les genoux vers l'extérieur, jusqu'à hanches au moins au niveau des genoux. Remonte en poussant le sol.|Gaine avant de descendre, talons au sol, genoux dans l'axe des pieds.|Genoux qui rentrent, dos qui s'arrondit en bas, talons qui décollent.",
fsq:"Barre posée sur l'avant des épaules, coudes hauts.|Descends en gardant le buste très droit, remonte.|Coudes hauts tout le long : sinon la barre glisse.|Coudes qui tombent, dos rond.",
gsq:"Un haltère ou kettlebell tenu contre la poitrine.|Descends entre tes jambes, buste droit, coudes entre les genoux, remonte.|Parfait pour apprendre le squat.|Talons qui décollent.",
sqp:"Pieds largeur d'épaules, bras devant.|Descends le plus bas possible avec le dos droit, remonte.|Contrôle la descente, pousse fort.|Genoux qui rentrent.",
pr:"Dos et fesses collés au dossier, pieds au milieu de la plateforme largeur de hanches.|Descends jusqu'à genoux vers 90° ou un peu plus, pousse sans verrouiller les genoux.|Pieds hauts = plus de fessiers ; pieds bas = plus de quadriceps.|Fesses qui décollent en bas, genoux verrouillés en haut.",
hack:"Dos collé au dossier, épaules sous les appuis, pieds largeur de hanches.|Descends profondément, remonte en poussant dans les talons et le milieu du pied.|Garde le dos plaqué.|Demi-amplitude, genoux qui rentrent.",
fen:"Debout, haltères en mains.|Fais un grand pas, descends jusqu'à ce que le genou arrière frôle le sol, remonte.|Buste droit, genou avant dans l'axe du pied.|Pas trop court, genou qui rentre.",
bul:"Dos à un banc, pied arrière posé dessus, haltères en mains.|Descends sur la jambe avant jusqu'à la cuisse parallèle au sol, remonte.|Buste un peu penché = plus de fessiers.|Pied avant trop proche du banc.",
step:"Face à un banc ou une box, haltères en mains.|Pose un pied dessus et monte en poussant avec cette jambe, redescends contrôlé.|C'est la jambe du haut qui travaille : ne pousse pas avec celle du bas.|Box trop haute, élan.",
lex:"Dos collé, genoux alignés avec l'axe de la machine, boudin au-dessus des chevilles.|Tends les jambes, marque une pause, redescends lentement.|Pause d'une seconde en haut.|Élan, fesses qui décollent.",
lc:"Allongé ou assis, boudin au-dessus des talons, genoux alignés avec l'axe.|Plie les jambes pour ramener les talons vers les fesses, redescends lentement.|Garde le bassin collé au banc.|Bassin qui décolle, descente lâchée.",
nord:"À genoux, chevilles bloquées.|Descends le buste droit vers l'avant en freinant le plus longtemps possible, retiens-toi avec les mains, remonte en t'aidant.|Très dur : la descente freinée suffit au début.|Plier les hanches.",
ht:"Haut du dos appuyé sur un banc, barre sur les hanches (avec mousse), pieds à plat.|Pousse les hanches vers le haut jusqu'à l'alignement épaules-hanches-genoux, serre les fessiers, redescends.|Menton rentré, regard vers l'avant en haut.|Cambrer le bas du dos au lieu de serrer les fessiers.",
kbs:"Pieds largeur d'épaules, kettlebell devant toi.|Fais passer la kettlebell entre les jambes en reculant les fesses, puis claque les hanches vers l'avant pour la projeter à hauteur de poitrine.|Ce sont les hanches qui lancent, pas les bras.|Squatter au lieu de basculer les hanches, dos rond.",
add:"Assis, coussinets à l'intérieur des genoux.|Ramène les jambes l'une vers l'autre, reviens lentement.|Amplitude confortable.|Revenir trop vite.",
abd:"Assis, coussinets à l'extérieur des genoux.|Écarte les jambes, reviens lentement.|Buste penché en avant = plus de fessiers.|Élan.",
mol:"Épaules sous les appuis, avant des pieds sur la marche.|Monte sur la pointe des pieds le plus haut possible, redescends jusqu'à l'étirement.|Pause d'une seconde en haut et en bas.|Rebondir, demi-amplitude.",
mola:"Assis, genoux sous les appuis, avant des pieds sur la marche.|Monte sur la pointe, redescends lentement.|Cible le soléaire (muscle sous le mollet).|Rebondir.",
cr:"Allongé, genoux pliés, mains près des tempes.|Enroule le haut du dos en rapprochant les côtes du bassin, redescends.|Le bas du dos reste au sol.|Tirer sur la nuque.",
crp:"À genoux face à la poulie haute, corde derrière la tête.|Enroule le buste vers le sol en contractant les abdos, reviens.|Ce sont les abdos qui enroulent, pas les bras qui tirent.|S'asseoir sur les talons.",
rj:"Suspendu à une barre (ou allongé).|Monte les jambes ou les genoux en enroulant le bassin, redescends lentement.|Commence genoux pliés si c'est trop dur.|Se balancer.",
abw:"À genoux, mains sur la roue.|Roule vers l'avant en gardant le dos plat, reviens en contractant les abdos.|Ne va pas plus loin que ce que tu contrôles.|Bas du dos qui se creuse.",
gain:"Sur les avant-bras et la pointe des pieds, corps droit.|Tiens la position.|Serre fesses et abdos, respire normalement.|Fesses trop hautes ou bassin qui tombe.",
gl:"Sur un avant-bras, de profil, pieds empilés.|Tiens la position, corps aligné.|Pousse la hanche vers le haut.|Bassin qui tombe.",
rus:"Assis, buste penché en arrière, pieds au sol ou levés.|Tourne le buste d'un côté puis de l'autre.|Ce sont les épaules qui tournent, pas seulement les bras.|Dos rond.",
mc:"En appui sur les mains, corps gainé.|Ramène les genoux vers la poitrine en alternance, rapidement.|Garde les hanches basses.|Fesses en l'air.",
thr:"Barre devant les épaules, pieds largeur d'épaules.|Squat avant, puis en remontant pousse la barre au-dessus de la tête d'un seul mouvement.|Utilise l'élan des jambes.|Dos qui se cambre en haut.",
clean:"Comme au soulevé de terre.|Tire la barre, explose des hanches, réceptionne-la sur l'avant des épaules en fléchissant les jambes.|Technique d'abord : demande un coach.|Tirer avec les bras.",
burp:"Debout.|Mains au sol, saute en planche, pompe (optionnelle), ramène les pieds, saute.|Rythme régulier plutôt que vitesse maximale.|Bassin qui tombe en planche."
};
function exCue(e){const m=exMus(e),c=m&&m.c,t=c&&EXC[c.id];
 const o=document.createElement('div');o.className='ov';o.style.alignItems='center';
 const sec=(ic,l,x)=>x?`<div class="cue"><b>${ic} ${l}</b><p>${x}</p></div>`:'';
 let body;if(t){const[a,b,k,z]=t.split('|'),R=exRec(c);body=`<div class="mch">${c.p.map(x=>`<i class="p">${MUS[x]}</i>`).join('')}${c.s.map(x=>`<i>${MUS[x]}</i>`).join('')}</div>${sec('📍','Mise en place',a)}${sec('🔁','Mouvement',b)}${sec('💡','Points clés',k)}${sec('⚠️','À éviter',z)}<div class="mu" style="margin-top:8px">Conseillé : ${R.txt}</div>`}
 else body=`<p class="mu">Pas de fiche pour « ${esc(e.name)} » : choisis un exercice du catalogue (Modifier l'exercice) pour avoir les conseils d'exécution.</p>${sec('💡','En attendant','Contrôle la descente (2 à 3 secondes), garde le dos neutre et le corps gainé, et arrête la série quand la technique se dégrade.')}`;
 o.innerHTML=`<div class="sheet cuesh"><div class="cueh">${spr('scroll',3)}<h2>${esc(e.name)}</h2></div>${body}<button class="btn s" id="cx">Fermer</button></div>`;
 document.body.append(o);o.onclick=ev=>{if(ev.target==o||ev.target.id=='cx')o.remove()}}

function exCueId(sid,eid){const s=sess(sid),e=s&&s.ex.find(x=>x.id==eid);if(e)exCue(e)}
function edE(id){const s=sess(v.id),e=id?s.ex.find(a=>a.id==id):{name:'',load:20,inc:2.5,sets:3,reps:8,rest:90};
 form(id?'Modifier l\'exercice':'Nouvel exercice',[{k:'name',l:'Nom',t:'text',v:e.name},{k:'mp',l:'Muscle ciblé',o:["Auto (d'après le nom)",...MUSK.map(k=>MUS[k])],v:e.mp?MUSK.indexOf(e.mp)+1:0},{k:'load',l:'Charge actuelle (kg)',v:e.load},{k:'inc',l:'Incrément de progression (kg)',v:e.inc},{k:'sets',l:'Séries',v:e.sets},{k:'reps',l:'Répétitions',v:e.reps},{k:'rest',l:'Repos (secondes)',v:e.rest},{k:'uni',l:"Unilatéral (un côté après l'autre)",o:['Non','Oui'],v:e.uni?1:0},{k:'rmin',l:'Double progression : répétitions min',v:e.rmin||e.reps},{k:'rmax',l:'Double progression : répétitions max (0 = désactivée)',v:e.rmax||0}],r=>{if(!r.name)return;r.mp=r.mp>0?MUSK[r.mp-1]:'';
  r.rmax=Math.max(0,Math.round(r.rmax)||0);if(r.rmax>0){r.rmin=Math.max(1,Math.min(r.rmax,Math.round(r.rmin)||Math.round(r.reps)||1));r.reps=Math.max(r.rmin,Math.min(r.rmax,Math.round(r.reps)||r.rmin))}else r.rmin=0;r.sets=Math.max(1,Math.round(r.sets)||1);r.reps=Math.max(1,Math.round(r.reps)||1);r.rest=Math.max(0,Math.round(r.rest)||0);r.load=Math.max(0,r.load||0);r.inc=Math.max(0,r.inc||0);if(id)Object.assign(e,r);else{const ne={id:uid(),...r},o=exOrd(ne);let k=s.ex.length;if(o!=null){const j=s.ex.findIndex(x=>{const q=exOrd(x);return q!=null&&q<o});if(j>=0)k=j}s.ex.splice(k,0,ne);if(k<s.ex.length-1)toast(`Placé en position ${k+1} (ordre conseillé)`)}save();render()});
 exForm(!id);
 if(id){const b=document.createElement('button');b.className='btn d s';b.textContent='Supprimer cet exercice';b.onclick=()=>{if(S.cur&&S.cur.ex&&S.cur.ex.id==id)S.cur.ex=null;s.ex=s.ex.filter(a=>a.id!=id);save();document.querySelector('.ov').remove();render()};document.querySelector('.sheet').append(b)}}

(function(){
 const o=document.getElementById('splash');if(!o)return;
 SP.dumb=["..oo........oo..",".oggo......oggo.",".ogho.oooo.ohgo.","ogghoaaaaaaohggo","ogghobbbbbbohggo",".ogho.oooo.ohgo.",".oggo......oggo.","..oo........oo.."];
 document.getElementById('spLogo').innerHTML=spr('dumb',6,0);
 const hero=document.getElementById('spHero');try{hero.src=heroImg(cosEq())}catch(e){hero.remove()}
 try{const q=lvl();document.getElementById('spWho').textContent='Héros : '+(S.me.name||curName())+' · Niv. '+q.L+' · '+lvTitle(q.L)}catch(e){}
 for(let i=0;i<16;i++){const e=document.createElement('b');e.className='sp-em';e.style.cssText='left:'+(Math.random()*100)+'%;--dx:'+((Math.random()*80-40)|0)+'px;animation-duration:'+(2.5+Math.random()*3).toFixed(1)+'s;animation-delay:-'+(Math.random()*4).toFixed(1)+'s';o.append(e)}
 const N=12,bar=document.getElementById('spBar'),msg=document.getElementById('spMsg'),pc=document.getElementById('spPc'),M=['Réveil du donjon…','Affûtage des haltères…','Chargement des barres…','Invocation du coach…','Échauffement du héros…'];
 bar.innerHTML='<i></i>'.repeat(N);const seg=bar.children;
 let n=0,done=false,ready=false;
 const pos=()=>{if(hero.isConnected)hero.style.left=(6+88*n/N)+'%';pc.textContent=Math.round(n/N*100)+' %'};pos();
 function end(){if(done||!ready)return;done=true;o.classList.add('out');setTimeout(()=>o.remove(),550)}
 function tick(){if(n<N){seg[n].classList.add('on');n++;pos();msg.textContent=M[Math.min(M.length-1,Math.floor((n-1)/N*M.length))]}if(n>=N){msg.textContent='Prêt pour le combat !';clearInterval(t);ready=true;o.classList.add('rdy')}}
 msg.textContent=M[0];
 const t=setInterval(tick,220);
 o.addEventListener('click',end);
})();
