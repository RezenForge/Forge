nt pas ce qui est écrit, ou contiennent d'autres substances. Ils figurent sur la liste des produits interdits de l'AMA.", "u": "Ne pas croire le marketing « légal et sans danger ».", "e": "Un flacon de SARM acheté en ligne peut contenir une autre molécule ou une dose très différente de l'étiquette.", "r": ["aas", "dopage", "supplcontam"], "app": ""}, {"id": "natural", "n": "Natural", "ab": "Natty", "t": "Concept", "lv": "D", "d": "Un pratiquant qui progresse sans produits dopants : entraînement, alimentation, sommeil et compléments autorisés uniquement.", "x": "« Natty » est l'abréviation courante sur les réseaux. Un « fake natty » est quelqu'un qui se dit naturel alors qu'il utilise des produits. En naturel, les progrès sont rapides la première année, puis ralentissent nettement : quelques kilos de muscle par an deviennent un très bon résultat après plusieurs années. Comparer sa progression à des physiques dopés crée des attentes irréalistes et du découragement.", "u": "Se fixer des objectifs réalistes et se comparer à soi-même.", "e": "1re année : souvent plusieurs kilos de muscle ; 4e année : un ou deux kilos dans l'année, et c'est normal.", "r": ["dopage", "aas", "hypertrophie", "plateau", "fitfluenceur", "newbiegains"], "app": ""}, {"id": "gynecomastie", "n": "Gynécomastie", "ab": "", "t": "Dopage", "lv": "I", "d": "Un développement de la glande mammaire chez l'homme.", "x": "Elle peut être due à un déséquilibre entre testostérone et œstrogènes : à la puberté, avec l'âge, avec certains médicaments, et très souvent avec les stéroïdes anabolisants. Il ne faut pas la confondre avec une simple accumulation de graisse sur les pectoraux. Une glande qui grossit, durcit ou devient douloureuse doit être montrée à un médecin.", "u": "Reconnaître un effet secondaire classique du dopage, et consulter en cas de doute.", "e": "Une petite boule dure et sensible derrière le mamelon : rendez-vous chez le médecin.", "r": ["aas", "testo", "hormones"], "app": ""}, {"id": "supplcontam", "n": "Compléments contaminés", "ab": "", "t": "Dopage", "lv": "I", "d": "Des compléments alimentaires qui contiennent des substances non déclarées, parfois dopantes ou dangereuses.", "x": "Certains produits, surtout les pré-workouts, brûleurs de graisse et « boosters » achetés hors circuits fiables, peuvent contenir des stimulants interdits ou des stéroïdes non indiqués sur l'étiquette. Pour limiter le risque : acheter des marques connues, éviter les promesses spectaculaires, et privilégier les produits contrôlés selon la norme française NF V94-001, qui garantit l'absence de substances dopantes. En compétition, le sportif reste responsable de ce qu'il consomme.", "u": "Éviter un contrôle positif ou un problème de santé à cause d'un complément.", "e": "Un « booster naturel » trouvé sur internet avec des avis miraculeux : prudence, vérifie la composition et la norme.", "r": ["dopage", "preworkout", "bruleurs", "creatine"], "app": ""}, {"id": "bruleurs", "n": "Brûleurs de graisse", "ab": "", "t": "Supplément", "lv": "D", "d": "Des compléments censés accélérer la perte de gras, à l'effet très faible et parfois risqués.", "x": "La plupart contiennent surtout de la caféine ou du thé vert, avec un effet minime sur la dépense calorique. Certains produits illégaux vendus sous ce nom contiennent des substances dangereuses, parfois mortelles. Aucun complément ne remplace un déficit calorique : c'est lui qui fait perdre du gras.", "u": "Éviter une dépense inutile et des risques pour la santé.", "e": "Plutôt qu'un brûleur de graisse : 2 000 pas de plus par jour et 200 kcal de moins dans l'assiette.", "r": ["deficit", "cafeine", "supplcontam", "neat"], "app": ""}, {"id": "culturisme", "n": "Culturisme", "ab": "Bodybuilding", "t": "Discipline", "lv": "D", "d": "Le sport et l'art de développer son physique : volume musculaire, proportions et définition.", "x": "En compétition, les athlètes sont jugés sur leur apparence : masse, symétrie, sèche, présentation. Il existe des catégories plus ou moins musclées (bodybuilding, classic physique, men's physique, bikini, wellness…) et des fédérations « naturelles » avec contrôles antidopage. Pour la plupart des pratiquants, le culturisme désigne simplement l'entraînement orienté vers l'esthétique.", "u": "Situer son objectif : esthétique, force ou performance.", "e": "Programme orienté culturisme : 3 à 4 séries de 8 à 15 répétitions, beaucoup d'exercices d'isolation.", "r": ["hypertrophie", "cut", "powerlifting", "natural", "aesthetic", "vtaper"], "app": ""}, {"id": "powerlifting", "n": "Force athlétique", "ab": "Powerlifting", "t": "Discipline", "lv": "D", "d": "Un sport de force sur trois mouvements : squat, développé couché et soulevé de terre.", "x": "Chaque athlète a trois essais par mouvement pour soulever la charge maximale ; le total des trois meilleurs essais détermine le classement, par catégorie de poids et d'âge. L'entraînement est centré sur les séries lourdes de 1 à 6 répétitions et la technique.", "u": "Comprendre les programmes et le vocabulaire « force » qu'on croise souvent.", "e": "Total de 400 kg = 150 kg au squat + 100 kg au développé couché + 150 kg au soulevé de terre.", "r": ["force", "1rm", "halterophilie", "culturisme"], "app": ""}, {"id": "halterophilie", "n": "Haltérophilie", "ab": "", "t": "Discipline", "lv": "I", "d": "Un sport olympique sur deux mouvements explosifs : l'arraché et l'épaulé-jeté.", "x": "Les mouvements demandent beaucoup de vitesse, de souplesse et de technique, et s'apprennent idéalement avec un entraîneur. Des variantes simplifiées, comme l'épaulé, sont utilisées dans d'autres sports pour développer la puissance.", "u": "Ne pas confondre avec la force athlétique ou la musculation.", "e": "L'arraché : la barre passe du sol aux bras tendus au-dessus de la tête en un seul mouvement.", "r": ["powerlifting", "force"], "app": ""}, {"id": "callisthenie", "n": "Callisthénie", "ab": "Street workout", "t": "Discipline", "lv": "D", "d": "L'entraînement au poids du corps : pompes, tractions, dips, figures comme le muscle-up ou la planche.", "x": "On progresse en rendant les mouvements plus difficiles (amplitude, leviers, lest, figures) plutôt qu'en ajoutant des disques. C'est une très bonne base de force relative et de contrôle du corps, praticable presque partout.", "u": "S'entraîner sans salle ou varier son entraînement.", "e": "Progression : pompes sur genoux → pompes classiques → pompes pieds surélevés → pompes lestées.", "r": ["surcharge", "force"], "app": ""}, {"id": "valsalva", "n": "Manœuvre de Valsalva", "ab": "", "t": "Concept", "lv": "A", "d": "Bloquer sa respiration ventre gonflé pendant l'effort pour rigidifier le tronc et protéger le dos.", "x": "On inspire profondément dans le ventre avant la descente, on bloque, on pousse, puis on expire en haut. Elle est utile sur les charges lourdes (squat, soulevé de terre) mais fait monter fortement la tension artérielle pendant quelques secondes. En cas d'hypertension, de problème cardiaque ou de glaucome, demande l'avis d'un médecin et privilégie une expiration contrôlée pendant l'effort.", "u": "Stabiliser le dos sur les mouvements lourds.", "e": "Squat : grande inspiration, ventre gainé, descente, remontée, expiration en haut.", "r": ["ceinture", "force", "m_transverse"], "app": ""}, {"id": "ceinture", "n": "Ceinture de force", "ab": "", "t": "Concept", "lv": "I", "d": "Une large ceinture qui aide à garder le tronc rigide sur les charges lourdes.", "x": "Elle ne « tient » pas le dos à ta place : elle donne un appui contre lequel pousser avec les abdominaux, ce qui augmente la pression dans le ventre. Elle est utile sur les séries très lourdes de squat et de soulevé de terre, pas sur les charges légères ni sur les exercices d'isolation. Apprendre d'abord à bien gainer sans ceinture.", "u": "Soulever plus lourd en sécurité sur les gros mouvements, une fois la technique acquise.", "e": "Ceinture pour les séries au-dessus d'environ 80 % de 1RM au squat, pas pour l'échauffement.", "r": ["valsalva", "1rm", "force", "sangles"], "app": ""}, {"id": "pump", "n": "Congestion", "ab": "Pump", "t": "Physiologie", "lv": "D", "d": "La sensation de muscle gonflé et dur pendant et après une série, due à l'afflux de sang.", "x": "Elle est surtout marquée avec des séries de répétitions moyennes à hautes et des repos courts. Elle disparaît en quelques heures. Une bonne congestion est agréable mais n'est pas un indicateur fiable de prise de muscle : la tension mécanique et la proximité de l'échec comptent davantage.", "u": "Profiter de la sensation sans en faire un objectif.", "e": "Bras gonflés après des séries de curl et d'extension enchaînées.", "r": ["hypertrophie", "connexion", "doms", "pumpcover"], "app": ""}, {"id": "memoire", "n": "Mémoire musculaire", "ab": "", "t": "Physiologie", "lv": "D", "d": "La facilité à retrouver sa masse et sa force après une pause, plus vite que la première fois.", "x": "Les fibres musculaires gardent une partie de leurs noyaux supplémentaires acquis à l'entraînement, et le système nerveux garde les gestes en mémoire. Après plusieurs semaines ou mois d'arrêt, on récupère souvent son niveau en beaucoup moins de temps qu'il n'en a fallu pour l'atteindre.", "u": "Ne pas paniquer après une pause : la reprise est rapide.", "e": "Après 2 mois d'arrêt, retrouver ses anciennes charges en 4 à 6 semaines.", "r": ["hypertrophie", "force", "recup"], "app": ""}, {"id": "periodisation", "n": "Périodisation", "ab": "", "t": "Méthode d'entraînement", "lv": "A", "d": "Organiser l'entraînement en périodes avec des objectifs différents, pour progresser sur le long terme.", "x": "Exemples : alterner des blocs plus axés volume (plus de séries, charges modérées) et des blocs plus axés force (charges lourdes, moins de répétitions), avec des semaines de décharge. La périodisation « ondulante » varie les objectifs d'une séance à l'autre. Pour un débutant, une simple progression linéaire suffit largement.", "u": "Continuer à progresser quand les gains faciles s'épuisent.", "e": "4 semaines à 4 × 10, 4 semaines à 5 × 5, 1 semaine de décharge, puis on recommence plus lourd.", "r": ["deload", "surcharge", "plateau", "volume"], "app": ""}, {"id": "mobilite", "n": "Mobilité et étirements", "ab": "", "t": "Concept", "lv": "D", "d": "La capacité à bouger une articulation sur toute son amplitude, et les exercices qui l'entretiennent.", "x": "Avant la séance, mieux vaut des mouvements dynamiques (rotations, balancés, séries légères) que des étirements longs, qui peuvent diminuer un peu la force juste après. Les étirements statiques ont plutôt leur place après la séance ou à part. Les séries en amplitude complète développent déjà beaucoup la mobilité.", "u": "Garder des articulations mobiles et bouger confortablement à l'entraînement.", "e": "Avant un squat : 1 min de rotations de hanches et de chevilles, puis séries d'échauffement.", "r": ["echauffement", "amplitude"], "app": ""}, {"id": "tendinopathie", "n": "Tendinopathie", "ab": "", "t": "Physiologie", "lv": "I", "d": "Une douleur de tendon due à une surcharge, fréquente au coude, à l'épaule ou au genou.", "x": "Elle apparaît souvent après une augmentation trop rapide de charge ou de volume. Le repos complet n'est généralement pas la meilleure solution : on réduit ce qui fait mal et on garde des exercices adaptés, idéalement guidé par un kinésithérapeute. Une douleur vive, un gonflement ou une perte de force soudaine nécessitent un avis médical.", "u": "Adapter son entraînement au lieu de s'arrêter ou de forcer à travers la douleur.", "e": "Douleur au coude au curl barre : passer au curl marteau plus léger et en parler à un kiné.", "r": ["surcharge", "recup", "deload", "m_tendon", "m_coiffe"], "app": "Dans Options › Zones sensibles, coche la zone concernée : l'appli écarte les exercices qui la sollicitent."}, {"id": "sarcopenie", "n": "Sarcopénie", "ab": "", "t": "Physiologie", "lv": "I", "d": "La perte progressive de masse et de force musculaires avec l'âge.", "x": "Elle commence vers 40 ans et s'accélère après 60 ans, avec un impact sur l'autonomie et le risque de chute. La musculation et des protéines suffisantes sont les moyens les plus efficaces de la ralentir, à tout âge : on peut gagner du muscle même après 70 ans.", "u": "Voir la musculation comme un investissement santé à long terme.", "e": "2 séances de musculation par semaine à 65 ans améliorent nettement la force en quelques mois.", "r": ["proteines", "hypertrophie", "force"], "app": ""}, {"id": "reposactif", "n": "Repos actif", "ab": "", "t": "Concept", "lv": "D", "d": "Un jour sans musculation, mais avec une activité légère : marche, vélo tranquille, mobilité.", "x": "Bouger doucement favorise la circulation et la récupération, et maintient la dépense calorique. Il ne doit pas fatiguer : si tu sens les jambes lourdes le lendemain, c'était trop.", "u": "Récupérer sans rester complètement inactif.", "e": "Dimanche : 45 min de marche et 10 min de mobilité.", "r": ["recup", "liss", "neat", "mobilite"], "app": ""}, {"id": "fenetre", "n": "Fenêtre anabolique", "ab": "", "t": "Nutrition", "lv": "I", "d": "L'idée qu'il faudrait absolument manger des protéines dans les 30 minutes après la séance.", "x": "C'est largement un mythe : les études montrent que l'apport total en protéines sur la journée compte bien plus que l'heure exacte. Manger un repas protéiné dans les quelques heures avant ou après l'entraînement suffit. Le timing devient un peu plus important si tu t'entraînes à jeun ou si le repas précédent date de longtemps.", "u": "Se libérer de la pression du shaker immédiat.", "e": "Séance à 18 h, dîner à 20 h avec du poulet : c'est très bien.", "r": ["proteines", "anabolisme", "timing"], "app": ""}, {"id": "timing", "n": "Timing nutritionnel", "ab": "", "t": "Nutrition", "lv": "I", "d": "Le moment où l'on mange par rapport à l'entraînement et dans la journée.", "x": "Les priorités, dans l'ordre : calories totales, protéines totales, puis répartition sur 3 à 5 repas, et enfin le timing autour de la séance. Un repas avec des glucides 1 à 3 h avant améliore souvent l'énergie ; un repas protéiné dans les heures qui suivent aide la récupération. Le reste relève surtout de l'organisation et du confort digestif.", "u": "Savoir où mettre son énergie : d'abord l'essentiel, ensuite les détails.", "e": "Séance à midi : petit-déjeuner complet le matin, déjeuner protéiné après la séance.", "r": ["fenetre", "proteines", "glucides", "macros"], "app": ""}, {"id": "jeune", "n": "Jeûne intermittent", "ab": "", "t": "Nutrition", "lv": "I", "d": "Une organisation des repas sur une plage horaire réduite, par exemple 8 h de repas et 16 h de jeûne.", "x": "Il n'a pas d'effet magique : il fait perdre du poids surtout parce qu'il aide certaines personnes à manger moins. À calories et protéines égales, les résultats sont proches d'une alimentation classique. Il est moins pratique pour qui a du mal à manger assez (prise de masse) et déconseillé en cas d'antécédents de troubles du comportement alimentaire, de diabète traité, de grossesse ou chez les ados.", "u": "Un outil d'organisation parmi d'autres, à choisir s'il te convient.", "e": "Repas entre 12 h et 20 h, avec 2 repas et 1 collation riches en protéines.", "r": ["deficit", "timing", "proteines"], "app": ""}, {"id": "protveg", "n": "Protéines végétales", "ab": "", "t": "Nutrition", "lv": "D", "d": "Les protéines issues des légumineuses, céréales, soja, oléagineux…", "x": "Elles contiennent un peu moins de leucine et sont un peu moins bien digérées que les protéines animales, mais en variant les sources (légumineuses + céréales, soja, tofu) et en visant le haut des recommandations, on progresse très bien en végétarien ou en végan.", "u": "Construire du muscle avec une alimentation végétale ou réduire sa consommation de viande.", "e": "Chili sin carne : haricots rouges + riz, plus un dessert au soja.", "r": ["proteines", "leucine", "eaa"], "app": ""}, {"id": "densitecal", "n": "Densité calorique", "ab": "", "t": "Nutrition", "lv": "D", "d": "La quantité de calories dans un volume donné d'aliment.", "x": "Les aliments très denses (huile, oléagineux, beurre de cacahuète, fromage) apportent beaucoup de calories sous un petit volume : pratiques en prise de masse. Les aliments peu denses (légumes, fruits, soupes, laitages maigres) rassasient avec peu de calories : précieux en sèche.", "u": "Manger plus facilement en prise de masse, et avoir moins faim en sèche.", "e": "30 g d'amandes ≈ 180 kcal, autant qu'environ 1 kg de courgettes.", "r": ["surplus", "deficit", "morphotype"], "app": "Mes repas adapte la densité des assiettes selon ton morphotype."}, {"id": "vitd", "n": "Vitamine D", "ab": "", "t": "Nutrition", "lv": "I", "d": "Une vitamine fabriquée par la peau au soleil, utile aux os, aux muscles et à l'immunité.", "x": "En France, une grande partie de la population en manque en hiver, faute de soleil suffisant. On en trouve dans les poissons gras, les œufs et les produits enrichis. Une supplémentation peut être utile mais se discute avec un médecin, qui peut doser ton taux : en excès, elle devient toxique.", "u": "Penser à elle en hiver, surtout si tu sors peu ou as la peau foncée.", "e": "Sardines et œufs dans la semaine, et une question au médecin à la prochaine prise de sang.", "r": ["micros", "omega3"], "app": ""}, {"id": "electrolytes", "n": "Électrolytes", "ab": "", "t": "Nutrition", "lv": "I", "d": "Les minéraux comme le sodium, le potassium et le magnésium, qui règlent l'hydratation et la contraction musculaire.", "x": "Ils se perdent dans la sueur. Pour une séance de musculation classique, l'eau et une alimentation normale suffisent. Une boisson avec électrolytes peut aider lors d'efforts longs, par forte chaleur ou en cas de très forte transpiration. Les crampes ont souvent d'autres causes que le manque de sel (fatigue, effort inhabituel).", "u": "Savoir quand une boisson de l'effort est utile, et quand elle ne l'est pas.", "e": "Séance d'1 h en salle climatisée : de l'eau suffit.", "r": ["hydratation", "micros"], "app": ""}, {"id": "alcool", "n": "Alcool", "ab": "", "t": "Nutrition", "lv": "D", "d": "Une boisson calorique (7 kcal par gramme) qui gêne la récupération et la prise de muscle.", "x": "Une consommation importante diminue la synthèse des protéines musculaires, perturbe le sommeil, déshydrate et baisse la testostérone. Un verre occasionnel a peu d'impact ; plusieurs verres le soir d'une séance en ont un vrai. Ses calories s'ajoutent souvent sans qu'on y pense.", "u": "Limiter l'alcool, surtout les jours d'entraînement, pour mieux récupérer.", "e": "4 demis de bière (25 cl) le samedi soir ≈ 400 kcal, et une nuit moins réparatrice.", "r": ["sommeil", "recup", "testo", "macros"], "app": ""}, {"id": "spotter", "n": "Pareur", "ab": "Spotter", "t": "Jargon de salle", "lv": "D", "d": "La personne qui surveille et peut aider sur une série lourde, surtout au développé couché et au squat.", "x": "Demander « tu peux me spot ? » est normal en salle. Avant la série, on se met d'accord : combien de répétitions, quand intervenir, et si le pareur aide dès que la barre ralentit ou seulement si elle redescend. Au développé couché, il se place derrière la tête et garde les mains près de la barre ; au squat, mieux vaut des sécurités réglées à la bonne hauteur dans la cage.", "u": "Pousser une série près de l'échec en sécurité.", "e": "« Tu peux me spot ? 5 répétitions, aide-moi seulement si la barre s'arrête. »", "r": ["echec", "etiquette", "egolift"], "app": ""}, {"id": "egolift", "n": "Ego lifting", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Soulever trop lourd pour impressionner, au détriment de la technique et de l'amplitude.", "x": "Typiquement : demi-répétitions, gros élan, dos qui s'arrondit, rebond de la barre sur la poitrine. Le muscle travaille moins bien, et le risque de blessure monte nettement. L'inverse, c'est de choisir une charge qui permet un mouvement complet et contrôlé, quitte à prendre moins lourd que le voisin.", "u": "Progresser plus vite et sans blessure en laissant son ego au vestiaire.", "e": "Retirer 20 kg au squat pour descendre enfin aux cuisses parallèles.", "r": ["amplitude", "cheatreps", "formcheck", "surcharge"], "app": ""}, {"id": "gymbro", "n": "Gym bro", "ab": "Gymbro", "t": "Jargon de salle", "lv": "D", "d": "Un habitué de la salle, passionné de muscu. Le terme est souvent affectueux, parfois moqueur.", "x": "Le gym bro a ses rituels : shaker, pré-workout, chest day le lundi, conseils non sollicités. Il est souvent associé à la « bro science », ces croyances transmises en salle qui ne sont pas toujours fondées. Au féminin, on entend « gym girl ».", "u": "Comprendre la culture de salle et faire le tri dans les conseils entendus.", "e": "« Un gym bro m'a dit de manger toutes les 2 heures sinon je perds mes muscles. »", "r": ["broscience", "gymrat", "chestday"], "app": ""}, {"id": "gymrat", "n": "Gym rat", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Quelqu'un qui vit presque à la salle et s'entraîne très souvent.", "x": "Plutôt positif : il désigne la régularité et la passion. Attention à ne pas confondre assiduité et efficacité : passer 2 h par jour à la salle n'est pas nécessaire pour progresser, et la récupération reste indispensable.", "u": "Se rappeler que la régularité compte plus que la quantité.", "e": "« Je suis devenu un vrai gym rat : 5 séances par semaine depuis un an. »", "r": ["gymbro", "recup", "frequence"], "app": ""}, {"id": "broscience", "n": "Bro science", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Les croyances transmises en salle de bouche à oreille, sans preuve scientifique.", "x": "Exemples : « il faut manger dans les 30 minutes sinon les muscles fondent », « les abdos se font avec 500 crunchs par jour », « le cardio fait fondre le muscle ». Certaines contiennent une part de vrai, d'autres sont fausses. Le réflexe : se demander d'où vient l'info et si elle est confirmée par des études.", "u": "Garder un esprit critique face aux conseils de salle et des réseaux sociaux.", "e": "« Les crunchs brûlent le gras du ventre » : faux, on ne perd pas le gras à un endroit précis.", "r": ["gymbro", "fenetre", "fitfluenceur"], "app": ""}, {"id": "chestday", "n": "Chest day / Leg day", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Le jour consacré aux pectoraux (« chest day ») ou aux jambes (« leg day »).", "x": "Le lundi est surnommé « international chest day » car beaucoup de salles voient leurs bancs de développé couché pris d'assaut ce jour-là. « Skip leg day » se moque de ceux qui négligent les jambes : haut du corps massif, jambes fines. Travailler les jambes compte autant que le reste pour l'équilibre, la force et la santé.", "u": "Comprendre les blagues de salle et éviter le piège du « no leg day ».", "e": "« Lundi c'est chest day, banc de développé couché introuvable. »", "r": ["split", "ppl", "gymbro"], "app": ""}, {"id": "gains", "n": "Gains", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Les progrès réalisés grâce à l'entraînement : muscle, force, physique.", "x": "« Faire des gains » signifie progresser ; « perdre ses gains » est la peur classique quand on rate des séances ou qu'on part en vacances. En réalité, une ou deux semaines d'arrêt n'entraînent quasiment aucune perte de muscle, et ce qui est perdu revient vite grâce à la mémoire musculaire.", "u": "Relativiser une pause et rester motivé.", "e": "« 15 jours de vacances, j'ai peur de perdre mes gains » : aucun risque réel.", "r": ["newbiegains", "memoire", "hypertrophie"], "app": ""}, {"id": "newbiegains", "n": "Gains de débutant", "ab": "Newbie gains", "t": "Jargon de salle", "lv": "D", "d": "Les progrès rapides de la première année, quand le corps découvre l'entraînement.", "x": "Pendant les premiers mois, la force augmente très vite (le système nerveux apprend les mouvements) et le muscle se développe facilement, même avec un programme imparfait. Cette période est à exploiter avec une progression régulière des charges. Les progrès ralentissent ensuite : c'est normal, pas un signe d'échec.", "u": "Profiter de cette période et ne pas s'inquiéter du ralentissement qui suit.", "e": "Passer de 30 à 55 kg au développé couché en 8 mois, puis prendre 5 kg l'année suivante.", "r": ["gains", "natural", "surcharge", "plateau"], "app": ""}, {"id": "hardgainer", "n": "Hardgainer", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Une personne qui a beaucoup de mal à prendre du poids et du muscle.", "x": "Souvent mince, avec un appétit modeste ou une forte activité au quotidien. Dans la grande majorité des cas, le problème n'est pas la génétique mais les calories : on mange moins qu'on ne le pense. Les solutions : aliments denses, collations, calories liquides (lait, smoothies), 4 à 5 prises par jour et un suivi de la balance.", "u": "Identifier le vrai frein (les calories) plutôt que d'accuser son corps.", "e": "Ajouter un smoothie lait-banane-flocons-beurre de cacahuète (≈ 600 kcal) chaque après-midi.", "r": ["morphotype", "bulk", "surplus", "densitecal", "gainer"], "app": "Mes repas adapte les portions et propose un smoothie de masse pour les profils « du mal à prendre »."}, {"id": "skinnyfat", "n": "Skinny fat", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Une silhouette mince habillée, mais avec peu de muscle et un peu de gras au ventre.", "x": "Le poids est normal, mais la composition corporelle est défavorable. La bonne stratégie est souvent la recomposition : musculation sérieuse, protéines élevées et calories proches de la maintenance, plutôt qu'une sèche qui ferait perdre le peu de muscle, ou une grosse prise de masse.", "u": "Choisir la bonne stratégie de départ.", "e": "70 kg pour 1,78 m, ventre un peu mou : 6 mois de musculation à la maintenance avec 1,8 g/kg de protéines.", "r": ["recompo", "masses", "proteines", "m_abdo"], "app": ""}, {"id": "shredded", "n": "Sec", "ab": "Shredded", "t": "Jargon de salle", "lv": "D", "d": "Très peu de graisse, avec des muscles bien dessinés et des veines visibles.", "x": "On entend aussi « sec », « dry », « cut » ou « défini ». Un niveau très sec n'est pas tenable toute l'année, surtout en naturel : il demande un déficit prolongé et affecte souvent l'énergie, le sommeil et la libido. Les photos de réseaux sociaux sont souvent prises au meilleur moment, avec lumière, pump et parfois retouches.", "u": "Avoir des attentes réalistes sur son physique.", "e": "Abdos visibles le jour du shooting, beaucoup moins nets le reste de l'année.", "r": ["cut", "seche", "masses", "fitfluenceur"], "app": ""}, {"id": "aesthetic", "n": "Aesthetic", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Un physique jugé harmonieux : épaules larges, taille fine, proportions équilibrées.", "x": "Le mot vient de la culture bodybuilding des années 2010 et désigne un idéal plus « classique » que la masse pure. On parle aussi de « V-taper » pour la forme en V du buste. L'esthétique dépend aussi de la génétique (insertions musculaires, ossature), qu'on ne peut pas changer.", "u": "Définir son objectif physique avec des mots partagés en salle.", "e": "Travailler épaules (côté) et dos pour accentuer le V.", "r": ["vtaper", "culturisme", "shredded"], "app": ""}, {"id": "vtaper", "n": "V-taper", "ab": "", "t": "Jargon de salle", "lv": "I", "d": "La forme en V du buste : épaules et dos larges, taille fine.", "x": "On l'obtient surtout en développant les grands dorsaux (tirages, tractions) et le côté des épaules (élévations latérales), tout en gardant un taux de graisse raisonnable. La largeur des hanches et des clavicules reste génétique.", "u": "Orienter son programme vers un objectif esthétique précis.", "e": "Ajouter des séries de tirage vertical et d'élévations latérales.", "r": ["aesthetic", "volume", "isolation", "m_lats", "m_delt"], "app": ""}, {"id": "dirtybulk", "n": "Dirty bulk", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Une prise de masse sans contrôle, en mangeant beaucoup de tout, y compris fast-food et sucreries.", "x": "On prend vite du poids, mais une grande partie est de la graisse, qu'il faudra perdre ensuite avec une longue sèche. Le gain de muscle n'est pas plus rapide qu'avec un surplus modéré. Peut se comprendre ponctuellement chez un hardgainer, mais reste rarement la meilleure option.", "u": "Faire la différence avec une prise de masse propre.", "e": "+10 kg en 6 mois, dont une bonne part de ventre : la sèche suivante durera des mois.", "r": ["bulk", "leanbulk", "surplus", "hardgainer"], "app": ""}, {"id": "gainer", "n": "Gainer", "ab": "Mass gainer", "t": "Supplément", "lv": "D", "d": "Une poudre très calorique, surtout des glucides et des protéines, pour aider à prendre du poids.", "x": "Une dose apporte souvent 500 à 1 000 kcal. Pratique pour un hardgainer, mais souvent cher et riche en sucres. Un smoothie maison (lait, banane, flocons d'avoine, beurre de cacahuète) fait la même chose, moins cher et avec de vrais aliments.", "u": "Compléter facilement ses calories en prise de masse.", "e": "Smoothie maison à 600 kcal plutôt qu'un gainer à 40 € le sachet.", "r": ["hardgainer", "bulk", "whey", "densitecal"], "app": ""}, {"id": "cheatreps", "n": "Répétitions trichées", "ab": "Cheat reps", "t": "Jargon de salle", "lv": "I", "d": "Des répétitions faites avec élan ou en aidant avec d'autres muscles, pour finir une série.", "x": "Utilisées volontairement en fin de série sur un exercice sûr (curl, élévations), elles prolongent l'effort. Utilisées dès la première répétition, c'est de l'ego lifting : le muscle visé travaille moins et le risque de blessure augmente.", "u": "Savoir quand un peu d'élan est un outil, et quand c'est de la triche contre soi-même.", "e": "Curl : 10 répétitions strictes, puis 2 avec un léger élan pour finir.", "r": ["egolift", "echec", "partials"], "app": ""}, {"id": "partials", "n": "Répétitions partielles", "ab": "Partials", "t": "Jargon de salle", "lv": "A", "d": "Des répétitions sur une partie seulement de l'amplitude, volontairement.", "x": "Une tendance forte depuis 2024 : les « lengthened partials », des demi-répétitions dans la partie étirée du mouvement (bas du développé, bas du curl incliné). Les études suggèrent qu'elles sont efficaces pour la prise de muscle, souvent ajoutées en fin de série quand on ne peut plus faire de répétition complète. À ne pas confondre avec les demi-répétitions de l'ego lifting.", "u": "Prolonger une série en restant dans la partie la plus efficace du mouvement.", "e": "Curl incliné : 10 répétitions complètes, puis 5 demi-répétitions dans la partie basse.", "r": ["amplitude", "echec", "cheatreps", "restpause"], "app": ""}, {"id": "myoreps", "n": "Myo-reps", "ab": "", "t": "Méthode d'entraînement", "lv": "A", "d": "Une série d'activation près de l'échec, suivie de mini-séries de quelques répétitions entrecoupées de pauses très courtes.", "x": "Exemple : 12 à 15 répétitions, 5 respirations de pause, 3 à 5 répétitions, pause, et ainsi de suite tant qu'on garde le nombre de répétitions. Proche du rest-pause, la méthode accumule beaucoup de répétitions efficaces en peu de temps. Plutôt pour les machines et l'isolation.", "u": "Gagner du temps sur les exercices d'isolation.", "e": "Leg extension : 15 rép, 15 s, 4 rép, 15 s, 4 rép, 15 s, 3 rép.", "r": ["restpause", "dropset", "serieeff"], "app": ""}, {"id": "clusterset", "n": "Cluster set", "ab": "", "t": "Méthode d'entraînement", "lv": "A", "d": "Une série découpée en petits blocs avec 10 à 30 secondes de pause, pour garder une charge lourde plus longtemps.", "x": "Au lieu de 6 répétitions d'affilée, on fait par exemple 3 × 2 répétitions avec 20 s de pause. On garde ainsi une bonne vitesse et une bonne technique sur toutes les répétitions. Utilisé surtout en force et en haltérophilie.", "u": "Travailler lourd avec moins de fatigue technique.", "e": "Squat à 85 % : 2 rép, 20 s, 2 rép, 20 s, 2 rép.", "r": ["force", "restpause"], "app": ""}, {"id": "junkvolume", "n": "Junk volume", "ab": "", "t": "Jargon de salle", "lv": "I", "d": "Des séries « poubelles » : trop faciles, trop nombreuses ou faites trop fatigué pour apporter un vrai stimulus.", "x": "Au-delà d'un certain nombre de séries de qualité par muscle et par séance, chaque série supplémentaire rapporte très peu et fatigue beaucoup. Mieux vaut moins de séries, mais proches de l'échec et bien exécutées.", "u": "Raccourcir ses séances sans perdre en efficacité.", "e": "Faire 4 séries vraiment difficiles au lieu de 10 séries tièdes.", "r": ["serieeff", "volume", "rir"], "app": ""}, {"id": "topset", "n": "Top set et back-off sets", "ab": "", "t": "Jargon de salle", "lv": "I", "d": "Une série principale lourde (top set), suivie de séries un peu plus légères (back-off sets).", "x": "Après l'échauffement, on fait une seule série à la charge la plus lourde du jour, puis on baisse de 10 à 20 % pour 2 ou 3 séries de volume. On combine ainsi un travail de force et du volume, sans s'épuiser sur la série lourde.", "u": "Progresser en force tout en accumulant du volume.", "e": "Squat : 1 × 5 à 100 kg (top set), puis 3 × 8 à 85 kg (back-off).", "r": ["force", "volume", "echauffement", "workingset"], "app": ""}, {"id": "workingset", "n": "Série de travail", "ab": "Working set", "t": "Jargon de salle", "lv": "D", "d": "Une vraie série de l'exercice, à la charge prévue, par opposition aux séries d'échauffement.", "x": "Ce sont les séries qu'on compte dans le volume et qu'on cherche à faire progresser. Les séries d'échauffement ou d'approche, plus légères, ne comptent pas.", "u": "Compter correctement son volume.", "e": "Squat : 2 séries d'échauffement, puis 3 working sets à 80 kg.", "r": ["echauffement", "serieeff", "volume"], "app": "Pendant le minuteur, les pastilles S1, S2, S3 sont tes séries de travail ; É1, É2 sont l'échauffement."}, {"id": "grind", "n": "Répétition grindée", "ab": "Grind", "t": "Jargon de salle", "lv": "I", "d": "Une répétition qui monte très lentement, à la limite de l'échec.", "x": "« Grinder une rép » signifie la finir difficilement, avec une vitesse qui ralentit fortement. C'est le signe qu'on est à 0 ou 1 répétition en réserve. Fréquent sur les records, à éviter si la technique se dégrade.", "u": "Reconnaître quand on est vraiment proche de l'échec.", "e": "La 5e répétition du squat monte en 3 secondes : grindée, c'était la dernière.", "r": ["echec", "rir", "rpe", "lockout"], "app": ""}, {"id": "lockout", "n": "Verrouillage", "ab": "Lockout", "t": "Jargon de salle", "lv": "I", "d": "La fin d'une répétition, bras ou jambes tendus et charge stabilisée.", "x": "Au soulevé de terre, c'est la position debout hanches tendues ; au développé couché, les bras tendus. Certaines répétitions « bloquent au lockout » quand ce sont les triceps ou les fessiers qui lâchent.", "u": "Comprendre où l'on bloque pour cibler les faiblesses.", "e": "« Je bloque au lockout du bench » : ce sont souvent les triceps qui manquent.", "r": ["grind", "force", "amplitude"], "app": ""}, {"id": "formcheck", "n": "Form check", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Se filmer ou demander un avis pour vérifier sa technique.", "x": "Filmer une série de profil ou de trois quarts permet de voir ce qu'on ne sent pas : dos qui s'arrondit, genoux qui rentrent, amplitude incomplète. Partager la vidéo à un coach ou à quelqu'un d'expérimenté aide à corriger plus vite. Pense à respecter l'intimité des autres en filmant.", "u": "Progresser en technique et réduire le risque de blessure.", "e": "Filmer son squat de profil pour vérifier la profondeur.", "r": ["egolift", "amplitude", "etiquette"], "app": ""}, {"id": "etiquette", "n": "Savoir-vivre en salle", "ab": "Gym etiquette", "t": "Jargon de salle", "lv": "D", "d": "Les règles implicites pour que tout le monde s'entraîne bien.", "x": "Ranger ses disques et haltères (« re-racker »), essuyer son banc et la machine, ne pas monopoliser un poste pendant 20 minutes avec son téléphone, proposer d'alterner (« je peux alterner avec toi ? »), ne pas filmer les autres sans leur accord, ne pas donner de conseils non sollicités, et laisser de la place devant les miroirs.", "u": "S'intégrer facilement et éviter les tensions.", "e": "« Je peux faire mes séries entre les tiennes ? » sur une machine occupée.", "r": ["spotter", "gymtimidation", "formcheck"], "app": "Le bouton « Machine occupée ? » te propose un équivalent quand un poste est pris."}, {"id": "gymtimidation", "n": "Peur de la salle", "ab": "Gymtimidation", "t": "Jargon de salle", "lv": "D", "d": "Le stress ou la gêne ressentis en salle, surtout au début : peur d'être jugé, de mal faire, de ne pas savoir utiliser les machines.", "x": "C'est extrêmement courant. Quelques astuces : venir aux heures creuses, arriver avec un programme précis, commencer par des machines guidées, regarder la fiche de l'exercice avant, et se rappeler que la plupart des gens sont concentrés sur leur propre séance. Les habitués ont tous été débutants.", "u": "Oser commencer et rester régulier.", "e": "Première semaine : séance à 14 h avec 5 machines repérées à l'avance.", "r": ["etiquette", "newbiegains"], "app": ""}, {"id": "fitfluenceur", "n": "Fitfluenceur", "ab": "Fitfluencer", "t": "Jargon de salle", "lv": "D", "d": "Un influenceur fitness sur les réseaux sociaux (Instagram, TikTok, YouTube).", "x": "Certains partagent des contenus sérieux et sourcés, d'autres vendent surtout des programmes, compléments ou codes promo. Leurs physiques sont souvent le résultat de nombreuses années, d'une bonne génétique, d'un éclairage flatteur et parfois de dopage non avoué. Vérifie les sources et méfie-toi des promesses rapides.", "u": "Faire le tri dans les contenus fitness en ligne.", "e": "« Prends 10 kg de muscle en 90 jours avec mon programme » : promesse irréaliste en naturel.", "r": ["broscience", "natural", "dopage", "shredded"], "app": ""}, {"id": "hybrid", "n": "Athlète hybride", "ab": "Hybrid athlete", "t": "Jargon de salle", "lv": "I", "d": "Quelqu'un qui combine musculation et endurance sérieuse (course, vélo, Hyrox…).", "x": "Une tendance forte de ces dernières années. Il est tout à fait possible de progresser dans les deux, à condition de bien organiser la semaine : séparer les séances de jambes lourdes et les sorties longues, manger suffisamment et accepter une progression un peu plus lente sur chaque qualité.", "u": "Organiser un entraînement mixte sans se cramer.", "e": "Lundi haut du corps, mardi course facile, jeudi bas du corps, samedi sortie longue.", "r": ["cardio", "zone2", "recup"], "app": ""}, {"id": "zone2", "n": "Zone 2", "ab": "", "t": "Jargon de salle", "lv": "I", "d": "Un cardio à intensité modérée, où l'on peut encore tenir une conversation en phrases complètes.", "x": "Popularisée ces dernières années, la zone 2 correspond à une intensité confortable (souvent autour de 60 à 70 % de la fréquence cardiaque maximale). Elle améliore l'endurance de base et la santé cardiovasculaire en fatiguant peu, ce qui la rend compatible avec la musculation.", "u": "Faire du cardio utile sans nuire à ses séances de muscu.", "e": "40 min de vélo d'appartement en pouvant parler sans être essoufflé.", "r": ["liss", "cardio", "hybrid"], "app": ""}, {"id": "iifym", "n": "Flexible dieting", "ab": "IIFYM", "t": "Jargon de salle", "lv": "I", "d": "Une approche où tout aliment est permis tant qu'il rentre dans ses calories et macros (« If It Fits Your Macros »).", "x": "Elle s'oppose au « clean eating » strict. L'idée est juste : ce sont les calories et les macros qui déterminent les résultats sur le poids. Mais en pratique, une base d'aliments peu transformés reste importante pour la santé, la satiété et les micronutriments. Le bon compromis : environ 80 % d'aliments simples, 20 % de plaisir.", "u": "Tenir son alimentation sur la durée sans frustration.", "e": "Une barre chocolatée intégrée dans les calories du jour, plutôt que la culpabilité.", "r": ["macros", "cheatmeal", "micros"], "app": ""}, {"id": "pumpcover", "n": "Pump cover", "ab": "", "t": "Jargon de salle", "lv": "D", "d": "Un t-shirt ou sweat ample porté au début de la séance, enlevé quand on est « pumpé ».", "x": "Petite blague de salle : on garde le pull large pendant l'échauffement, puis on le retire quand les muscles sont congestionnés. Côté pratique, garder une couche chaude au début aide aussi à s'échauffer.", "u": "Comprendre une expression courante (et rester au chaud en début de séance).", "e": "« J'enlève le pump cover après les séries de bench. »", "r": ["pump", "echauffement"], "app": ""}, {"id": "sangles", "n": "Sangles et magnésie", "ab": "Straps, chalk", "t": "Jargon de salle", "lv": "I", "d": "Des accessoires pour mieux tenir la barre : les sangles (straps) enroulées autour de la barre, et la magnésie (chalk) contre la transpiration.", "x": "Sur les tirages lourds (soulevé de terre, rowing, tractions lestées), la prise lâche souvent avant le dos. Les sangles permettent de continuer à travailler le dos ; mieux vaut quand même entraîner sa prise sans sangles sur une partie des séries. Certaines salles interdisent la magnésie en poudre : il existe des versions liquides.", "u": "Ne plus être limité par la prise sur les exercices de dos.", "e": "Soulevé de terre : séries d'échauffement sans sangles, séries lourdes avec.", "r": ["force", "ceinture"], "app": ""}, {"id": "m_pec", "n": "Grand pectoral", "ab": "Pecs", "t": "Anatomie", "lv": "D", "d": "Le grand muscle en éventail du devant de la poitrine.", "x": "Il part de la clavicule, du sternum et des côtes, et s'attache sur le haut de l'humérus. Il rapproche le bras du corps et vers l'avant (pousser, serrer les bras). On distingue souvent la partie haute (claviculaire), plus sollicitée sur les développés inclinés, et la partie moyenne et basse (sternale). On ne peut pas « isoler le bas » ou « l'intérieur » des pectoraux : on modifie seulement un peu la répartition du travail.", "u": "Savoir quels mouvements le travaillent : développés (barre, haltères, machine), pompes, dips, écartés et pec deck.", "e": "Développé incliné pour insister sur le haut des pectoraux, écarté poulie pour le travail en étirement.", "r": ["m_delt", "m_tri", "m_dentele", "polyarti"], "app": "Compté dans « Pectoraux » sur la carte Équilibre du programme."}, {"id": "m_delt", "n": "Deltoïde", "ab": "Épaules", "t": "Anatomie", "lv": "D", "d": "Le muscle arrondi de l'épaule, en trois parties : avant, côté et arrière.", "x": "Le faisceau antérieur (avant) lève le bras devant soi et travaille déjà beaucoup dans tous les développés. Le faisceau latéral (côté) écarte le bras sur le côté et donne la largeur des épaules : il demande souvent des exercices dédiés. Le faisceau postérieur (arrière) tire le bras vers l'arrière ; il est souvent sous-développé et important pour l'équilibre et la santé de l'épaule.", "u": "Équilibrer les trois faisceaux : développés pour l'avant, élévations latérales pour le côté, oiseau et face pull pour l'arrière.", "e": "Programme qui manque d'épaules arrière : ajouter 3 séries de face pull deux fois par semaine.", "r": ["m_coiffe", "m_pec", "m_trap", "vtaper"], "app": "Compté dans « Épaules avant », « Épaules côtés » et « Épaules arrière » sur la carte Équilibre."}, {"id": "m_lats", "n": "Grand dorsal", "ab": "Lats", "t": "Anatomie", "lv": "D", "d": "Le plus grand muscle du dos, qui part du bas du dos et s'attache sous l'épaule.", "x": "En latin Latissimus dorsi, d'où « lats ». Il ramène le bras vers le bas et vers le corps (tirer de haut en bas, tirer vers soi) et participe à la stabilité du tronc. C'est lui qui donne la largeur du dos et la forme en V.", "u": "Le développer avec les tractions, le tirage vertical, le rowing et le tirage bras tendus.", "e": "Au tirage vertical, penser à « mettre les coudes dans les poches arrière » pour bien le sentir.", "r": ["m_trap", "m_rhomb", "m_grandrond", "vtaper", "connexion"], "app": "Compté dans « Dos » sur la carte Équilibre."}, {"id": "m_trap", "n": "Trapèze", "ab": "Traps", "t": "Anatomie", "lv": "D", "d": "Le grand muscle en losange du haut du dos et de la nuque, en trois parties.", "x": "Le trapèze supérieur hausse les épaules (shrugs, marche du fermier). Le trapèze moyen rapproche les omoplates (rowing, oiseau). Le trapèze inférieur abaisse et stabilise les omoplates, important pour la santé des épaules. Les « trapèzes » visibles près du cou sont surtout la partie supérieure.", "u": "Travailler aussi les parties moyenne et basse, pas seulement les shrugs, pour des épaules saines et une bonne posture.", "e": "Rowing et face pull pour le milieu, shrugs pour le haut.", "r": ["m_rhomb", "m_lats", "m_delt"], "app": "Compté dans « Trapèzes » sur la carte Équilibre."}, {"id": "m_rhomb", "n": "Rhomboïdes", "ab": "", "t": "Anatomie", "lv": "I", "d": "Deux petits muscles entre la colonne et l'omoplate, sous le trapèze.", "x": "Ils rapprochent les omoplates l'une de l'autre et les stabilisent. On ne les voit pas, mais ils comptent beaucoup pour la posture et la qualité des mouvements de tirage.", "u": "Penser à serrer les omoplates en fin de rowing pour les engager.", "e": "Tirage horizontal : marquer 1 seconde omoplates serrées à chaque répétition.", "r": ["m_trap", "m_lats"], "app": "Travaillés avec le « Dos » et les « Trapèzes » sur la carte Équilibre."}, {"id": "m_grandrond", "n": "Grand rond", "ab": "", "t": "Anatomie", "lv": "A", "d": "Un petit muscle épais sous l'omoplate, qui aide le grand dorsal.", "x": "Il ramène le bras vers le bas et vers l'arrière, comme le grand dorsal, d'où son surnom de « petit assistant du dorsal ». Développé, il épaissit le dos vu de dos, juste sous l'aisselle.", "u": "Il travaille automatiquement avec les tirages : pas besoin d'exercice spécifique.", "e": "Tractions et rowing sollicitent à la fois le grand dorsal et le grand rond.", "r": ["m_lats", "m_coiffe"], "app": "Compté avec le « Dos » sur la carte Équilibre."}, {"id": "m_coiffe", "n": "Coiffe des rotateurs", "ab": "", "t": "Anatomie", "lv": "I", "d": "Quatre petits muscles profonds qui maintiennent la tête de l'humérus dans l'épaule.", "x": "Ce sont le sus-épineux, le sous-épineux, le petit rond et le sous-scapulaire. Ils font tourner le bras et, surtout, stabilisent l'articulation pendant les développés et les tirages. Ils sont souvent en cause dans les douleurs d'épaule. Des exercices légers de rotation externe, à la poulie ou avec un élastique, aident à les renforcer.", "u": "Prévenir les douleurs d'épaule, surtout si tu fais beaucoup de développés.", "e": "En fin de séance haut du corps : 2 séries légères de rotation externe à la poulie.", "r": ["m_delt", "m_grandrond", "tendinopathie"], "app": "Si tes épaules sont fragiles, coche « Épaules » dans Options › Zones sensibles."}, {"id": "m_dentele", "n": "Dentelé antérieur", "ab": "Serratus", "t": "Anatomie", "lv": "A", "d": "Le muscle en dents de scie sur les côtes, sous l'aisselle.", "x": "Il plaque l'omoplate contre la cage thoracique et l'aide à monter quand on lève le bras au-dessus de la tête. Un dentelé faible peut donner une omoplate qui « décolle ». Il est visible chez les personnes sèches, sur les côtes.", "u": "Le savoir utile pour des épaules stables ; les pompes et développés le sollicitent déjà.", "e": "Pompes en poussant bien jusqu'en haut, omoplates écartées.", "r": ["m_pec", "m_coiffe"], "app": "Pas suivi séparément dans l'appli : il travaille avec les pectoraux et les épaules."}, {"id": "m_erect", "n": "Érecteurs du rachis", "ab": "Lombaires", "t": "Anatomie", "lv": "D", "d": "Les muscles qui longent la colonne vertébrale, des lombaires jusqu'à la nuque.", "x": "Ils redressent et maintiennent le dos droit. En musculation, ils travaillent beaucoup en isométrie (sans bouger) dans le soulevé de terre, le squat ou le rowing barre, pour garder le dos neutre. Des lombaires solides protègent le dos.", "u": "Renforcer le bas du dos avec les extensions lombaires, le soulevé de terre roumain et le good morning, progressivement.", "e": "Extensions lombaires au banc, sans hyper-cambrer en haut.", "r": ["m_fessier", "m_ischio", "valsalva"], "app": "Compté dans « Lombaires » sur la carte Équilibre."}, {"id": "m_biceps", "n": "Biceps brachial", "ab": "Biceps", "t": "Anatomie", "lv": "D", "d": "Le muscle à deux chefs du devant du bras.", "x": "Il plie le coude et tourne l'avant-bras paume vers le haut (supination). Ses deux chefs (long et court) partent de l'omoplate, il travaille donc un peu plus quand le bras est derrière le corps (curl incliné) ou devant (curl pupitre). Il participe à tous les tirages.", "u": "Le développer avec les curls, en variant les angles.", "e": "Curl incliné pour le travail en étirement, curl pupitre pour la contraction.", "r": ["m_brachial", "m_brachiorad", "m_tri"], "app": "Compté dans « Biceps » sur la carte Équilibre."}, {"id": "m_brachial", "n": "Brachial", "ab": "", "t": "Anatomie", "lv": "I", "d": "Un muscle sous le biceps qui plie le coude, quelle que soit la position de la main.", "x": "C'est en réalité le fléchisseur du coude le plus puissant. Développé, il pousse le biceps vers le haut et élargit le bras. Il travaille particulièrement en prise neutre (curl marteau) ou en pronation.", "u": "Ajouter du curl marteau pour des bras plus épais.", "e": "3 séries de curl marteau après le curl classique.", "r": ["m_biceps", "m_brachiorad"], "app": "Compté avec les « Biceps » sur la carte Équilibre."}, {"id": "m_brachiorad", "n": "Brachio-radial", "ab": "Long supinateur", "t": "Anatomie", "lv": "I", "d": "Le muscle du haut de l'avant-bras, côté pouce.", "x": "Il plie le coude, surtout en prise neutre (pouce vers le haut). Il donne du volume à l'avant-bras près du coude. Ancien nom : long supinateur.", "u": "Le travailler avec le curl marteau et le curl en pronation.", "e": "Curl marteau : il travaille avec le brachial et le biceps.", "r": ["m_brachial", "m_avbras", "m_biceps"], "app": "Compté dans « Avant-bras » sur la carte Équilibre."}, {"id": "m_tri", "n": "Triceps brachial", "ab": "Triceps", "t": "Anatomie", "lv": "D", "d": "Le muscle à trois chefs de l'arrière du bras, qui représente environ les deux tiers du volume du bras.", "x": "Il tend le coude. Le chef long part de l'omoplate : il travaille davantage quand le bras est au-dessus de la tête (extension nuque) ou en étirement. Les chefs latéral et médial travaillent dans toutes les extensions. Il participe à tous les développés et aux dips.", "u": "Pour des bras plus gros, travailler les triceps autant que les biceps.", "e": "Extension nuque pour le chef long, extension à la poulie pour l'ensemble.", "r": ["m_biceps", "m_pec", "m_delt"], "app": "Compté dans « Triceps » sur la carte Équilibre."}, {"id": "m_avbras", "n": "Avant-bras", "ab": "", "t": "Anatomie", "lv": "D", "d": "L'ensemble des muscles entre le coude et le poignet : fléchisseurs (paume) et extenseurs (dos de la main).", "x": "Ils assurent la prise et stabilisent le poignet. Ils travaillent beaucoup dans tous les tirages et le soulevé de terre ; une prise qui lâche limite souvent ces exercices. Des avant-bras solides réduisent aussi les douleurs de coude.", "u": "Renforcer la prise avec la marche du fermier, les tirages sans sangles et le curl poignets.", "e": "Marche du fermier en fin de séance : 3 trajets de 30 m.", "r": ["m_brachiorad", "sangles"], "app": "Compté dans « Avant-bras » sur la carte Équilibre."}, {"id": "m_abdo", "n": "Grand droit de l'abdomen", "ab": "Abdos", "t": "Anatomie", "lv": "D", "d": "Le muscle des « tablettes » du ventre, du sternum au pubis.", "x": "Il enroule le buste (rapproche le thorax du bassin) et stabilise le tronc. Les « tablettes » sont dues à ses intersections tendineuses ; les voir dépend surtout du taux de graisse, pas du nombre de crunchs. On ne perd pas le gras du ventre en travaillant les abdos : c'est le déficit calorique qui compte.", "u": "Le travailler avec crunchs, relevés de jambes et gainage, et le révéler par l'alimentation.", "e": "Crunch à la poulie en progressant en charge comme pour les autres muscles.", "r": ["m_obliques", "m_transverse", "shredded"], "app": "Compté dans « Abdos » sur la carte Équilibre."}, {"id": "m_obliques", "n": "Obliques", "ab": "", "t": "Anatomie", "lv": "D", "d": "Les muscles des flancs : obliques externes et internes.", "x": "Ils font tourner et incliner le buste, et résistent aux rotations. Ils stabilisent le tronc dans les mouvements unilatéraux et la marche du fermier. Très développés et avec du gras par-dessus, ils peuvent élargir la taille visuellement.", "u": "Les travailler avec le gainage latéral, les rotations et les exercices unilatéraux.", "e": "Gainage latéral 3 × 30 s par côté.", "r": ["m_abdo", "m_transverse"], "app": "Comptés dans « Abdos » sur la carte Équilibre."}, {"id": "m_transverse", "n": "Transverse de l'abdomen", "ab": "", "t": "Anatomie", "lv": "I", "d": "Le muscle le plus profond du ventre, qui l'entoure comme une ceinture.", "x": "Il comprime le ventre et augmente la pression abdominale qui stabilise le dos lors des charges lourdes. Il travaille quand on « rentre » ou « gaine » le ventre, et pendant la respiration bloquée.", "u": "Apprendre à gainer pour protéger le dos sur les gros mouvements.", "e": "Avant un squat : inspiration dans le ventre, gainage, puis descente.", "r": ["m_abdo", "valsalva", "ceinture"], "app": "Travaillé avec les « Abdos » et pendant tous les gros mouvements."}, {"id": "m_fessier", "n": "Grand fessier", "ab": "Fessiers", "t": "Anatomie", "lv": "D", "d": "Le muscle le plus volumineux du corps, qui forme l'essentiel des fesses.", "x": "Il tend la hanche (ramène la cuisse en arrière, remonte du bas du squat), la fait tourner vers l'extérieur et stabilise le bassin. Il est central dans le squat, le soulevé de terre, le hip thrust et la course.", "u": "Le développer avec hip thrust, soulevé de terre roumain, squat profond et fentes.", "e": "Hip thrust : marquer 1 seconde en haut en serrant les fessiers.", "r": ["m_moyenfessier", "m_ischio", "m_quad"], "app": "Compté dans « Fessiers » sur la carte Équilibre."}, {"id": "m_moyenfessier", "n": "Moyen fessier", "ab": "", "t": "Anatomie", "lv": "I", "d": "Le muscle du haut et du côté de la fesse, sous le grand fessier.", "x": "Il écarte la cuisse et surtout stabilise le bassin quand on est sur une jambe (marche, course, fentes). Faible, il laisse le genou rentrer vers l'intérieur. Il donne aussi l'arrondi du haut de la fesse.", "u": "Le renforcer avec les abducteurs à la machine et les exercices unilatéraux.", "e": "Abducteurs machine en fin de séance jambes : 3 × 15.", "r": ["m_fessier", "m_adduct"], "app": "Compté dans « Fessiers » sur la carte Équilibre."}, {"id": "m_quad", "n": "Quadriceps", "ab": "Quads", "t": "Anatomie", "lv": "D", "d": "Le grand muscle à quatre chefs du devant de la cuisse.", "x": "Il comprend le droit fémoral (qui croise aussi la hanche), le vaste latéral (extérieur), le vaste médial (intérieur, la « goutte » au-dessus du genou) et le vaste intermédiaire. Il tend le genou : se relever, monter, sauter.", "u": "Le développer avec le squat, la presse, le hack squat, les fentes et le leg extension.", "e": "Leg extension pour cibler le droit fémoral en fin de séance.", "r": ["m_ischio", "m_fessier", "m_adduct"], "app": "Compté dans « Quadriceps » sur la carte Équilibre."}, {"id": "m_ischio", "n": "Ischio-jambiers", "ab": "Ischios", "t": "Anatomie", "lv": "D", "d": "Les trois muscles de l'arrière de la cuisse : biceps fémoral, semi-tendineux et semi-membraneux.", "x": "Ils plient le genou et tendent la hanche. Souvent moins travaillés que les quadriceps, ce qui crée un déséquilibre et augmente le risque de blessure, notamment en sprint. Ils se travaillent de deux façons complémentaires : par la hanche (soulevé de terre roumain) et par le genou (leg curl).", "u": "Inclure au moins un exercice de chaque type pour des cuisses équilibrées.", "e": "Soulevé de terre roumain + leg curl dans la même semaine.", "r": ["m_quad", "m_fessier", "m_erect"], "app": "Compté dans « Ischios » sur la carte Équilibre, qui signale aussi un déséquilibre avec les quadriceps."}, {"id": "m_adduct", "n": "Adducteurs", "ab": "", "t": "Anatomie", "lv": "I", "d": "Le groupe de muscles de l'intérieur de la cuisse.", "x": "Ils rapprochent les cuisses, et le grand adducteur aide aussi à remonter du bas du squat. Ils travaillent beaucoup dans le squat profond et le soulevé de terre sumo. Ils sont souvent sources d'élongations quand on écarte brutalement les jambes.", "u": "Les renforcer avec la machine à adducteurs et un squat en amplitude complète.", "e": "Adducteurs machine : 3 × 12 à 15, amplitude contrôlée.", "r": ["m_quad", "m_moyenfessier"], "app": "Comptés dans « Adducteurs » sur la carte Équilibre."}, {"id": "m_mollet", "n": "Mollets", "ab": "Triceps sural", "t": "Anatomie", "lv": "D", "d": "Les muscles de l'arrière de la jambe : les jumeaux (gastrocnémiens) et le soléaire.", "x": "Les jumeaux croisent le genou : ils travaillent surtout jambe tendue (mollets debout). Le soléaire, dessous, travaille surtout genou plié (mollets assis). Ils se rejoignent dans le tendon d'Achille et servent à se mettre sur la pointe des pieds. Leur volume dépend beaucoup de la génétique, mais ils progressent avec une amplitude complète et des pauses en étirement.", "u": "Travailler debout et assis, avec une vraie amplitude et un temps d'arrêt en bas.", "e": "Mollets debout : 2 s en bas en étirement, montée complète.", "r": ["m_tibial", "amplitude"], "app": "Comptés dans « Mollets » sur la carte Équilibre."}, {"id": "m_tibial", "n": "Tibial antérieur", "ab": "", "t": "Anatomie", "lv": "A", "d": "Le muscle du devant du tibia, qui relève la pointe du pied.", "x": "Il est sollicité à la marche et à la course, et aide à stabiliser la cheville. Peu travaillé en salle, il intéresse surtout les coureurs et la prévention des douleurs de tibia.", "u": "Bon à connaître pour l'équilibre de la jambe, surtout si tu cours.", "e": "Marcher sur les talons quelques dizaines de mètres en fin de séance.", "r": ["m_mollet"], "app": "Pas suivi séparément dans l'appli."}, {"id": "m_psoas", "n": "Psoas-iliaque", "ab": "Fléchisseurs de hanche", "t": "Anatomie", "lv": "I", "d": "Le muscle profond qui relie le bas du dos et le bassin au haut de la cuisse.", "x": "Il fléchit la hanche (monter le genou) et travaille dans les relevés de jambes, la course et le sprint. Raccourci par de longues heures assis, il est souvent accusé de tirer sur le bas du dos ; des étirements des fléchisseurs de hanche et des fentes en amplitude complète aident.", "u": "Comprendre pourquoi les relevés de jambes sollicitent aussi les hanches, pas seulement les abdos.", "e": "Étirement en fente basse 30 s par côté après une journée assis.", "r": ["m_abdo", "m_quad", "mobilite"], "app": "Pas suivi séparément ; il travaille dans certains exercices d'abdos."}, {"id": "m_agoniste", "n": "Agoniste, antagoniste, synergiste", "ab": "", "t": "Anatomie", "lv": "I", "d": "Les rôles des muscles dans un mouvement : celui qui produit le mouvement, celui qui fait l'inverse, et ceux qui aident.", "x": "Au curl, le biceps est l'agoniste, le triceps l'antagoniste (il se relâche), et le brachial un synergiste. Ces notions aident à construire des supersets antagonistes efficaces (biceps/triceps, pectoraux/dos) et à comprendre pourquoi un muscle travaille dans plusieurs exercices.", "u": "Organiser ses supersets et comprendre la répartition du travail.", "e": "Superset antagoniste : développé couché puis rowing.", "r": ["superset", "polyarti", "m_biceps", "m_tri"], "app": "La carte Équilibre compte 1 série pour le muscle principal et ½ série pour les muscles qui aident (synergistes)."}, {"id": "m_fibres", "n": "Fibres musculaires lentes et rapides", "ab": "Type I / type II", "t": "Anatomie", "lv": "A", "d": "Les deux grandes familles de fibres : lentes (endurantes) et rapides (puissantes, plus aptes à grossir).", "x": "Les fibres de type I résistent à la fatigue mais produisent peu de force ; les fibres de type II sont puissantes, se fatiguent vite et ont un fort potentiel de croissance. Chaque muscle mélange les deux, en proportions qui varient selon la personne et le muscle. Bonne nouvelle : des séries menées près de l'échec recrutent toutes les fibres, quelle que soit la charge.", "u": "Comprendre pourquoi des répétitions hautes près de l'échec font aussi grossir.", "e": "15 répétitions jusqu'à 1 RIR recrutent les fibres rapides comme 6 répétitions lourdes.", "r": ["hypertrophie", "echec", "force"], "app": ""}, {"id": "m_tendon", "n": "Tendons et ligaments", "ab": "", "t": "Anatomie", "lv": "I", "d": "Les tendons attachent les muscles aux os ; les ligaments relient les os entre eux.", "x": "Ils s'adaptent à l'entraînement, mais plus lentement que les muscles : c'est pourquoi une progression trop rapide des charges peut provoquer des tendinopathies, même si le muscle suit. Une montée en charge progressive, un bon échauffement et des périodes de décharge les protègent.", "u": "Comprendre pourquoi il faut progresser progressivement, même quand on se sent fort.", "e": "Débutant qui ajoute 10 kg par semaine au développé couché : risque de douleur au coude ou à l'épaule.", "r": ["tendinopathie", "echauffement", "deload", "surcharge"], "app": "La progression automatique de l'appli monte les charges par petits incréments."}],GLI={};GLO.forEach(g=>GLI[g.id]=g);

function glSug(q){const qs=nzS(q);if(!qs)return[];const R=[];GLO.forEach(g=>{const n=nzS(g.n),a=nzS(g.ab||''),d=nzS(g.d);let sc=0;
 if(a&&a==qs)sc=130;else if(n.startsWith(qs))sc=110;else if(a&&a.startsWith(qs))sc=95;else if(n.split(' ').some(w=>w.startsWith(qs)))sc=80;else if(n.includes(qs))sc=60;else if(qs.length>2&&d.includes(qs))sc=25;else if(qs.length>3&&nzS(g.x).includes(qs))sc=15;
 if(!sc&&qs.includes(' ')){const Q=qs.split(' ');if(Q.every(w=>(n+' '+a+' '+d).includes(w)))sc=20}if(sc)R.push([sc-g.n.length/40,g])});return R.sort((a,b)=>b[0]-a[0]).slice(0,6).map(x=>x[1])}

function lexList(){const el=document.getElementById('lxl');if(!el)return;const inp=document.getElementById('lxq');v.q=inp?inp.value:'';const q=nzS(v.q),G=GLG.find(x=>x[0]==(v.lg||'all'));
 let L=GLO.filter(g=>!G[2]||G[2].includes(g.t));if(q){const Q=q.split(' ');L=L.filter(g=>{const h=nzS([g.n,g.ab,g.t,g.d,g.x].join(' '));return Q.every(w=>h.includes(w))})}

 const el=hintEl(h);hintPlace();if(el&&el.getBoundingClientRect&&h.pg!='run'){obSee(el,HN.o.querySelector('.tbb'));hintPlace()}}
function hintPlace(){if(!HN)return;const el=hintEl(HN.h);if(!el)return obHintOff();obPos(el,HN.o.querySelector('.tbb'),HN.o.querySelector('.tar'),HN.o.querySelector('.obo'),null)}
function obHintOff(){if(HN){HN.o.remove();HN=null}}

/* ---------- 3. Quête « Premiers pas » ---------- */
Object.assign(QI,{pp_me:'helmet',pp_ses:'sword',pp_cue:'scroll',pp_run:'flame',pp_w2:'drumstick',pp_buy:'coin'});
const PPQ=[
 {k:'me',t:'Remplir ton profil (au moins ton poids)',h:'Options → Modifier',xp:20,ok:()=>S.me.weight>0},
 {k:'ses',t:'Créer ta propre séance',h:"S'entraîner → Ajouter une séance",xp:30,ok:()=>S.sessions.some(s=>!/^s[12]$/.test(s.id)&&!s.demo&&s.ex.length)},
 {k:'cue',t:"Lire la fiche d'un exercice",h:"Touche le petit parchemin à côté d'un exercice",xp:15,ok:()=>!!(S.ob.f&&S.ob.f.cue)},
 {k:'run',t:'Terminer ta première séance',h:'Lance une séance et va jusqu\'au bout',xp:50,ok:()=>S.hist.length>0},
 {k:'w2',t:'Te repeser un autre jour',h:'Nutrition → + Pesée',xp:20,ok:()=>(S.wl||[]).length>=2},
 {k:'buy',t:'Faire ton premier achat à la boutique',h:'Dans ta salle → Boutique',xp:20,ok:()=>!!(S.ob.f&&S.ob.f.buy)}];
const PPB=60,ppOn=()=>!!(S.ob&&S.ob.pp&&!(S.ob.q&&S.ob.q.bonus));
function ppClaim(){if(!ppOn()||window.tdemo||TR||LOOT||obBusy())return;const q=S.ob.q=S.ob.q||{};
 const it=PPQ.find(x=>!q[x.k]&&x.ok());if(it){q[it.k]=1;addXP(it.xp,'Premiers pas');return}
 if(PPQ.every(x=>q[x.k])){q.bonus=1;addXP(PPB,'Premiers pas terminés !');if(v.n=='goals')render()}}
function ppHtml(){if(!ppOn())return'';const q=S.ob.q||{},L=PPQ.map(x=>{const ok=!!q[x.k];return{txt:x.t,xp:x.xp,ok,t:'pp_'+x.k,p:ok?'Validée':x.h}}),n=L.filter(x=>x.ok).length;
 return`<div class="card"><div class="qh">${spr('flame',3)}<div><div class="t">Premiers pas</div><div class="mu">Pour bien démarrer l'aventure</div></div><span class="chip b">${n}/${L.length}</span></div>${L.map(qRow).join('')}${qBonus(n,L.length,'Bonus Premiers pas',PPB,false,n+'/'+L.length+' étapes · termine-les toutes pour le bonus')}</div>`}
