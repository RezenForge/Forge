<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d1a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lopedjo">
<title>Lopedjo</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101a;--bg2:#241c2e;--bg3:#3a2d49;--tx:#f4ecd8;--mu:#b3a5c4;--ac:#ffb02e;--rest:#5ad1ff;--bad:#e2373f;--ok:#5fd35f;--ink:#0a070e;--px:'Press Start 2P',ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0}
body{margin:0;color:var(--tx);font:22px/1.2 VT323,ui-monospace,monospace;min-height:100%;background-color:#1d1626;background-image:linear-gradient(var(--ink) 4px,transparent 4px),linear-gradient(90deg,var(--ink) 4px,transparent 4px);background-size:48px 48px;background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 45%,#000b 100%)}
h1,h2,.big{font-family:var(--px);font-weight:400;margin:0;line-height:1.5;text-shadow:2px 2px 0 var(--ink)}
h1{font-size:15px}h2{font-size:12px;margin:18px 0 10px;color:var(--ac)}
#app{max-width:520px;margin:0 auto;padding:72px 14px 40px;position:relative;z-index:2}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;background:#120d1a;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--bg3)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--bg3);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #5b4873,0 3px 0 var(--ink);color:var(--tx);width:44px;height:44px;font:14px var(--px)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:4px solid var(--ink);padding:14px;background:var(--bg3);box-shadow:inset 0 0 0 2px #5b4873,inset 0 -6px 0 #0003,0 4px 0 var(--ink);font:11px/1.6 var(--px);text-align:left;margin:0 0 14px}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #5b4873,0 1px 0 var(--ink)}
.btn.p{background:var(--ac);color:#2a1700;text-align:center;box-shadow:inset 0 0 0 2px #ffe08a,inset 0 -6px 0 #0003,0 4px 0 var(--ink)}
.btn.d{background:#5a1a22;color:#ffd0d0;text-align:center;box-shadow:inset 0 0 0 2px #8c3040,inset 0 -6px 0 #0003,0 4px 0 var(--ink)}
.btn.s{padding:10px;font-size:10px;text-align:center}
.hb{display:flex;align-items:center}
.btn .mu{font:20px/1 VT323,monospace;margin-top:4px}
.card{background:var(--bg2);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #4b3a5e,0 4px 0 var(--ink);padding:12px;margin-bottom:14px}
.today{outline:4px solid var(--ac)}
.mu{color:var(--mu);font-size:19px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg2);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #4b3a5e;padding:6px 8px}
.stat b{display:block;font:13px var(--px);margin-top:6px;font-weight:400}
.ring{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:14px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16;stroke-linecap:butt}
.ring .c{position:absolute;inset:0;padding:0 16%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-size:34px;line-height:1.2}
.rate{display:grid;gap:14px;margin-top:20px}
.rate button{border:4px solid var(--ink);padding:20px;font:12px/1.6 var(--px);background:var(--bg3);box-shadow:inset 0 0 0 2px #5b4873,0 4px 0 var(--ink)}
.rate button:active{transform:translateY(3px)}
.ck{display:inline-block;width:26px;height:26px;border:4px solid var(--ink);background:#120d1a;text-align:center;line-height:18px;margin-right:10px;vertical-align:middle;font-size:18px}
.done .ck{background:var(--ok);color:#052a0a}
.done .nm{color:var(--mu);text-decoration:line-through}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--bg2);width:100%;max-width:520px;margin:0 auto;border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #5b4873;padding:16px;max-height:90%;overflow:auto}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:19px}
input,select{width:100%;padding:10px;border:4px solid var(--ink);background:#120d1a;box-shadow:inset 0 0 0 2px #4b3a5e;color:var(--tx);font:22px VT323,monospace}
.toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--ac);color:#2a1700;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:12px;font:11px/1.6 var(--px);text-align:center;z-index:20}
.sw{display:inline-block;width:40px;height:40px;margin-right:8px;border:4px solid var(--ink)}
.dlg{display:block;width:100%;text-align:left;color:var(--tx);background:#120d1a;border:4px solid #f4ecd8;box-shadow:0 0 0 4px var(--ink),inset 0 0 0 3px var(--ink);padding:14px 18px 14px 16px;margin:6px 0 20px;font:22px/1.15 VT323,monospace;position:relative}
.dlg::after{content:'▼';position:absolute;right:8px;bottom:4px;font-size:12px;color:var(--ac);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.flame{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{transform:translateY(3px) scaleY(.85)}}
.hl{font-size:19px}.hl h1{font-size:12px}.hl .top{margin-bottom:8px}.hl .back{width:38px;height:38px}.hl .big{font-size:20px!important}.hl .card{padding:8px 10px;margin-bottom:8px}.hl .btn{padding:10px;margin-bottom:8px;font-size:10px}.hl h2{font-size:10px;margin:10px 0 6px}.hl select{padding:6px}.hl .mu{font-size:17px}.hl .grid{grid-template-columns:repeat(4,1fr);gap:6px}.hl .stat{padding:5px 6px}.hl .stat b{font-size:10px}.hl p{margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div id="bar"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const uid=()=>Math.random().toString(36).slice(2,9);
const DEF={sessions:[{id:'s1',name:'Pectoraux / Triceps',day:1,ex:[{id:'e1',name:'Développé couché',load:70,inc:2.5,sets:4,reps:8,rest:120},{id:'e2',name:'Extensions poulie',load:25,inc:1,sets:3,reps:12,rest:90}]},{id:'s2',name:'Épaules',day:6,ex:[{id:'e3',name:'Élévations latérales',load:8,inc:.5,sets:4,reps:15,rest:90}]}],set:{sound:true,vol:.5,rep:4,ac:'#f2b84b'},hist:[],cur:null};
let P;try{P=JSON.parse(localStorage.gymprof)}catch(e){}
if(!P||!P.list)P={cur:'p1',list:[{id:'p1',name:'Moi'}]};
const key=id=>id=='p1'?'gymv1':'gymv1_'+id;
const fresh=()=>JSON.parse(JSON.stringify({...DEF,sessions:[],hist:[],cur:null}));
let S;function loadP(){try{S=JSON.parse(localStorage[key(P.cur)])}catch(e){S=null}if(!S)S=P.cur=='p1'?JSON.parse(JSON.stringify(DEF)):fresh();S.me=S.me||{name:'',weight:0,goal:''}}
loadP();
const save=()=>{try{localStorage[key(P.cur)]=JSON.stringify(S);localStorage.gymprof=JSON.stringify(P)}catch(e){}};
let v={n:'home'};const go=(n,x={})=>{v={n,...x};render()};
const fmt=s=>{s=Math.max(0,Math.round(s));const h=s/3600|0,m=(s%3600)/60|0;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const kg=n=>(Math.round(n*100)/100).toString().replace('.',',');
const sess=id=>S.sessions.find(s=>s.id==id);
// audio
let ac;function beep(f=660,d=.12,m=1){if(!S.set.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=S.set.vol*m*.5;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;d.style.marginTop=document.querySelectorAll('.toast').length*58+'px';document.body.append(d);setTimeout(()=>d.remove(),3500)}
function ask(m,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h2>${m}</h2><button class="btn d" id="y">Confirmer</button><button class="btn s" id="n">Annuler</button></div>`;document.body.append(o);o.querySelector('#n').onclick=()=>o.remove();o.querySelector('#y').onclick=()=>{o.remove();cb()}}
function form(title,fields,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h2>${title}</h2>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map((x,i)=>`<option value="${i}" ${i==f.v?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${f.k}" ${f.t=='text'?'':'type="number" step="any" inputmode="decimal"'} value="${f.v??''}">`}`).join('')}<div style="height:16px"></div><button class="btn p" id="ok">Enregistrer</button><button class="btn s" id="no">Annuler</button></div>`;document.body.append(o);o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{const r={};fields.forEach(f=>{const e=o.querySelector('#f_'+f.k);r[f.k]=f.t=='text'?e.value.trim():+e.value});o.remove();cb(r)}}
// run engine
let last=Date.now(),lastSave=0,wl;
function calib(){const a=S.hist.filter(h=>h.th>0&&h.dur>0).slice(-5);if(!a.length)return null;return Math.min(1.8,Math.max(.9,a.reduce((s,h)=>s+h.dur/h.th,0)/a.length))}
function adj(t,n){const f=calib();return f?t*f:t+n*60}
function exLeft(e,c){const r=S.set.rep,u=e.uni?2:1,sw=e.uni?10:0,F=e.reps*r*u+sw;
 if(!c)return e.sets*F+(e.sets-1)*e.rest;
 if(c.ph=='rate')return 0;const rem=e.sets-c.set;let t;
 if(c.ph=='rest')t=c.left+rem*F+(rem-1)*e.rest;
 else if(c.ph=='swap')t=c.left+e.reps*r+rem*(e.rest+F);
 else if(c.ph=='rep')t=(e.reps-c.rep)*r+c.left+(e.uni&&!c.side?sw+e.reps*r:0)+rem*(e.rest+F);
 else t=(c.ph=='prep'?c.left:0)+F+rem*(e.rest+F);
 return Math.max(0,t)}
function remain(){const c=S.cur,s=sess(c.sid);let t=0,n=0;s.ex.forEach(e=>{if(c.done[e.id])return;const cu=c.ex&&c.ex.id==e.id;if(!cu)n++;t+=exLeft(e,cu?c.ex:null)});return adj(t,n)}
function tick(){const n=Date.now(),dt=Math.min((n-last)/1000,1);last=n;const c=S.cur;if(!c||c.paused)return;
 c.elapsed+=dt;const x=c.ex;
 if(x&&(x.ph=='rep'||x.ph=='rest'||x.ph=='prep'||x.ph=='swap')){x.left-=dt;if(x.left<=0)advance()}
 if(n-lastSave>1000){save();lastSave=n}upd()}
function advance(){const c=S.cur,x=c.ex,e=sess(c.sid).ex.find(a=>a.id==x.id);
 if(x.ph=='prep'){x.ph='rep';x.set=x.set||1;x.rep=x.rep||1;x.side=0;x.left=S.set.rep;beep(880,.3)}
 else if(x.ph=='rep'){c.vol+=e.load;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].reps++;c.log[e.id].vol+=e.load;
  if(x.rep<e.reps){x.rep++;x.left=S.set.rep;beep(660,.1)}
  else if(e.uni&&!x.side){x.ph='swap';x.left=10;beep(440,.3)}
  else if(x.set<e.sets){x.ph='rest';x.left=e.rest;beep(440,.3)}
  else{x.ph='rate';beep(880,.4)}}
 else if(x.ph=='swap'){x.side=1;x.rep=1;x.ph='rep';x.left=S.set.rep;beep(880,.3)}
 else if(x.ph=='rest'){x.set++;x.rep=1;x.side=0;x.ph='rep';x.left=S.set.rep;beep(880,.3)}
 save();render()}
setInterval(tick,100);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.cur){S.cur.paused=true;save();if(v.n=='run')render()}});
function rateEx(res){const c=S.cur,s=sess(c.sid),e=s.ex.find(a=>a.id==c.ex.id);c.done[e.id]=res;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].load=e.load;c.log[e.id].res=res;
 if(res=='ok')e.load+=e.inc;else if(res=='ko')e.load=Math.max(0,e.load-e.inc);e.load=Math.round(e.load*100)/100;c.ex=null;save();go('train2')}
function finish(){const c=S.cur,s=sess(c.sid);const exs=s.ex.filter(e=>c.log[e.id]).map(e=>({id:e.id,name:e.name,load:c.log[e.id].load??e.load,reps:c.log[e.id].reps,vol:c.log[e.id].vol,res:c.log[e.id].res||'-',stop:c.log[e.id].stop||0}));
 let recs=[];const pv=Math.max(0,...S.hist.filter(h=>h.sid==c.sid).map(h=>h.vol));if(c.vol>pv&&S.hist.some(h=>h.sid==c.sid))recs.push('volume');
 exs.forEach(x=>{const pl=Math.max(0,...S.hist.flatMap(h=>h.ex.filter(y=>y.id==x.id).map(y=>y.load)));if(S.hist.length&&x.load>pl)recs.push(x.name)});
 if(exs.length)S.hist.push({t:Date.now(),sid:c.sid,name:s.name,dur:c.elapsed,vol:c.vol,th:s.ex.filter(e=>c.done[e.id]).reduce((a,e)=>a+exLeft(e,null),0),ex:exs});
 S.lastG=mkLast(c,s);addXP(S.lastG.list.filter(x=>x.ok).reduce((a,x)=>a+x.xp,0));if(S.lastG.list.length>0&&S.lastG.list.every(x=>x.ok))addXP(Math.round(25*xpMult()),'Séance parfaite');S.cur=null;save();go('home');if(recs.length){toast('🏆 Nouveau record personnel ! '+recs.join(', '));beep(990,.5)}}
function startSession(id){S.cur={sid:id,elapsed:0,vol:0,done:{},log:{},ex:null,paused:true,g:genGoals(sess(id))};save();go('train2')}
function stopEx(){ask("Arrêter cet exercice ? Les répétitions déjà faites sont comptées.",()=>{const c=S.cur,x=c&&c.ex;if(!x||x.ph=='rate')return;const e=sess(c.sid).ex.find(a=>a.id==x.id);c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].stop=1;x.ph='rate';x.stopped=1;save();render()})}
function startEx(id){const e=sess(S.cur.sid).ex.find(a=>a.id==id);if(!(S.cur.ex&&S.cur.ex.id==id))S.cur.ex={id,set:1,rep:1,side:0,ph:'ready',left:S.set.rep};S.cur.paused=true;save();go('run')}
// views
function render(){try{claimMonth()}catch(e){}document.documentElement.style.setProperty('--ac',S.set.ac);({home,train,train2,run,stats,opts,sedit,rec,health,statx,goals}[v.n]||home)();upd();updBar()}
function hdr(t,b){return`<div class="top"><button class="back" onclick="${b}">‹</button><h1>${t}</h1></div>`}
function home(){const c=S.cur,s=c&&sess(c.sid);A.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 14px">${torch()}<h1 style="font-size:13px;line-height:1.7;text-align:center;flex:1">Prêt à t'entraîner ${S.me.name||curName()} ?</h1>${torch()}</div>${tipHtml()}${c&&s?`<div class="card today"><b>Reprendre la séance ?</b><div class="mu">${s.name} · ${fmt(c.elapsed)} · ${kg(c.vol)} kg</div><div class="grid" style="margin-top:10px"><button class="btn p s" onclick="go(S.cur.ex?'run':'train2')">Reprendre</button><button class="btn d s" onclick="ask('Abandonner la séance ?',()=>{S.cur=null;save();render()})">Abandonner</button></div></div>`:''}
<button class="btn hb" onclick="go('train')">${spr('sword',3,14)}S'entraîner</button><button class="btn hb" onclick="go('goals')">${spr('shield',3,14)}Objectifs</button><button class="btn hb" onclick="go('stats')">${spr('scroll',3,14)}Statistiques</button><button class="btn hb" onclick="go('health')">${spr('heart',3,14)}Santé</button><button class="btn hb" onclick="go('opts')">${spr('book',3,14)}Options</button>`}
function train(){const d=new Date().getDay(),l=[...S.sessions].sort((a,b)=>(b.day==d)-(a.day==d)||a.day-b.day);
 A.innerHTML=hdr('S\'entraîner',"go('home')")+(l.length?l.map(s=>`<button class="btn ${s.day==d?'today':''}" onclick="startSession('${s.id}')" ${s.day==d?'style="outline:2px solid var(--ac)"':''}>${s.day==d?'⭐ Aujourd\'hui · ':''}${s.name}<div class="mu">${DAYS[s.day]} · ${s.ex.length} exercices</div></button>`).join(''):'<p class="mu">Aucune séance. Crée-en une dans Options.</p>')}
function train2(){const c=S.cur;if(!c)return go('home');const s=sess(c.sid);
 A.innerHTML=hdr(s.name,"S.cur.paused=true;save();go('home')")+`<div class="grid"><div class="stat"><span class="mu">Durée</span><b id="t_el"></b></div><div class="stat"><span class="mu">Volume</span><b id="t_vol"></b></div><div class="stat"><span class="mu">Reste estimé</span><b id="t_rem"></b></div><div class="stat"><span class="mu">Fin vers</span><b id="t_end"></b></div></div><h2>Choisis un exercice</h2>`+s.ex.map(e=>`<button class="btn ${c.done[e.id]?'done':''}" onclick="startEx('${e.id}')"><span class="ck">${c.done[e.id]?'✓':''}</span><span class="nm">${e.name}</span><div class="mu">${kg(e.load)} kg · ${e.sets}×${e.reps}${e.uni?' / côté':''} · repos ${e.rest}s</div></button>`).join('')+`<button class="btn p" onclick="finish()">Terminer la séance</button>`}
function run(){const c=S.cur;if(!c||!c.ex)return go('train2');const x=c.ex,e=sess(c.sid).ex.find(a=>a.id==x.id);
 if(x.ph=='rate'){A.innerHTML=hdr('Exercice terminé',"go('train2')").replace(/<button class="back".*?<\/button>/,'')+`<h2>Comment s'est déroulé l'exercice ?</h2><div class="mu">${e.name} · ${kg(e.load)} kg</div>${x.stopped?`<div class="mu">Arrêté à la série ${x.set}/${e.sets} · ${(c.log[e.id]||{}).reps||0} répétitions comptées</div>`:''}<div class="rate"><button onclick="rateEx('ok')">✅ Réussi<div class="mu">→ ${kg(e.load+e.inc)} kg</div></button><button onclick="rateEx('mid')">⚠️ Presque réussi<div class="mu">→ ${kg(e.load)} kg</div></button><button onclick="rateEx('ko')">❌ Échec<div class="mu">→ ${kg(Math.max(0,e.load-e.inc))} kg</div></button></div>`;return}
 A.innerHTML=hdr(e.name,"S.cur.paused=true;save();go('train2')")+`<div class="grid"><div class="stat"><span class="mu">Séance</span><b id="t_el"></b></div><div class="stat"><span class="mu">Volume</span><b id="t_vol"></b></div><div class="stat"><span class="mu">Reste estimé</span><b id="t_rem"></b></div><div class="stat"><span class="mu">Fin vers</span><b id="t_end"></b></div></div>
 <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" stroke="var(--bg3)"/><circle id="arc" cx="110" cy="110" r="100" stroke="var(--ac)" stroke-dasharray="628.3" stroke-dashoffset="0"/></svg><div class="c"><div class="mu" id="lab"></div><div class="big" id="num"></div><div class="mu" id="sub"></div></div></div>
 <button class="btn p" id="pp"></button>${x.ph=='rest'||x.ph=='swap'?'<button class="btn s" onclick="S.cur.ex.left=0">Passer</button>':''}${x.ph=='rep'||x.ph=='rest'||x.ph=='swap'?'<button class="btn d s" onclick="stopEx()">Je n\'y arrive plus</button>':''}`}
function upd(){const c=S.cur;if(!c)return;const s=sess(c.sid);if(!s)return;const T=(i,t)=>{const el=$('#'+i);if(el&&el.textContent!=t)el.textContent=t};
 T('t_el',fmt(c.elapsed));T('t_vol',kg(c.vol)+' kg');const r=remain();T('t_rem',fmt(r));const en=new Date(Date.now()+r*1000);T('t_end',en.getHours()+':'+String(en.getMinutes()).padStart(2,'0'));
 const x=c.ex;if(v.n=='run'&&x&&$('#arc')){const e=s.ex.find(a=>a.id==x.id),rest=x.ph=='rest',pre=x.ph=='prep',sw=x.ph=='swap',tot=rest?e.rest:(pre||sw)?10:S.set.rep,L=x.ph=='ready'?tot:x.left;

function evG(g,st){return g.t=='ex'?st.done[g.id]=='ok':g.t=='okn'?Object.values(st.done).filter(r=>r=='ok').length>=g.n:g.t=='all'?Object.keys(st.done).length>=g.n:st.vol>=g.v}
function mkLast(c,s){const g=c.g||genGoals(s);return{t:Date.now(),sid:s.id,name:s.name,list:g.map(x=>({txt:x.txt,xp:x.xp??Math.round(xpBase(x)*xpMult()),ok:evG(x,{done:c.done,vol:c.vol})}))}}
function goalsHtml(){const c=S.cur,d=new Date().getDay();let name,when,list;
 if(c&&sess(c.sid)){const s=sess(c.sid);c.g=c.g||genGoals(s);name=s.name;when='En cours';list=c.g.map(x=>({txt:x.txt,xp:x.xp??Math.round(xpBase(x)*xpMult()),ok:evG(x,{done:c.done,vol:c.vol})}))}
 else if(S.lastG&&new Date(S.lastG.t).toDateString()==new Date().toDateString()&&sess(S.lastG.sid)){name=S.lastG.name;when='Terminée';list=S.lastG.list}
 else{let s=S.sessions.find(x=>x.day==d&&x.ex.length);when="Aujourd'hui";if(!s)for(let k=1;k<=7;k++){const x=S.sessions.find(y=>y.day==(d+k)%7&&y.ex.length);if(x){s=x;when=k==1?'Demain':DAYS[x.day];break}}
  if(!s)return'';name=s.name;list=genGoals(s).map(x=>({txt:x.txt,xp:x.xp,ok:false}))}
 if(!list.length)return'';
 return`<div class="card"><div class="row"><b>Objectifs</b><span class="mu">${name} · ${when}</span></div>${list.map(x=>`<div class="${x.ok?'done':''}" style="margin-top:8px"><span class="ck">${x.ok?'✓':''}</span><span class="nm">${x.txt}</span> <b style="color:var(--ac);white-space:nowrap">+${x.xp} XP</b></div>`).join('')}<div class="mu" style="margin-top:8px">${list.every(x=>x.ok)?'🎯 Tous les objectifs validés : bonus de +'+Math.round(25*xpMult())+' XP':'Bonus : +'+Math.round(25*xpMult())+' XP si tous les objectifs sont validés'}</div></div>`}
function genMonth(){const n=new Date(),k=n.getFullYear()+'-'+n.getMonth()+'v3';if(S.mg&&S.mg.k==k)return S.mg;
 const m=S.me,W=S.wl||[],w=W.length?W[W.length-1].w:(m.weight||0),mode=m.mode||0,pl=S.sessions.length,sv=Math.max(1,Math.round(pl*((new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()+1)/7)*.95)),g=[];
 if(w){const hm=(m.h||0)/100,low=hm&&w/(hm*hm)<18.5,d=mode==0?1:(mode==2&&!low?-1:0),v=(t=>m.tw&&d>0&&m.tw>w?Math.min(t,m.tw):m.tw&&d<0&&m.tw<w?Math.max(t,m.tw):t)(Math.round((w+d*(d>0?1:1.5))*10)/10);g.push({t:'w',d,v,b:w,txt:d>0?`Atteindre ${f1(v)} kg (+1 kg, soit environ 0,25 kg par semaine)`:d<0?`Descendre à ${f1(v)} kg (-1,5 kg, rythme sain)`:`Rester à ±0,5 kg de ${f1(w)} kg (3 pesées minimum)`})}
 else g.push({t:'wc',v:4,txt:`Enregistrer ton poids au moins 4 fois (une fois par semaine)`});
 if(pl)g.push({t:'ss',v:sv,txt:`Faire ${sv} séances ce mois-ci`});
 const start=new Date(n.getFullYear(),n.getMonth(),1).getTime();
 if(S.hist.some(h=>h.t<start)){const ne=S.sessions.reduce((a,s)=>a+s.ex.length,0),v=Math.min(3,Math.max(1,Math.ceil(ne/2)));if(v)g.push({t:'pr',v,txt:`Battre ton record de charge sur ${v} exercice${v>1?'s':''}`})}
 else if(pl){const avg=S.sessions.reduce((a,s)=>a+s.ex.reduce((b,e)=>b+e.sets*e.reps*e.load,0),0)/pl,v=Math.round(avg*sv*1.05/100)*100;if(v>0)g.push({t:'vm',v,txt:`Soulever ${kg(v)} kg au total ce mois-ci`})}
 g.forEach(x=>x.xp=Math.round({w:150,wc:60,ss:120,pr:130,vm:100}[x.t]*xpMult()));S.mg={k,list:g};save();return S.mg}
function evM(g){const n=new Date(),inM=t=>{const d=new Date(t);return d.getFullYear()==n.getFullYear()&&d.getMonth()==n.getMonth()},Hm=S.hist.filter(h=>inM(h.t)),W=S.wl||[],Wm=W.filter(y=>inM(y.t)),lw=W.length?W[W.length-1].w:0;
 if(g.t=='w'){const ok=g.d>0?lw>=g.v:g.d<0?lw<=g.v:(Wm.length>=3&&Math.abs(lw-g.b)<=.5);return{ok,p:lw?`Actuel : ${f1(lw)} kg`+(g.d==0?` · pesées ${Wm.length}/3`:''):'Aucune pesée'}}

 if(g.t=='vm'){const v=Hm.reduce((a,h)=>a+h.vol,0);return{ok:v>=g.v,p:`${kg(v)} / ${kg(g.v)} kg`}}
 const ids=new Set(),start=new Date(n.getFullYear(),n.getMonth(),1).getTime();Hm.forEach(h=>h.ex.forEach(x=>{const pv=S.hist.filter(o=>o.t<start).flatMap(o=>o.ex.filter(y=>y.id==x.id).map(y=>y.load));if(pv.length&&x.load>Math.max(...pv))ids.add(x.id)}));return{ok:ids.size>=g.v,p:`${ids.size}/${g.v}`}}
function monthHtml(){const mg=genMonth(),mo=new Date().toLocaleDateString('fr-FR',{month:'long'});if(!mg.list.length)return'';
 return`<div class="card"><div class="row"><b>Objectifs du mois</b><span class="mu">${mo}</span></div>${mg.list.map(x=>{const r=evM(x);return`<div class="${r.ok?'done':''}" style="margin-top:8px"><span class="ck">${r.ok?'✓':''}</span><span class="nm">${x.txt}</span><div class="mu" style="margin-left:36px">${r.p} · <b style="color:var(--ac)">+${x.xp} XP</b></div></div>`}).join('')}<div class="mu" style="margin-top:8px">${mg.bonus?'✅ Bonus du mois obtenu':'Bonus : +'+Math.round(100*xpMult())+' XP si tous les objectifs du mois sont atteints'}</div></div>`}
