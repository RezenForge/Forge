<style>

.tpo{display:flex;align-items:center;justify-content:center;gap:6px}.tpo .ring{width:min(58vw,262px);margin:10px 0 14px;flex:none}.tcol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}.tbt{width:42px;height:42px;padding:0;background:var(--bg3);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #5b4873,inset 0 -5px 0 #0003,0 3px 0 var(--ink);font:16px var(--px);color:var(--ac)}.tbt:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #5b4873,0 1px 0 var(--ink)}.tcol small{font:7px/1.3 var(--px);color:var(--mu);white-space:nowrap}

.big{font-size:34px;line-height:1.2}

<script>
const $=s=>document.querySelector(s),A=$('#app');
const DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const uid=()=>Math.random().toString(36).slice(2,9);
const DEF={sessions:[{id:'s1',name:'Pectoraux / Triceps',day:1,ex:[{id:'e1',name:'Développé couché',load:70,inc:2.5,sets:4,reps:8,rest:120},{id:'e2',name:'Extensions poulie',load:25,inc:1,sets:3,reps:12,rest:90}]},{id:'s2',name:'Épaules',day:6,ex:[{id:'e3',name:'Élévations latérales',load:8,inc:.5,sets:4,reps:15,rest:90}]}],set:{sound:true,vol:.5,rep:4,ac:'#f2b84b'},hist:[],cur:null};

const fmt=s=>{s=Math.max(0,Math.round(s));const h=s/3600|0,m=(s%3600)/60|0;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const kg=n=>(Math.round(n*100)/100).toString().replace('.',',');
const sess=id=>S.sessions.find(s=>s.id==id);
// audio
let ac;function beep(f=660,d=.12,m=1){if(!S.set.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=S.set.vol*m*.5;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function lockScroll(o){const R=document.documentElement,sh=o.querySelector('.sheet'),sc=()=>!!sh&&sh.scrollHeight-sh.clientHeight>2,fit=()=>{if(!sh)return;const f=sc();sh.style.overflowY=f?'auto':'hidden';sh.style.overscrollBehavior='contain';o.style.touchAction=f?'':'none'};R.classList.add('lock');fit();addEventListener('resize',fit);const h=e=>{const t=e.target.closest&&e.target.closest('.sheet');if(!(t&&sc()))e.preventDefault()};o.addEventListener('touchmove',h,{passive:false});o.addEventListener('wheel',h,{passive:false});new MutationObserver((_,ob)=>{if(!o.isConnected){R.classList.remove('lock');removeEventListener('resize',fit);ob.disconnect()}}).observe(document.body,{childList:true})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;d.style.marginTop=document.querySelectorAll('.toast').length*58+'px';document.body.append(d);setTimeout(()=>d.remove(),3500)}
function ask(m,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h2>${m}</h2><button class="btn d" id="y">Confirmer</button><button class="btn s" id="n">Annuler</button></div>`;document.body.append(o);o.querySelector('#n').onclick=()=>o.remove();o.querySelector('#y').onclick=()=>{o.remove();cb()}}
function form(title,fields,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h2>${title}</h2>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map((x,i)=>`<option value="${i}" ${i==f.v?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${f.k}" ${f.t=='text'?'':'type="number" step="any" inputmode="decimal"'} value="${f.v??''}">`}`).join('')}<div style="height:16px"></div><button class="btn p" id="ok">Enregistrer</button><button class="btn s" id="no">Annuler</button></div>`;document.body.append(o);o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{const r={};fields.forEach(f=>{const e=o.querySelector('#f_'+f.k);r[f.k]=f.t=='text'?e.value.trim():+e.value});o.remove();cb(r)}}
// run engine
let last=Date.now(),lastSave=0,wl;
function calib(){const a=S.hist.filter(h=>h.th>0&&h.dur>0).slice(-5);if(!a.length)return null;return Math.min(1.8,Math.max(.9,a.reduce((s,h)=>s+h.dur/h.th,0)/a.length))}
function adj(t,n){const f=calib();return f?t*f:t+n*60}
function exLeft(e,c){const r=S.set.rep,u=e.uni?2:1,sw=e.uni?10:0,F=e.reps*r*u+sw;
 if(!c)return e.sets*F+(e.sets-1)*e.rest;
 if(c.ph=='rate')return 0;const rem=e.sets-c.set;let t;
 if(c.ph=='rest')t=c.left+rem*F+(rem-1)*e.rest;
 else if(c.ph=='swap')t=c.left+e.reps*r+rem*(e.rest+F);
 else if(c.ph=='rep')t=(e.reps-c.rep)*r+c.left+(e.uni&&!c.side?sw+e.reps*r:0)+rem*(e.rest+F);
 else t=(c.ph=='prep'?c.left:0)+F+rem*(e.rest+F);
 return Math.max(0,t)}
function remain(){const c=S.cur,s=sess(c.sid);let t=0,n=0;s.ex.forEach(e=>{if(c.done[e.id])return;const cu=c.ex&&c.ex.id==e.id;if(!cu)n++;t+=exLeft(e,cu?c.ex:null)});return adj(t,n)}
function tick(){const n=Date.now(),dt=Math.min((n-last)/1000,1);last=n;const c=S.cur;if(!c)return;
 if(c.started!==false){const g=(n-(c.lt||n))/1000;if(g<10800)c.elapsed+=g;c.lt=n}
 const x=c.ex;
 if(!c.paused&&x&&(x.ph=='rep'||x.ph=='rest'||x.ph=='prep'||x.ph=='swap')){x.left-=dt;if(x.left<=0)advance()}
 if(n-lastSave>1000){save();lastSave=n}upd()}
function advance(){const c=S.cur,x=c.ex,e=sess(c.sid).ex.find(a=>a.id==x.id);
 if(x.ph=='prep'){x.ph='rep';x.set=x.set||1;x.rep=x.rep||1;x.side=0;x.left=S.set.rep;beep(880,.3)}
 else if(x.ph=='rep'){c.vol+=e.load;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].reps++;c.log[e.id].vol+=e.load;
  if(x.rep>=e.reps&&!(e.uni&&!x.side)){x.sr=x.sr||[];if(x.sr[x.set-1]==null)x.sr[x.set-1]=e.reps}
  if(x.rep<e.reps){x.rep++;x.left=S.set.rep;beep(660,.1)}
  else if(e.uni&&!x.side){x.ph='swap';x.left=10;beep(440,.3)}
  else if(x.set<e.sets){x.ph='rest';x.left=e.rest;beep(440,.3)}
  else{x.ph='rate';beep(880,.4)}}
 else if(x.ph=='swap'){x.side=1;x.rep=1;x.ph='rep';x.left=S.set.rep;beep(880,.3)}
 else if(x.ph=='rest'){x.set++;x.rep=1;x.side=0;x.ph='rep';x.left=S.set.rep;beep(880,.3)}
 save();render()}
setInterval(tick,100);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.cur){S.cur.paused=true;save();if(v.n=='run')render()}});
/* ===== Progression : bilan série par série (hypertrophie) =====
   - réussi : toutes les répétitions de toutes les séries => +incrément (ou +1 rép en double progression)
   - presque : 1re série complète et seule la fin manque (dernière série ou >= 90 % des reps) => même charge
   - échec : calé tôt ou < 90 % => même charge au 1er échec, allègement de 10 % au 2e d'affilée
   - < 60 % des reps : charge clairement trop lourde => allègement immédiat
   - 3 séances sans progrès sur la même charge => allègement de 10 %
   - énergie basse (< 35 %) : l'échec est excusé et ne compte pas dans les échecs d'affilée */
function progEval(e,sr){const n=e.sets,T=e.reps,r=[];for(let i=0;i<n;i++)r.push(Math.max(0,Math.min(T,sr&&sr[i]!=null?sr[i]:0)));
 const tot=r.reduce((a,b)=>a+b,0),pct=n*T?tot/(n*T):0,fm=r.findIndex(v=>v<T);
 const res=fm<0?'ok':(r[0]>=T&&(fm==n-1||pct>=.9))?'mid':'ko';return{r,pct,fm,res}}
function progRound(v,inc){const st=inc>0?inc:.5;return Math.max(0,Math.round(v/st)*st)}
function progPlan(e,ev){const pg=Object.assign({f:0,s:0},e.pg||{}),fat=fatigue(),low=!!(fat&&fat.e<35),inc=e.inc||0,DP=e.rmax>0&&e.rmin>0,P=Math.round(ev.pct*100);
 let load=e.load,reps=e.reps,txt='',ic='';
 const deload=why=>{load=progRound(e.load*.9,inc);if(inc>0&&load>e.load-inc)load=Math.max(0,e.load-inc);if(DP)reps=e.rmin;pg.f=0;pg.s=0;ic='📉';txt=why+` On allège de 10 % : ${kg(load)} kg${DP?' × '+reps:''}, puis on remonte.`};
 if(ev.res=='ok'){pg.f=0;pg.s=0;ic='✅';
  if(DP&&e.reps<e.rmax){reps=e.reps+1;txt=`Toutes les répétitions ! Double progression : même charge, vise ${reps} répétitions la prochaine fois.`}
  else{load=e.load+inc;if(DP)reps=e.rmin;txt=`Toutes les répétitions ! La charge monte : ${kg(load)} kg${DP?', et tu repars à '+reps+' répétitions':''}.`}}
 else if(ev.res=='mid'){pg.s++;if(pg.s>=3)deload('3 séances sans progrès sur cette charge.');else{ic='⚠️';txt=`Presque (${P} %) : seule la fin a manqué, c'est de la fatigue normale. On garde ${kg(load)} kg pour la valider.`}}
 else if(low){pg.s++;ic='🛡️';txt=`Échec (${P} %), mais ton énergie était basse (${fat.e} %) : échec excusé, on garde ${kg(load)} kg.`}
 else if(ev.pct<.6)deload(`Calé dès la série ${ev.fm+1} avec seulement ${P} % des répétitions : la charge est trop lourde.`);
 else{pg.f++;pg.s++;if(pg.f>=2)deload("2e échec d'affilée.");else if(pg.s>=3)deload('3 séances sans progrès sur cette charge.');else{ic='❌';txt=`Calé à la série ${ev.fm+1} (${P} %). On garde ${kg(load)} kg ; si ça se reproduit la prochaine fois, on allégera.`}}
 return{res:ev.res,load:Math.round(load*100)/100,reps,txt,ic,pg}}
function adjSR(i,d){const c=S.cur,x=c&&c.ex;if(!x)return;const e=sess(c.sid).ex.find(a=>a.id==x.id);x.sr=x.sr||[];x.sr[i]=Math.max(0,Math.min(e.reps,(x.sr[i]??e.reps)+d));save();render()}
function failSet(){const c=S.cur,x=c&&c.ex;if(!x||x.ph!='rep')return;const e=sess(c.sid).ex.find(a=>a.id==x.id);x.sr=x.sr||[];x.sr[x.set-1]=Math.max(0,x.rep-1);x.side=0;
 if(x.set<e.sets){x.ph='rest';x.left=e.rest}else x.ph='rate';beep(330,.3);save();render()}
function valEx(){const c=S.cur,s=sess(c.sid),e=s.ex.find(a=>a.id==c.ex.id),x=c.ex,ev=progEval(e,x.sr),pl=progPlan(e,ev);
 c.done[e.id]=pl.res;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};{const lg=c.log[e.id],nr=ev.r.reduce((a,b)=>a+b,0)*(e.uni?2:1),nv=Math.round(nr*e.load*100)/100;c.vol=Math.max(0,c.vol+nv-(lg.vol||0));lg.reps=nr;lg.vol=nv}Object.assign(c.log[e.id],{load:e.load,res:pl.res,sr:ev.r,tr:e.reps});
 e.load=pl.load;e.reps=pl.reps;e.pg=pl.pg;c.ex=null;c.paused=false;last=Date.now();save();go('train2')}
function rateHtml(c,x,e){const ev=progEval(e,x.sr),pl=progPlan(e,ev);
 return`<h2>Bilan de l'exercice</h2><div class="mu">${e.name} · ${kg(e.load)} kg · ${e.sets}×${e.reps}${e.uni?' / côté':''}</div>${x.stopped?`<div class="mu">Exercice arrêté : les séries non faites comptent 0.</div>`:''}
 <div class="card" style="margin-top:10px"><div class="mu" style="margin-bottom:6px">Répétitions réussies par série (corrige si besoin)</div>${ev.r.map((v,i)=>`<div class="row" style="padding:4px 0"><span>Série ${i+1}</span><span style="display:flex;align-items:center;gap:8px"><button class="btn s" style="width:40px;margin:0;padding:6px" onclick="adjSR(${i},-1)">−</button><b style="font:11px var(--px);min-width:52px;text-align:center;color:${v>=e.reps?'var(--ok)':'var(--ac)'}">${v}/${e.reps}</b><button class="btn s" style="width:40px;margin:0;padding:6px" onclick="adjSR(${i},1)">+</button></span></div>`).join('')}</div>
 <div class="card"><div style="font-size:21px">${pl.ic} ${pl.txt}</div><div class="mu" style="margin-top:6px">Prochaine fois : ${kg(pl.load)} kg × ${pl.reps}</div></div>
 <button class="btn p" onclick="valEx()">Valider</button>`}
function rateEx(res){const c=S.cur,s=sess(c.sid),e=s.ex.find(a=>a.id==c.ex.id);c.done[e.id]=res;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].load=e.load;c.log[e.id].res=res;
 if(res=='ok')e.load+=e.inc;else if(res=='ko')e.load=Math.max(0,e.load-e.inc);e.load=Math.round(e.load*100)/100;c.ex=null;c.paused=false;last=Date.now();save();go('train2')}
function finish(){const c=S.cur,s=sess(c.sid);const exs=s.ex.filter(e=>c.log[e.id]).map(e=>({id:e.id,name:e.name,load:c.log[e.id].load??e.load,reps:c.log[e.id].reps,vol:c.log[e.id].vol,res:c.log[e.id].res||'-',stop:c.log[e.id].stop||0,sr:c.log[e.id].sr,tr:c.log[e.id].tr}));
 if(!exs.length)return ask("Aucun exercice effectué. Quitter la séance sans l'enregistrer ?",()=>{S.cur=null;save();go('home')});
 let recs=[];const pv=Math.max(0,...S.hist.filter(h=>h.sid==c.sid).map(h=>h.vol));if(c.vol>pv&&S.hist.some(h=>h.sid==c.sid))recs.push('volume');
 exs.forEach(x=>{const pr=S.hist.flatMap(h=>h.ex.filter(y=>y.id==x.id&&y.res=='ok').map(y=>y.load));if(x.res=='ok'&&pr.length&&x.load>Math.max(...pr))recs.push(x.name)});
 if(exs.length)S.hist.push({t:Date.now(),sid:c.sid,name:s.name,dur:c.elapsed,vol:c.vol,th:s.ex.filter(e=>c.done[e.id]).reduce((a,e)=>a+exLeft(e,null),0),ex:exs});
 S.lastG=mkLast(c,s);{const bx=boostM('xp'),bp=boostM('pr');addXP(Math.round(S.lastG.list.filter(x=>x.ok).reduce((a,x)=>a+x.xp,0)*bx),bx>1?'Boost ×'+fm(bx):null,bp);if(S.lastG.list.length>0&&S.lastG.list.every(x=>x.ok))addXP(Math.round(25*xpMult()*bx),'Séance parfaite',bp);boostUse()}S.cur=null;save();go('home');if(recs.length){toast('🏆 Nouveau record personnel ! '+recs.join(', '));beep(990,.5)}}
function stopEx(){ask("Arrêter cet exercice ? Les répétitions déjà faites sont comptées.",()=>{const c=S.cur,x=c&&c.ex;if(!x||x.ph=='rate')return;const e=sess(c.sid).ex.find(a=>a.id==x.id);c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].stop=1;x.sr=x.sr||[];if((x.ph=='rep'||x.ph=='swap')&&x.sr[x.set-1]==null)x.sr[x.set-1]=x.ph=='swap'?e.reps:Math.max(0,x.rep-1);x.ph='rate';x.stopped=1;save();render()})}
function openSess(id){if(S.cur&&S.cur.sid!=id)ask("Une séance est déjà en cours. L'abandonner pour en commencer une autre ?",()=>{S.cur=null;save();go('train2',{pre:id})});else go('train2',{pre:id})}
function backRun(){const c=S.cur;if(!c)return go('train');if(c.started){c.paused=true;save();go('train2')}else{const sid=c.sid;S.cur=null;save();go('train2',{pre:sid})}}
/* tempo des répétitions (secondes par rép), réglable pendant l'exercice */
const f1t=v=>String(Math.round(v*10)/10).replace('.',',')+' s/rép';
function tempo(d){const o=S.set.rep||4,n=Math.max(1,Math.min(10,Math.round((o+d)*2)/2));if(n==o)return;S.set.rep=n;
 const x=S.cur&&S.cur.ex;if(x&&(x.ph=='rep'||x.ph=='ready'))x.left=x.ph=='ready'?n:Math.max(.1,x.left*n/o);
 save();const e=document.getElementById('tpv');if(e)e.textContent=f1t(n);try{beep(d>0?520:780,.05)}catch(_){}}
function skip(){const c=S.cur,x=c&&c.ex;if(x&&(x.ph=='rest'||x.ph=='swap'))advance()}
function resume(){const c=S.cur;if(!c)return;if(!c.ex||c.ex.ph=='rate'){c.paused=false;last=Date.now();save()}go(c.ex?'run':'train2')}
function startEx(id,force){if(S.cur&&S.cur.done[id]){if(!force)return ask("Exercice déjà terminé. Le refaire ? Ses résultats seront remplacés.",()=>startEx(id,1));const lg=S.cur.log[id];if(lg)S.cur.vol-=lg.vol||0;delete S.cur.log[id];delete S.cur.done[id];if(S.cur.ex&&S.cur.ex.id==id)S.cur.ex=null}
 if(!S.cur){const s=S.sessions.find(s=>s.ex.some(e=>e.id==id));S.cur={sid:s.id,elapsed:0,vol:0,done:{},log:{},ex:null,paused:true,started:false,g:genGoals(s)}}
 const e=sess(S.cur.sid).ex.find(a=>a.id==id);if(!(S.cur.ex&&S.cur.ex.id==id))S.cur.ex={id,set:1,rep:1,side:0,ph:'ready',left:S.set.rep};S.cur.paused=true;save();go('run')}

function buy(sec,i){const it={deco:SHOP,mach:MACH,boost:BOO,cos:COS,wall:WALLS,floor:FLOORS}[sec][i];if(!it)return;const nm=it.nm||it.n;

 ask(`Acheter « ${nm} » pour ${it.p} Prot's ?`,()=>{if((S.prots||0)<it.p)return;S.prots-=it.p;S.room=S.room||{};
  if(sec=='deco'){S.room.fix=S.room.fix||{};S.room.fix[it.k]=it.v;G.bg=null;toast(nm+' · installé !')}

  else if(sec=='mach'){S.room.mach=S.room.mach||{};S.room.mach[it.id]=1;G.bg=null;toast(nm+' · installé dans ta salle !')}
  else if(sec=='boost'){S.boost=S.boost||{};S.boost[it.t]={id:it.id,nm,m:it.m,n:it.n};toast(nm+' · activé !')}
  else{S.cos=S.cos||{own:{}};S.cos.own=S.cos.own||{};S.cos.own[it.id]=1;S.cos.eq=it.id;G.spr=null;toast(nm+' · équipée !')}
  save();render()})}

function fatigue(dt){const H=S.hist;if(H.length<3)return null;const T=Date.now(),t0=T+(dt||0),HL=40*36e5,np=S.sessions.filter(s=>s.ex.length).length||3,cap=2.5*np*.343,sc={ok:1,mid:1.15,ko:1.3};let F=0;
 H.forEach((h,i)=>{const age=t0-h.t;if(age<0||age>10*864e5)return;const p=H.slice(0,i).filter(o=>o.sid==h.sid).slice(-4),ref=p.length?p.reduce((a,o)=>a+o.vol,0)/p.length:0,rv=ref>0?Math.min(2,Math.max(.5,h.vol/ref)):1,ex=h.ex||[],dif=ex.length?ex.reduce((a,x)=>a+(sc[x.res]||1)+(x.stop?.1:0),0)/ex.length:1,tm=h.th>0&&h.dur>0?Math.min(1.3,Math.max(.8,h.dur/h.th)):1;F+=rv*dif*tm*Math.pow(.5,age/HL)});
 return{e:Math.max(0,Math.min(100,Math.round(100*(1-F/cap)))),n:H.filter(h=>T-h.t<7*864e5).length}}

/* ===== Calcul nutrition (partagé page Nutrition + conseils) =====
   Mifflin-St Jeor x activité ; prise de masse : +10 % de l'entretien, 0,25-0,5 % du poids/sem (Iraki 2019) ;
   sèche : déficit visant ~0,5 % du poids/sem, plafonné à 25 % (Helms 2014 : 0,5-1 %/sem) ;
   protéines : 1,8 g/kg (masse/maintien, plateau ~1,6 g/kg : Morton 2018), 2,2 g/kg en sèche ; lipides 25 % ; glucides = reste */
function nutri(m,w){const H=(m.h||0)/100;if(!H||!m.age||!w)return null;const b=w/(H*H),mode=m.mode||0;
 const bmr=10*w+6.25*m.h-5*m.age+(m.sex?-161:5),tdee=bmr*[1.2,1.375,1.55,1.725][m.act??1];let dl=0,note='';
 if(mode==0)dl=Math.round(tdee*.10/10)*10;
 else if(mode==2){if(b<18.5)note='IMC bas : pas de déficit conseillé.';else dl=Math.max(-Math.min(Math.round(w*5.5/10)*10,Math.round(tdee*.25/10)*10),Math.ceil((bmr-tdee)/10)*10)}
 const t=Math.round((tdee+dl)/10)*10,pk=mode==2?2.2:1.8,pr=Math.round(w*pk),fa=Math.round(t*.25/9),ca=Math.max(0,Math.round((t-pr*4-fa*9)/4));
 return{tdee,dl,t,pk,pr,fa,ca,b,note,mode,rate:mode==0?[w*.0025,w*.005]:mode==2?[w*.005,w*.01]:[0,0],meal:[Math.round(w*.4),Math.round(w*.55)]}}
function health(){const m=S.me,W=S.wl||[],n=W.length,l=n?W[n-1]:null,p=n>1?W[n-2]:null,w=l?l.w:(m.weight||0),H=(m.h||0)/100,mode=m.mode||0,b=H&&w?w/(H*H):0,ML=['Prise de masse','Maintien','Perte de poids'];
 let x=hdr('Nutrition',"go('home')")+`<button class="btn p s" onclick="addW()">+ Ajouter le poids du jour</button>`,ex='';
 if(w){const d=p?Math.round((l.w-p.w)*10)/10:null;let g='';
  if(m.tw){const rest=Math.round((m.tw-w)*10)/10,s0=n?W[0].w:w,tot=m.tw-s0,pr=tot?Math.max(0,Math.min(100,(w-s0)/tot*100)):(Math.abs(rest)<=.3?100:0);
   g=`<div class="mu" style="margin-top:8px">${Math.abs(rest)<=.2?'Objectif atteint 🎉':'Objectif '+kg(m.tw)+' kg · reste '+f1(Math.abs(rest))+' kg à '+(rest>0?'prendre':'perdre')}</div><div style="height:10px;background:#0a070e;border:3px solid var(--ink);margin-top:6px"><div style="height:100%;width:${pr}%;background:var(--ac)"></div></div>`}
  x+=`<div class="card"><div class="row"><div class="big" style="font-size:24px!important">${kg(w)} kg</div><span class="mu">${d==null?(l?'1re pesée':'Poids du profil'):(d>0?'+':'')+f1(d)+' kg depuis le '+dfr(p.t)}</span></div>${b?`<div class="mu" style="margin-top:6px">IMC ${f1(b)} · ${bmiCat(b)}</div>`:''}${g}</div>`}
 else x+='<p class="mu">Aucune pesée pour le moment.</p>';
 if(!H||!m.age)x+=`<div class="card">Renseigne ta taille et ton âge dans ton profil pour obtenir tes besoins quotidiens.<button class="btn s" style="margin-top:8px" onclick="edMe()">Compléter mon profil</button></div>`;
 else if(w){const N=nutri(m,w),{tdee,dl,t,pr,fa,ca}=N,note=N.note?`<div class="mu">${N.note}</div>`:'',f2=v=>v.toFixed(1).replace('.',',');
  x+=`<div class="card"><span class="mu">Nutrition du jour</span><div class="big" style="font-size:24px!important;margin:6px 0 2px">${t} kcal</div><div class="mu">${ML[mode]}${dl?' · '+(dl>0?'+':'')+dl+' kcal':''}</div>${note}<div class="grid" style="margin-top:8px"><div class="stat"><span class="mu">Prot.</span><b>${pr} g</b></div><div class="stat"><span class="mu">Gluc.</span><b>${ca} g</b></div><div class="stat"><span class="mu">Lip.</span><b>${fa} g</b></div><div class="stat"><span class="mu">Eau</span><b>${f1(w*.035)} L</b></div></div><div class="mu" style="margin-top:8px">Protéines : ${f1(N.pk)} g/kg${mode==2?' (plus élevées en sèche pour garder ton muscle)':''}, idéalement réparties sur 3 à 6 repas de ${N.meal[0]} à ${N.meal[1]} g.</div></div>`;
  ex=`<label>Objectif nutrition</label><select onchange="S.me.mode=+this.value;save();render()">${ML.map((o,i)=>`<option value="${i}" ${i==mode?'selected':''}>${o}</option>`).join('')}</select><div class="mu" style="margin-top:8px">Entretien : ${Math.round(tdee/10)*10} kcal<br>${mode==0?`Vise +${f2(N.rate[0])} à +${f2(N.rate[1])} kg par semaine (0,25 à 0,5 % de ton poids). Plus vite, c'est surtout du gras.`:mode==2?(dl?`Vise −${f2(N.rate[0])} à −${f2(N.rate[1])} kg par semaine (0,5 à 1 % de ton poids) pour garder ton muscle.`:'Vise un poids stable.'):'Vise un poids stable.'}<br>Poids de forme (IMC 18,5 à 24,9) : ${f1(18.5*H*H)} à ${f1(24.9*H*H)} kg. L'IMC ne distingue pas muscle et graisse : chez un pratiquant musclé, il surestime souvent l'excès de poids.</div>`}
 if(n)ex+='<label>Dernières pesées</label>'+W.map((y,i)=>({...y,d:i?y.w-W[i-1].w:null})).slice(-7).reverse().map(y=>`<div class="row mu" style="padding:2px 0"><span>${dfr(y.t)}</span><b style="color:var(--tx);font-weight:400">${kg(y.w)} kg</b><span>${y.d==null?'':(y.d>0?'+':'')+kg(Math.round(y.d*100)/100)}</span></div>`).join('');
 if(ex)x+=`<details class="card"><summary style="cursor:pointer;font:10px var(--px)">Détails et historique</summary><div style="margin-top:10px">${ex}<p class="mu">Estimation indicative (Mifflin-St Jeor) : ajuste selon l'évolution réelle de ton poids sur 2 à 3 semaines. Pas un avis médical.</p></div></details>`;
 A.innerHTML='<div class="hl">'+x+'</div>'}
