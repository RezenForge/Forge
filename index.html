// audio
var FF=false,BGS=[];const TIMED=p=>p=='rep'||p=='rest'||p=='prep'||p=='swap'||p=='wrep'||p=='wrest';

function lockScroll(o){const R=document.documentElement,sh=o.querySelector('.sheet'),sc=()=>!!sh&&sh.scrollHeight-sh.clientHeight>2,fit=()=>{if(!sh)return;const f=sc();sh.style.overflowY=f?'auto':'hidden';sh.style.overscrollBehavior='contain';o.style.touchAction=f?'':'none'};R.classList.add('lock');fit();addEventListener('resize',fit);const h=e=>{const t=e.target.closest&&e.target.closest('.sheet');if(!(t&&sc()))e.preventDefault()};o.addEventListener('touchmove',h,{passive:false});o.addEventListener('wheel',h,{passive:false});new MutationObserver((_,ob)=>{if(!o.isConnected){R.classList.remove('lock');removeEventListener('resize',fit);ob.disconnect()}}).observe(document.body,{childList:true})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;d.style.marginTop=document.querySelectorAll('.toast').length*58+'px';document.body.append(d);setTimeout(()=>d.remove(),3500)}
function ask(m,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h2>${m}</h2><button class="btn d" id="y">Confirmer</button><button class="btn s" id="n">Annuler</button></div>`;document.body.append(o);o.querySelector('#n').onclick=()=>o.remove();o.querySelector('#y').onclick=()=>{o.remove();cb()}}
function form(title,fields,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h2>${title}</h2>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map((x,i)=>`<option value="${i}" ${i==f.v?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${f.k}" ${f.t=='text'?'':'type="number" step="any" inputmode="decimal"'} value="${f.v??''}">`}`).join('')}<div style="height:16px"></div><button class="btn p" id="ok">Enregistrer</button><button class="btn s" id="no">Annuler</button></div>`;document.body.append(o);o.querySelector('#no').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{const r={};fields.forEach(f=>{const e=o.querySelector('#f_'+f.k);r[f.k]=f.t=='text'?e.value.trim():+e.value});o.remove();cb(r)}}
// run engine
let last=Date.now(),lastSave=0,wl;
function calib(){const a=S.hist.filter(h=>h.th>0&&h.dur>0).slice(-5);if(!a.length)return null;return Math.min(1.8,Math.max(.9,a.reduce((s,h)=>s+h.dur/h.th,0)/a.length))}
function adj(t,n){const f=calib();return f?t*f:t+n*60}
/* tempo (s par répétition) propre à l'exercice : réglé à la main (e.tp), sinon conseillé par le catalogue, sinon tempo par défaut */
const TPX=new Set(['kbs','clean','burp','mc','rus','thr']);
function tpDef(e){const m=exMus(e),c=m&&m.c;if(!c||String(c.id).startsWith('u'))return S.set.rep||4;if(c.id=='gain'||c.id=='gl')return 30;if(TPX.has(c.id))return 2;return c.k?3:4}
function tpOf(e){return e&&e.tp>0?e.tp:tpDef(e)}
function exLeft(e,c){const r=tpOf(e),u=e.uni?2:1,sw=e.uni?10:0,F=e.reps*r*u+sw;
 if(!c)return e.sets*F+(e.sets-1)*e.rest;
 if((c.ph=='wrep'||c.ph=='wrest')&&c.wl){let t=c.ph=='wrep'?(c.wl[c.wi][0]-c.rep)*r+c.left+wuRest(c,c.wi):c.left;for(let j=c.wi+1;j<c.wl.length;j++)t+=c.wl[j][0]*r+wuRest(c,j);return t+e.sets*F+(e.sets-1)*e.rest}
 if(c.ph=='rate')return 0;const rem=e.sets-c.set;let t;
 if(c.ph=='rest')t=c.left+rem*F+(rem-1)*e.rest;
 else if(c.ph=='swap')t=c.left+e.reps*r+rem*(e.rest+F);
 else if(c.ph=='rep')t=(e.reps-c.rep)*r+c.left+(e.uni&&!c.side?sw+e.reps*r:0)+rem*(e.rest+F);
 else t=(c.ph=='prep'?c.left:0)+F+rem*(e.rest+F);
 return Math.max(0,t)}
function remain(){const c=S.cur,s=sess(c.sid);let t=0,n=0;const prev=s.ex.filter(e=>c.done[e.id]);
 s.ex.forEach(e=>{if(c.done[e.id]||(c.hide||[]).includes(e.id))return;const cu=c.ex&&c.ex.id==e.id,x=cu&&c.ex;if(!cu)n++;
  t+=exLeft(e,cu?x:null);/* échauffement encore à venir */
  if(!cu)t+=wuSec(e,wuPlan(e,null,0,prev));else if(x.ph=='ready'&&!x.noWu)t+=wuSec(e,wuPlan(e,c,x.wuF));else if(x.ph=='prep'&&x.wl&&x.wl.length)t+=wuSec(e,{sets:x.wl});
  prev.push(e)});return adj(t,n)}
function tick(){const n=Date.now(),dt=Math.max(0,Math.min((n-last)/1000,14400));last=n;const c=S.cur;if(!c)return;
 if(c.started!==false){const g=(n-(c.lt||n))/1000;if(g<10800)c.elapsed+=g;c.lt=n}

 if(!c.paused&&x&&TIMED(x.ph)&&dt>1.5){/* rattrapage : écran verrouillé ou appli en arrière-plan */FF=true;try{let r=dt;for(let g=0;g<3000&&r>0;g++){const y=c.ex;if(!y||!TIMED(y.ph))break;if(y.left>r){y.left-=r;r=0}else{r-=y.left;y.left=0;advance()}}}finally{FF=false}save();if(!document.hidden)render()}
 else if(!c.paused&&x&&TIMED(x.ph)){const p0=x.left;x.left-=dt;if(x.ph!='rep'&&x.left>0&&Math.ceil(x.left)<=3&&Math.ceil(p0)!=Math.ceil(x.left))beep(520,.06,.7);if(x.left<=0)advance()}
 if(n-lastSave>1000){save();lastSave=n}upd()}
function advance(){const c=S.cur,x=c.ex,e=sess(c.sid).ex.find(a=>a.id==x.id);
 if(x.ph=='prep'&&x.wl&&x.wl.length&&(x.wi||0)<x.wl.length){x.ph='wrep';x.wi=x.wi||0;x.rep=1;x.left=tpOf(e);beep(880,.3)}
 else if(x.ph=='wrep'){if(x.rep<x.wl[x.wi][0]){x.rep++;x.left=tpOf(e);beep(660,.1)}else{x.ph='wrest';x.left=x.wt=wuRest(x,x.wi);beep(440,.3)}}
 else if(x.ph=='wrest'){x.wi++;if(x.wi<x.wl.length){x.ph='wrep';x.rep=1;x.left=tpOf(e);beep(880,.3)}else{x.wl=[];x.ph='rep';x.set=1;x.rep=1;x.side=0;x.left=tpOf(e);beep(880,.3);try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(_){}}}
 else if(x.ph=='prep'){x.ph='rep';x.set=x.set||1;x.rep=x.rep||1;x.side=0;x.left=tpOf(e);beep(880,.3)}
 else if(x.ph=='rep'){const el=effLoad(e);c.vol+=el;c.log[e.id]=c.log[e.id]||{reps:0,vol:0};c.log[e.id].reps++;c.log[e.id].vol+=el;
  if(x.rep>=e.reps&&!(e.uni&&!x.side)){x.sr=x.sr||[];if(x.sr[x.set-1]==null)x.sr[x.set-1]=e.reps}
  if(x.rep<e.reps){x.rep++;x.left=tpOf(e);beep(660,.1)}
  else if(e.uni&&!x.side){x.ph='swap';x.left=10;beep(440,.3)}
  else if(x.set<e.sets){x.ph='rest';x.left=e.rest;beep(440,.3)}

setInterval(tick,100);
/* écran verrouillé : le minuteur continue. On programme les bips à l'avance (le son peut jouer même page en veille) et on rattrape le temps au retour */
document.addEventListener('visibilitychange',()=>{if(!S.cur)return;if(document.hidden){save();bgSched()}else{bgCancel();tick();render()}});
function bgCancel(){BGS.forEach(o=>{try{o.stop()}catch(_){}});BGS=[]}
function bgSched(){bgCancel();const c=S.cur,x=c&&c.ex;if(!S.set.sound||!ac||!c||c.paused||!x||!TIMED(x.ph))return;const s=sess(c.sid),e=s&&s.ex.find(a=>a.id==x.id);if(!e)return;
 try{ac.resume&&ac.resume()}catch(_){}
 const y={ph:x.ph,left:Math.max(0,x.left),set:x.set||1,rep:x.rep||1,side:x.side||0,wi:x.wi||0},WL=x.wl||[],ev=[],R=tpOf(e);let t=0;
 const cd=()=>{if(y.ph!='rep')for(let k=3;k>=1;k--)if(y.left>k)ev.push([t+y.left-k,520,.06,.7])};cd();

  if(y.ph=='prep'&&WL.length&&y.wi<WL.length){y.ph='wrep';y.rep=1;y.left=R;ev.push([t,880,.3,1])}

  else if(y.ph=='prep'){y.ph='rep';y.left=R;ev.push([t,880,.3,1])}
  else if(y.ph=='rep'){if(y.rep<e.reps){y.rep++;y.left=R;ev.push([t,660,.1,1])}else if(e.uni&&!y.side){y.ph='swap';y.left=10;ev.push([t,440,.3,1])}else if(y.set<e.sets){y.ph='rest';y.left=e.rest;ev.push([t,440,.3,1])}else{ev.push([t,880,.4,1]);break}}
  else if(y.ph=='swap'){y.side=1;y.rep=1;y.ph='rep';y.left=R;ev.push([t,880,.3,1])}
  else{y.set++;y.rep=1;y.side=0;y.ph='rep';y.left=R;ev.push([t,880,.3,1])}
  cd()}

/* ===== Progression : bilan série par série (hypertrophie) =====
   - réussi : toutes les répétitions de toutes les séries => +incrément (ou +1 rép en double progression)
   - presque : 1re série complète et seule la fin manque (dernière série ou >= 90 % des reps) => même charge
   - échec : calé tôt ou < 90 % => même charge au 1er échec, allègement de 10 % au 2e d'affilée
   - < 60 % des reps : charge clairement trop lourde => allègement immédiat
   - 3 séances sans progrès sur la même charge => allègement de 10 %
   - énergie basse (< 35 %) : l'échec est excusé et ne compte pas dans les échecs d'affilée */
function progEval(e,sr){const n=e.sets,T=e.reps,r=[];for(let i=0;i<n;i++)r.push(Math.max(0,Math.min(T,sr&&sr[i]!=null?sr[i]:0)));
 const tot=r.reduce((a,b)=>a+b,0),pct=n*T?tot/(n*T):0,fm=r.findIndex(v=>v<T);

/* ===== Équilibre du programme : séries par muscle et par semaine (séances prévues) ===== */
const BALG=[['Poussée',['pec','epa','epl','tri']],['Tirage',['dos','epp','bic','trp','avb']],['Jambes',['qua','isc','fes','mol','add']],['Tronc',['abs','lom']]];
const MUSC={epa:'Ép. avant',epl:'Ép. côtés',epp:'Ép. arrière'};
const BALZ={pec:[10,20],dos:[10,20],qua:[10,20],isc:[10,20],fes:[10,20],epl:[10,20],bic:[10,20],tri:[10,20],epa:[6,20],epp:[6,20],mol:[8,16],abs:[6,16]};
function balCalc(){const v={},src={},unk=[];MUSK.forEach(k=>{v[k]=0;src[k]=[]});let nEx=0;
 S.sessions.forEach(s=>s.ex.forEach(e=>{nEx++;const m=exMus(e),n=Math.max(1,e.sets||1);if(!m){unk.push(e.name);return}
  m.p.forEach(k=>{v[k]+=n;src[k].push([e.name,n,1])});m.s.forEach(k=>{if(!m.p.includes(k)){v[k]+=n/2;src[k].push([e.name,n,0])}})}));return{v,src,unk,nEx}}
/* ===== Suggestions d'ajout pour passer un muscle « Faible » en « Bon » =====
   Seulement si c'est raisonnable : exercice d'isolation peu fatigant, séance du bon type (haut/bas), séance pas déjà trop longue (≤ 7 exercices, ≤ 75 min),

 const over=(c,sets,k)=>[...c.p,...c.s].some(m=>BALZ[m]&&V[m]+(c.p.includes(m)?sets:sets/2)>BALZ[m][1]+.01);
 const low=Object.keys(SUGC).filter(k=>BALZ[k]&&V[k]<BALZ[k][0]).sort((a,b)=>(V[a]/BALZ[a][0])-(V[b]/BALZ[b][0]));
 for(const k of low){if(out.length>=3)break;const need=Math.ceil(BALZ[k][0]-V[k]);if(need>8)continue;
  const okKind=s=>{const t=sessKind(s);return k=='abs'?true:UPM.has(k)?(t=='up'||t=='full'):(t=='low'||t=='full')};
  const plan=[];let rem=need;
  /* 1) d'abord ajouter 1 ou 2 séries à un exercice qui vise déjà ce muscle (le moins fatigant) */
  S.sessions.flatMap(s=>s.ex.map(e=>({s,e,m:exMus(e)}))).filter(o=>o.m&&o.m.p.includes(k)&&o.e.sets+(bump[o.e.id]||0)<4)
   .sort((a,b)=>(exOrd(a.e)||9)-(exOrd(b.e)||9)).forEach(o=>{if(rem<=0)return;const add=Math.min(4-o.e.sets-(bump[o.e.id]||0),2,rem),c=o.m.c;
    if(c&&over(c,add,k))return;const x={...o.e,sets:o.e.sets+add};const mn=sessMinX({ex:o.s.ex.map(y=>y===o.e?x:y)})+(added[o.s.id]||0)*7;if(mn>75)return;
    plan.push({t:'sets',s:o.s,e:o.e,add,mn});rem-=add});
  /* 2) sinon, un exercice d'isolation dans une séance du bon type qui ne l'a pas déjà */
  const parts=rem<=0?[]:rem<=4?[rem]:[Math.ceil(rem/2),Math.floor(rem/2)],taken=new Set(plan.map(p=>p.s.id));let fail=false;
  for(const n of parts){const sets=Math.max(2,Math.min(4,n));let best=null;
   for(const id of SUGC[k]){const c=CATI[id];if(!c||!eqOk(c)||!painOk(c)||used.has(id)||plan.some(p=>p.c&&p.c.id==id)||over(c,sets,k))continue;
    const R=exRec(c),sl=startLoad(c),e={id:'tmp',name:c.n,load:sl.load,inc:sl.inc,sets,reps:R.rmin,rest:R.rest,uni:c.u?1:0,rmin:R.rmin,rmax:R.rmax};
    const cands=S.sessions.filter(s=>s.ex.length&&!taken.has(s.id)&&okKind(s)&&s.ex.length+(added[s.id]||0)<7&&!s.ex.some(x=>{const m=exMus(x);return m&&m.c&&m.c.k==c.k&&m.p.includes(k)}))
     .map(s=>({s,mn:sessMinX(s,e)+(added[s.id]||0)*7})).filter(o=>o.mn<=75).sort((a,b)=>a.mn-b.mn);
    if(cands.length){best={t:'new',c,e,s:cands[0].s,mn:cands[0].mn};break}}

  plan.forEach(p=>{if(p.t=='sets'){bump[p.e.id]=(bump[p.e.id]||0)+p.add;const m=exMus(p.e);m.p.forEach(x=>V[x]+=p.add);m.s.forEach(x=>{if(!m.p.includes(x))V[x]+=p.add/2})}

function balHtml(){const{v,src,unk,nEx}=balCalc();if(!nEx)return'';const fx=x=>String(Math.round(x*10)/10).replace('.',','),mx=Math.max(24,...Object.values(v)),pc=x=>Math.min(100,x/mx*100);

 const SG=balSug(v),sgK=new Set(SG.map(g=>g.k));['pec','dos','qua','isc','fes','epl','bic','tri'].filter(k=>!painMus(k)&&v[k]>0&&v[k]<10&&!sgK.has(k)).sort((a,b)=>v[a]-v[b]).slice(0,2).forEach(k=>AL.push(`📉 ${MUS[k]} : ${fx(v[k])} séries par semaine, il en manque ${fx(Math.ceil(10-v[k]))} pour atteindre 10. Ajoute des séries ou un exercice.`));
 MUSK.filter(k=>BALZ[k]&&!painMus(k)&&v[k]>BALZ[k][1]+.01).sort((a,b)=>v[b]/BALZ[b][1]-v[a]/BALZ[a][1]).slice(0,1).forEach(k=>AL.push(`📈 ${MUS[k]} : ${fx(v[k])} séries par semaine, au-dessus de la zone conseillée (${BALZ[k][1]} max). Au-delà, le gain en plus est faible et la récupération plus dure : retire 1 série ici ou là si tu fatigues.`));

function qBonus(n,t,lab,xp,ok,note){const pc=t?Math.round(n/t*100):0;return`<div class="qbonus ${ok?'done':''}"><div class="row"><span>${lab}</span><b>${ok?'✓ ':''}+${xp} XP</b></div><div class="qbar"><i style="width:${pc}%"></i></div><div class="qp">${note||n+'/'+t+' quêtes validées'}</div></div>`}
function goalsHtml(){const c=S.cur,d=new Date().getDay();let name,when,list,sd;
 if(c&&sess(c.sid)){const s=sess(c.sid),st={done:c.done,vol:c.vol};sd=s;c.g=c.g||genGoals(s);name=s.name;when='En cours';list=c.g.map(x=>({txt:x.txt,xp:x.xp??Math.round(xpBase(x)*xpMult()),ok:evG(x,st),t:x.t,...pgG(x,st,1)}))}
 else if(S.lastG&&new Date(S.lastG.t).toDateString()==new Date().toDateString()&&sess(S.lastG.sid)){sd=sess(S.lastG.sid);name=sd.name;when='Terminée';list=S.lastG.list}
 else{let s=S.sessions.find(x=>x.day==d&&x.ex.length);when="Aujourd'hui";if(!s)for(let k=1;k<=7;k++){const x=S.sessions.find(y=>y.day==(d+k)%7&&y.ex.length);if(x){s=x;when=k==1?'Demain':DAYS[x.day];break}}
  if(!s)return'';sd=s;name=s.name;list=genGoals(s).map(x=>({txt:x.txt,xp:x.xp,ok:false,t:x.t,...pgG(x,{done:{},vol:0},0)}))}
 if(!list.length)return'';

/* ===== Quêtes de la semaine (lundi -> dimanche), renouvelées chaque semaine ===== */
const wkStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const wkRange=()=>{const s=wkStart(Date.now());return{s:s.getTime(),e:s.getTime()+7*864e5}};
function genMonth(){const n=new Date(),ws=wkStart(n),k='w'+ws.getFullYear()+'-'+(ws.getMonth()+1)+'-'+ws.getDate(),act=S.sessions.filter(s=>s.ex.length),pl=act.length;let old=null;
 if(S.mg&&S.mg.k==k){if((S.mg.pl==pl&&S.mg.v==2)||S.mg.bonus)return S.mg;old=S.mg}
 const m=S.me,W=S.wl||[],w=W.length?W[W.length-1].w:(m.weight||0),mode=m.mode||0,start=ws.getTime(),g=[],Lf=plannedLeft(),Hd=S.hist.filter(h=>h.t>=start),dn=Hd.length,dv=Hd.reduce((a,h)=>a+h.vol,0);
 if(w){const hm=(m.h||0)/100,low=hm&&w/(hm*hm)<18.5,d=mode==0?1:(mode==2&&!low?-1:0),st=d>0?Math.max(.1,Math.round(w*.004*10)/10):d<0?Math.max(.2,Math.round(w*.0075*10)/10):0;
  const v=(t=>m.tw&&d>0&&m.tw>w?Math.min(t,m.tw):m.tw&&d<0&&m.tw<w?Math.max(t,m.tw):t)(Math.round((w+d*st)*10)/10);
  g.push({t:'w',d,v,b:w,txt:d>0?`Atteindre ${f1(v)} kg`:d<0?`Descendre à ${f1(v)} kg`:`Rester à ±0,5 kg de ${f1(w)} kg (2 pesées minimum)`})}
 else g.push({t:'wc',v:2,txt:`Te peser au moins 2 fois cette semaine`});
 if(pl){const sv=Math.max(1,dn+Lf.n);g.push({t:'ss',v:sv,txt:`Faire ${sv} séance${sv>1?'s':''} cette semaine`})}
 if(pl){const hh=S.hist.some(h=>h.t<start),pool=[],rv=Math.min(2,Math.max(1,dn+Lf.n));
  if(hh)pool.push({t:'pr',v:1,txt:`Battre ton record de charge sur 1 exercice`});else{const v=Math.round((dv+Lf.vol)/100)*100;if(v>0)pool.push({t:'vm',v,txt:`Soulever ${kg(v)} kg au total cette semaine`})}
  pool.push({t:'rest',v:rv,txt:`Respecter tous tes temps de repos sur ${rv} séance${rv>1?'s':''} (sans « Passer »)`},{t:'clean',v:1,txt:`Finir une séance sans caler (tous les exercices réussis)`},{t:'new',v:1,txt:`Tenter un nouvel exercice`});
  if(hh)pool.push({t:'volrec',v:1,txt:`Battre ton record de volume sur une séance`});
  let hs=0;for(const ch of k)hs=(hs*31+ch.charCodeAt(0))>>>0;g.push(pool[hs%pool.length])}
 g.forEach(x=>x.xp=Math.round({w:60,wc:30,ss:60,pr:60,vm:50,rest:60,clean:60,new:60,volrec:60}[x.t]*xpMult()));
 const L=old?g.map(x=>{const o=old.list.find(y=>y.t==x.t);return o&&(o.claimed||x.t=='w'||x.t=='wc')?o:x}):g;S.mg={k,list:L,pl,v:2,t0:Date.now()};save();return S.mg}
function evM(g){const R=wkRange(),inW=t=>t>=R.s&&t<R.e,Hm=S.hist.filter(h=>inW(h.t)),W=S.wl||[],Wm=W.filter(y=>inW(y.t)),lw=W.length?W[W.length-1].w:0;
 if(g.t=='w'){const ok=g.d>0?lw>=g.v:g.d<0?lw<=g.v:(Wm.length>=2&&Math.abs(lw-g.b)<=.5);const f=!lw?0:g.d>0?(g.v>g.b?(lw-g.b)/(g.v-g.b):1):g.d<0?(g.b>g.v?(g.b-lw)/(g.b-g.v):1):Math.min(1,Wm.length/2);return{ok,f:ok?1:Math.max(0,Math.min(1,f)),p:lw?`Actuel : ${f1(lw)} kg`+(g.d==0?` · pesées ${Wm.length}/2`:''):'Aucune pesée'}}
 if(g.t=='wc')return{ok:Wm.length>=g.v,f:Math.min(1,Wm.length/g.v),p:`${Wm.length}/${g.v}`};
 if(g.t=='ss')return{ok:Hm.length>=g.v,f:Math.min(1,Hm.length/g.v),p:`${Hm.length}/${g.v}`};
 if(g.t=='vm'){const v=Hm.reduce((a,h)=>a+h.vol,0);return{ok:v>=g.v,f:Math.min(1,v/g.v),p:`${kg(v)} / ${kg(g.v)} kg`}}
 const cnt=n=>({ok:n>=g.v,f:Math.min(1,n/g.v),p:`${n}/${g.v}`});
 if(g.t=='rest')return cnt(Hm.filter(h=>h.sk===0).length);
 if(g.t=='clean')return cnt(Hm.filter(h=>h.ex.length&&h.ex.every(x=>x.res=='ok')).length);
 if(g.t=='new'){const bf=new Set(S.hist.filter(o=>o.t<R.s).flatMap(o=>o.ex.map(x=>lk(x))));return cnt(new Set(Hm.flatMap(h=>h.ex.map(x=>lk(x))).filter(id=>!bf.has(id))).size)}
 if(g.t=='volrec')return cnt(Hm.filter(h=>{const pv=S.hist.filter(o=>o.sid==h.sid&&o.t<h.t).map(o=>o.vol);return pv.length&&h.vol>Math.max(...pv)}).length);
 const ids=new Set();Hm.forEach(h=>h.ex.forEach(x=>{const pv=S.hist.filter(o=>o.t<R.s).flatMap(o=>o.ex.filter(y=>lk(y)===lk(x)&&y.res=='ok').map(y=>xL(y)));if(x.res=='ok'&&pv.length&&xL(x)>Math.max(...pv))ids.add(lk(x))}));return{ok:ids.size>=g.v,f:Math.min(1,ids.size/g.v),p:`${ids.size}/${g.v}`}}
/* séances encore prévues d'ici dimanche (aujourd'hui compris si pas encore faite) */
function plannedLeft(){const n=new Date(),act=S.sessions.filter(s=>s.ex.length),td=n.toDateString(),left=7-((n.getDay()+6)%7);let c=0,vol=0;

 return{n:c,vol}}
function mLate(x,r){if(r.ok)return'';
 if(x.t=='ss'||x.t=='vm'){const L=plannedLeft(),need=x.v*(1-r.f);return(x.t=='ss'?Math.ceil(need-1e-9)>L.n:need>L.vol*1.1)?'late':'ontime'}
 const n=Date.now(),t0=(S.mg&&S.mg.t0)||n,end=wkRange().e,ex=(n-t0)/Math.max(1,end-t0);
 if(n-t0<2*864e5||ex<.3)return'';return r.f<ex-.25?'late':'ontime'}

 o.onclick=ev=>{const b=ev.target.closest('button');if(ev.target==o)return o.remove();if(!b)return;

function exCue(e){obFlag('cue');const m=exMus(e),c=m&&m.c,t=c&&EXC[c.id];
 const o=document.createElement('div');o.className='ov';o.style.alignItems='center';
 const sec=(ic,l,x)=>x?`<div class="cue"><b>${ic} ${l}</b><p>${x}</p></div>`:'';
 const PW=c?painOf(c):[],ALT=c&&PW.length?altOf(c).slice(0,3):[];let body;if(t){const[a,b,k,z]=t.split('|'),R=exRec(c);body=`${PW.length?`<div class="cue pwc"><b>⚠️ Zone sensible : ${PW.map(j=>PAINL.find(x=>x[0]==j)[1].toLowerCase()).join(', ')}</b><p>${ALT.length?'Plus doux pour toi : '+ALT.map(x=>x.n).join(', ')+'.':'Pas d\'équivalent sans risque pour cette zone : retire-le de ta séance, ou garde-le très léger et sans douleur.'}</p></div>`:''}<div class="mch">${c.p.map(x=>`<i class="p">${MUS[x]}</i>`).join('')}${c.s.map(x=>`<i>${MUS[x]}</i>`).join('')}</div>${sec('📍','Mise en place',a)}${sec('🔁','Mouvement',b)}${sec('💡','Points clés',k)}${sec('⚠️','À éviter',z)}<div class="mu" style="margin-top:8px">Conseillé : ${R.txt}</div>`}
 else body=`${c&&String(c.id).startsWith('u')?`<div class="mch">${c.p.map(x=>`<i class="p">${MUS[x]}</i>`).join('')}</div><p class="mu">Exercice personnel : reconnu partout (équilibre, suggestions), mais sans fiche détaillée.</p>`:`<p class="mu">Pas de fiche pour « ${esc(e.name)} » : choisis un exercice du catalogue (Modifier l'exercice) pour avoir les conseils d'exécution.</p>`}${sec('💡','En attendant','Contrôle la descente (2 à 3 secondes), garde le dos neutre et le corps gainé, et arrête la série quand la technique se dégrade.')}`;
 o.innerHTML=`<div class="sheet cuesh"><div class="cueh">${spr('scroll',3)}<h2>${esc(e.name)}</h2></div>${body}<button class="btn s" id="cx">Fermer</button></div>`;
 document.body.append(o);o.onclick=ev=>{if(ev.target==o||ev.target.id=='cx')o.remove()}}

const GLO=[{"id": "pr", "n": "Record personnel", "ab": "PR", "t": "Performance", "lv": "D", "d": "Ta meilleure performance jamais réalisée sur un exercice (PR vient de l'anglais « Personal Record »).", "x": "Un record peut porter sur la charge la plus lourde, le plus de répétitions à une charge donnée ou le meilleur volume d'une séance. On parle de « PR à 5 répétitions » ou de « PR en 1RM ». Battre ses records n'est pas l'objectif de chaque séance : ils arrivent naturellement quand la progression est régulière.", "u": "Suivre ses records motive et permet de vérifier que l'entraînement fonctionne sur la durée.", "e": "« J'ai fait un PR au squat : 100 kg pour 5 répétitions. »", "r": ["pb", "rm", "1rm", "surcharge"], "app": "L'écran Records liste tes meilleures charges et ton 1RM estimé par exercice."}, {"id": "pb", "n": "Meilleure performance", "ab": "PB", "t": "Performance", "lv": "D", "d": "Synonyme de record personnel (de l'anglais « Personal Best »).", "x": "PB et PR désignent la même chose. PB est plus utilisé au Royaume-Uni et en course à pied, PR en musculation et en force athlétique aux États-Unis.", "u": "Comprendre les deux termes quand on lit des programmes ou des vidéos en anglais.", "e": "« Nouveau PB au développé couché ! »", "r": ["pr", "1rm"], "app": ""}, {"id": "rm", "n": "Répétition maximale", "ab": "RM", "t": "Performance", "lv": "D", "d": "La charge maximale qu'on peut soulever pour un nombre précis de répétitions, en bonne technique.", "x": "Le chiffre devant RM indique le nombre de répétitions : 5RM = la charge la plus lourde possible pour 5 répétitions, pas une de plus. Les programmes expriment souvent les charges en pourcentage de la RM (ex. 75 % de 1RM). Plus le nombre de répétitions est grand, plus la charge est légère.", "u": "Situer son niveau et calibrer les charges d'un programme.", "e": "« Ma 10RM au tirage vertical est 55 kg. »", "r": ["1rm", "intensite", "pr", "rpe"], "app": ""}, {"id": "1rm", "n": "Une répétition maximale", "ab": "1RM", "t": "Performance", "lv": "I", "d": "La charge la plus lourde qu'on peut soulever une seule fois, avec une bonne technique.", "x": "Tester réellement son 1RM est éprouvant et risqué sans expérience ni pareur. On l'estime donc souvent à partir d'une série de plusieurs répétitions avec des formules, comme celle d'Epley : 1RM ≈ charge × (1 + répétitions / 30). L'estimation est fiable jusqu'à environ 10 répétitions, beaucoup moins au-delà.", "u": "Suivre sa force sans prendre de risque et calculer des charges en pourcentage.", "e": "80 kg × 6 répétitions → 1RM estimé ≈ 80 × (1 + 6/30) = 96 kg.", "r": ["rm", "pr", "intensite", "force"], "app": "L'appli estime ton 1RM avec la formule d'Epley dans les statistiques et les records."}, {"id": "intensite", "n": "Intensité", "ab": "", "t": "Concept", "lv": "I", "d": "Le degré de difficulté d'une série : soit le pourcentage de ta charge maximale, soit l'effort ressenti.", "x": "Le mot a deux sens. L'intensité relative est la charge en % de 1RM (80 % de 1RM = intensité élevée). L'intensité d'effort, c'est la proximité de l'échec, mesurée avec le RPE ou le RIR. Une série de 15 répétitions jusqu'à l'échec est légère en % de 1RM mais très intense en effort.", "u": "Bien lire un programme et doser l'effort : pour la prise de muscle, c'est surtout l'effort (proximité de l'échec) qui compte.", "e": "« 4 séries de 6 à 80 % de 1RM » ou « 3 séries de 12 à RPE 8 ».", "r": ["rpe", "rir", "1rm", "volume", "echec"], "app": ""}, {"id": "volume", "n": "Volume d'entraînement", "ab": "", "t": "Concept", "lv": "D", "d": "La quantité de travail réalisée, le plus souvent comptée en séries par muscle et par semaine.", "x": "Les études sur la prise de muscle utilisent surtout les « séries effectives » : des séries assez proches de l'échec (environ 0 à 3 répétitions en réserve). Un repère courant est 10 à 20 séries par muscle et par semaine. En dessous, la progression est plus lente ; au-dessus, le gain supplémentaire devient faible et la récupération plus difficile. Le volume se compte aussi en tonnage (kg soulevés).", "u": "Le volume est le principal levier de la prise de muscle, à ajuster selon ta récupération.", "e": "Pectoraux : 4 séries de développé couché + 3 de pec deck, 2 fois par semaine = 14 séries/semaine.", "r": ["tonnage", "hypertrophie", "frequence", "deload", "serieeff"], "app": "La carte « Équilibre du programme » compte tes séries par muscle et par semaine (zone verte : 10 à 20)."}, {"id": "tonnage", "n": "Tonnage", "ab": "", "t": "Performance", "lv": "I", "d": "Le poids total soulevé : séries × répétitions × charge.", "x": "Le tonnage donne une idée du travail total d'une séance ou d'une semaine. Il est utile pour comparer des séances du même exercice, mais trompeur entre exercices différents : 1 000 kg à la presse ne valent pas 1 000 kg en curl.", "u": "Voir si la charge de travail augmente au fil des semaines sur un même mouvement.", "e": "3 séries × 10 répétitions × 60 kg = 1 800 kg de tonnage.", "r": ["volume", "surcharge"], "app": "Le « volume » affiché pendant la séance est un tonnage, en kg."}, {"id": "serieeff", "n": "Série effective", "ab": "", "t": "Concept", "lv": "I", "d": "Une série suffisamment difficile pour stimuler la prise de muscle, c'est-à-dire terminée près de l'échec.", "x": "Une série n'est « effective » que si elle se termine avec environ 0 à 4 répétitions en réserve. Les séries d'échauffement ou trop faciles ne comptent pas. C'est l'unité utilisée par la recherche pour mesurer le volume.", "u": "Ne compter que le travail utile et éviter de multiplier les séries faciles.", "e": "10 répétitions à une charge où tu aurais pu en faire 12 = série effective (2 RIR).", "r": ["volume", "rir", "echec", "echauffement", "junkvolume", "workingset"], "app": ""}, {"id": "rpe", "n": "Échelle d'effort perçu", "ab": "RPE", "t": "Concept", "lv": "I", "d": "Une note de 1 à 10 qui indique à quel point une série était difficile (« Rate of Perceived Exertion »).", "x": "En musculation, l'échelle est reliée aux répétitions en réserve : RPE 10 = échec, impossible d'en faire une de plus ; RPE 9 = il en restait 1 ; RPE 8 = il en restait 2 ; RPE 7 = il en restait 3. Elle permet d'adapter la charge à ta forme du jour plutôt que de suivre un pourcentage fixe.", "u": "Autoréguler : un jour de fatigue, la même note correspond à une charge un peu plus faible.", "e": "« 3 séries de 8 à RPE 8 » : choisis une charge qui te laisse 2 répétitions en réserve.", "r": ["rir", "echec", "intensite", "autoreg"], "app": ""}, {"id": "rir", "n": "Répétitions en réserve", "ab": "RIR", "t": "Concept", "lv": "I", "d": "Le nombre de répétitions que tu aurais encore pu faire en fin de série (« Reps In Reserve »).", "x": "RIR 0 = échec, RIR 2 = il en restait 2. Pour la prise de muscle, la plupart des séries efficaces se situent entre 0 et 3 RIR. Les débutants sous-estiment souvent ce qu'il leur reste : s'entraîner parfois jusqu'à l'échec sur des exercices sûrs aide à calibrer son ressenti.", "u": "Doser l'effort sans aller systématiquement à l'échec, ce qui fatigue beaucoup.", "e": "« Arrête la série à 2 RIR » : quand tu sens qu'il ne te reste que 2 bonnes répétitions.", "r": ["rpe", "echec", "serieeff", "autoreg"], "app": "Les charges de départ de l'appli visent environ 3 répétitions en réserve, par prudence."}, {"id": "echec", "n": "Échec musculaire", "ab": "", "t": "Concept", "lv": "I", "d": "Le moment où tu ne peux plus faire une répétition complète avec une bonne technique.", "x": "Aller à l'échec garantit que la série est difficile, mais augmente la fatigue et le temps de récupération. Les études montrent que s'arrêter à 1 à 3 répétitions de l'échec donne des résultats proches avec moins de fatigue. L'échec est plus sûr sur des machines ou des exercices d'isolation que sur un squat ou un soulevé de terre lourd.", "u": "Savoir où se situe sa limite et la viser surtout en fin de séance ou sur des exercices sûrs.", "e": "Dernière série de curl poussée jusqu'à ce que la barre ne e répétitions avec une bonne technique (« As Many Reps As Possible »).", "x": "Souvent utilisée en dernière série d'un programme pour mesurer sa forme et ajuster la charge suivante. Le nombre de répétitions obtenu permet aussi d'estimer le 1RM.", "u": "Tester sa progression sans faire de 1RM risqué.", "e": "« 3 × 5, dernière série en AMRAP » : 5, 5, puis 9 répétitions → la charge peut monter.", "r": ["1rm", "echec", "rir"], "app": ""}, {"id": "tempo", "n": "Tempo", "ab": "", "t": "Concept", "lv": "I", "d": "La vitesse d'exécution de chaque phase d'une répétition.", "x": "On le note souvent avec 4 chiffres, en secondes : descente – pause en bas – montée – pause en haut. « 3-1-1-0 » = 3 s pour descendre, 1 s de pause, 1 s pour monter, pas de pause en haut. Contrôler la descente améliore la technique et la sensation musculaire.", "u": "Garder un mouvement propre et régulier, et augmenter le temps sous tension.", "e": "Squat en tempo 3-1-1-0 : on descend lentement, on marque l'arrêt, on remonte franchement.", "r": ["tst", "amplitude", "connexion"], "app": "Le minuteur rythme chaque répétition avec un tempo propre à chaque exercice, réglable avec − / +."}, {"id": "tst", "n": "Temps sous tension", "ab": "TST", "t": "Concept", "lv": "I", "d": "La durée pendant laquelle le muscle travaille au cours d'une série.", "x": "Une série de 10 répétitions à 3 secondes chacune représente 30 s sous tension. Longtemps présenté comme la clé de la prise de muscle, le temps sous tension est en réalité secondaire : la proximité de l'échec et le volume comptent davantage. Des répétitions très lentes obligent à prendre une charge plus légère.", "u": "Éviter les répétitions bâclées, sans tomber dans l'excès de lenteur.", "e": "8 répétitions en tempo 3-0-1-0 = 32 s de temps sous tension.", "r": ["tempo", "echec", "hypertrophie"], "app": ""}, {"id": "amplitude", "n": "Amplitude de mouvement", "ab": "ROM", "t": "Concept", "lv": "D", "d": "La distance parcourue pendant une répétition, de la position étirée à la position contractée (« Range Of Motion »).", "x": "Une amplitude complète travaille le muscle sur toute sa longueur. Les études récentes montrent que travailler en position étirée (bas du squat, bas du développé) est particulièrement efficace pour la prise de muscle. Réduire l'amplitude pour soulever plus lourd donne une impression de force mais un stimulus moindre.", "u": "Choisir une charge qui permet un mouvement complet et contrôlé.", "e": "Squat jusqu'à au moins les cuisses parallèles plutôt qu'un quart de squat avec 30 kg de plus.", "r": ["tempo", "hypertrophie", "egolift", "partials"], "app": ""}, {"id": "connexion", "n": "Connexion esprit-muscle", "ab": "", "t": "Concept", "lv": "I", "d": "Se concentrer volontairement sur le muscle qu'on travaille pendant le mouvement.", "x": "Penser à contracter le muscle ciblé augmente son activation, surtout sur les exercices d'isolation et à charge modérée. L'effet est plus faible sur les mouvements lourds, où l'attention doit rester sur la technique et la trajectoire.", "u": "Mieux sentir les muscles difficiles à « trouver » : dos, fessiers, arrière d'épaule.", "e": "Au tirage horizontal, penser à « tirer avec les coudes » et serrer les omoplates.", "r": ["tempo", "isolation"], "app": ""}, {"id": "polyarti", "n": "Exercice polyarticulaire", "ab": "", "t": "Concept", "lv": "D", "d": "Un exercice qui fait bouger plusieurs articulations et donc travailler plusieurs muscles à la fois.", "x": "Squat, développé couché, tractions, soulevé de terre ou rowing sont polyarticulaires. Ils permettent de soulever lourd et de travailler beaucoup de muscle en peu de temps. On les place en général en début de séance, quand on est frais.", "u": "Construire la base d'un programme efficace et économique en temps.", "e": "Le développé couché sollicite pectoraux, triceps et avant des épaules.", "r": ["isolation", "ordre", "force", "m_agoniste"], "app": "L'encyclopédie indique pour chaque exercice s'il est polyarticulaire ou d'isolation."}, {"id": "isolation", "n": "Exercice d'isolation", "ab": "", "t": "Concept", "lv": "D", "d": "Un exercice qui ne fait bouger qu'une articulation et cible surtout un muscle.", "x": "Curl, extension triceps, élévations latérales ou leg extension sont des exercices d'isolation. Ils complètent les polyarticulaires pour cibler un muscle en retard ou moins sollicité, avec une technique plus simple et moins de fatigue générale.", "u": "Corriger un déséquilibre ou ajouter du volume sur un muscle précis.", "e": "Ajouter des élévations latérales car les développés travaillent peu le côté des épaules.", "r": ["polyarti", "ordre", "connexion", "m_agoniste"], "app": ""}, {"id": "ordre", "n": "Ordre des exercices", "ab": "", "t": "Concept", "lv": "D", "d": "L'organisation des exercices dans une séance : les plus exigeants d'abord, l'isolation et les abdos à la fin.", "x": "Les mouvements lourds et techniques demandent de la fraîcheur, physique et nerveuse. Les placer en premier permet de mieux performer et de réduire le risque de blessure. Exception : on peut commencer par un muscle prioritaire qu'on veut développer.", "u": "Tirer le meilleur de chaque séance.", "e": "Squat → presse → leg curl → mollets → gainage.", "r": ["polyarti", "isolation", "echauffement"], "app": "L'appli trie et propose de réordonner tes exercices selon cette logique."}, {"id": "echauffement", "n": "Échauffement et séries d'approche", "ab": "", "t": "Concept", "lv": "D", "d": "Des séries légères et progressives avant les séries de travail pour préparer muscles, articulations et système nerveux.", "x": "Avant un gros mouvement, on fait 2 à 4 séries de plus en plus lourdes avec peu de répétitions (ex. 50 % × 10, 70 % × 5, 85 % × 2) pour ne pas se fatiguer. Les séries d'approche ne comptent pas dans le volume. Un muscle déjà chaud grâce à un exercice précédent n'a besoin que d'une série d'approche, voire d'aucune.", "u": "Soulever plus lourd dès la première vraie série et limiter le risque de blessure.", "e": "Squat à 80 kg : 10 × 40, 5 × 55, 2 × 67,5 kg, puis 80 kg.", "r": ["serieeff", "pyramide", "ordre", "mobilite", "workingset", "pumpcover"], "app": "Le minuteur enchaîne l'échauffement automatiquement. Le nombre de séries dépend de ta charge par rapport à ta force estimée (historique, sinon profil), et il est sauté quand tes muscles sont déjà chauds ou que la charge est légère pour toi."}, {"id": "deload", "n": "Décharge", "ab": "Deload", "t": "Méthode d'entraînement", "lv": "I", "d": "Une semaine volontairement allégée pour récupérer de la fatigue accumulée.", "x": "Toutes les 4 à 8 semaines, ou quand la fatigue s'installe (performances en baisse, douleurs articulaires, sommeil perturbé), on réduit le volume d'environ 40 à 60 % et/ou les charges, tout en continuant à s'entraîner. La forme revient et la progression repart souvent mieux ensuite. Les débutants en ont rarement besoin.", "u": "Éviter le surmenage et casser un plateau dû à la fatigue.", "e": "Semaine de deload : mêmes exercices, 2 séries au lieu de 4, sans aller près de l'échec.", "r": ["plateau", "recup", "surentrainement", "volume"], "app": "La barre d'énergie de l'appli t'aide à repérer quand la fatigue s'accumule."}, {"id": "plateau", "n": "Plateau", "ab": "", "t": "Concept", "lv": "I", "d": "Une période où les performances stagnent malgré l'entraînement.", "x": "Les causes les plus fréquentes : récupération insuffisante (sommeil, alimentation, stress), manque de calories ou de protéines, programme inchangé depuis longtemps, ou fatigue accumulée. Changer brutalement de programme n'est pas toujours la solution : vérifier d'abord le sommeil et l'alimentation, puis envisager un deload ou de nouvelles variantes.", "u": "Diagnostiquer la vraie cause d'une stagnation.", "e": "Bloqué à 60 kg au développé couché depuis 6 semaines → semaine de deload, puis passage en double progression.", "r": ["deload", "surcharge", "recup", "surentrainement", "periodisation", "natural"], "app": ""}, {"id": "surentrainement", "n": "Surentraînement", "ab": "", "t": "Physiologie", "lv": "I", "d": "Un état de fatigue prolongée où la performance baisse malgré le repos habituel.", "x": "Le vrai surentraînement est rare et grave (plusieurs semaines ou mois de récupération). Ce qu'on rencontre le plus souvent en salle est le « surmenage » : une fatigue passagère qui disparaît avec quelques jours plus légers. Signes d'alerte : baisse de force durable, sommeil perturbé, irritabilité, douleurs persistantes, perte de motivation.", "u": "Reconnaître les signaux et lever le pied à temps.", "e": "Performances en baisse 3 séances d'affilée avec un mauvais sommeil → semaine allégée.", "r": ["deload", "recup", "plateau"], "app": ""}, {"id": "recup", "n": "Récupération", "ab": "", "t": "Physiologie", "lv": "D", "d": "La période pendant laquelle le corps répare les muscles et s'adapte à l'entraînement.", "x": "Le muscle ne grossit pas pendant la séance mais pendant la récupération. Les piliers : le sommeil (7 à 9 h par nuit), des protéines et des calories suffisantes, et 48 à 72 h avant de retravailler durement le même muscle. Le stress et le manque de sommeil ralentissent nettement la progression.", "u": "Progresser plus vite en récupérant mieux, pas en s'entraînant plus.", "e": "Pectoraux travaillés lundi, retravaillés jeudi : 72 h de récupération.", "r": ["doms", "surentrainement", "sommeil", "frequence", "reposactif", "alcool"], "app": ""}, {"id": "sommeil", "n": "Sommeil", "ab": "", "t": "Physiologie", "lv": "D", "d": "Le moment où l'essentiel de la récupération et des adaptations se produit.", "x": "Pendant le sommeil profond, l'hormone de croissance est sécrétée et les tissus se réparent. Dormir régulièrement moins de 6 à 7 h réduit la force, augmente la faim, favorise la perte de muscle en sèche et la prise de gras. Des horaires réguliers et un écran éteint avant le coucher aident beaucoup.", "u": "Améliorer ses résultats sans changer son entraînement.", "e": "Passer de 6 h à 8 h de sommeil améliore souvent les charges en quelques semaines.", "r": ["recup", "surentrainement", "catabolisme", "testo", "gh", "alcool"], "app": "L'appli te glisse des conseils sommeil selon tes horaires de séance."}, {"id": "doms", "n": "Courbatures", "ab": "DOMS", "t": "Physiologie", "lv": "D", "d": "Des douleurs musculaires qui apparaissent 24 à 72 h après un effort inhabituel (« Delayed Onset Muscle Soreness »).", "x": "Elles sont surtout dues à la nouveauté du mouvement et à la phase de descente (excentrique). Elles diminuent vite quand on répète les mêmes exercices. Avoir des courbatures n'est pas un signe de bonne séance, et ne pas en avoir ne veut pas dire que la séance était inefficace.", "u": "Ne pas juger une séance à ses courbatures, et ne pas les confondre avec une blessure (douleur vive, localisée, articulaire).", "e": "Première séance de jambes après une pause : courbatures 2 jours après, beaucoup moins la semaine suivante.", "r": ["recup", "hypertrophie"], "app": ""}, {"id": "frequence", "n": "Fréquence d'entraînement", "ab": "", "t": "Concept", "lv": "D", "d": "Le nombre de fois par semaine où l'on travaille un même muscle.", "x": "Travailler chaque muscle au moins 2 fois par semaine donne en général de meilleurs résultats qu'une seule fois, à volume égal, surtout parce que le volume est mieux réparti et les séries de meilleure qualité. Au-delà, l'important reste le volume total et la récupération.", "u": "Choisir une organisation (full body, haut/bas, PPL) adaptée à ses jours disponibles.", "e": "16 séries de pectoraux réparties en 2 séances de 8 plutôt qu'une séance de 16.", "r": ["volume", "fullbody", "upperlower", "ppl", "split"], "app": ""}, {"id": "densite", "n": "Densité d'entraînement", "ab": "", "t": "Concept", "lv": "A", "d": "La quantité de travail réalisée par unité de temps.", "x": "Augmenter la densité, c'est faire autant de travail en moins de temps : repos plus courts, supersets. Utile quand le temps manque, mais des repos trop courts sur les gros mouvements réduisent les charges et donc l'efficacité. Repères : 2 à 3 min sur les polyarticulaires lourds, 1 à 2 min en isolation.", "u": "Optimiser une séance quand on est pressé.", "e": "Passer en supersets antagonistes pour finir en 45 min au lieu de 60.", "r": ["superset", "volume"], "app": ""}, {"id": "fullbody", "n": "Full body", "ab": "", "t": "Programme", "lv": "D", "d": "Une organisation où chaque séance fait travailler tout le corps.", "x": "Typiquement 2 à 3 séances par semaine, avec un exercice par grand groupe musculaire (jambes, poussée, tirage) à chaque fois. Idéal pour débuter : chaque muscle est travaillé souvent, et rater une séance pèse peu sur la semaine.", "u": "La meilleure base pour un débutant ou pour qui s'entraîne 2 à 3 fois par semaine.", "e": "Lundi, mercredi, vendredi : squat, développé couché, rowing, élévations latérales, gainage.", "r": ["upperlower", "ppl", "split", "frequence"], "app": "Le générateur de séance propose une option « Corps entier »."}, {"id": "upperlower", "n": "Haut / bas", "ab": "Upper Lower", "t": "Programme", "lv": "D", "d": "Une organisation qui alterne séances du haut du corps et séances du bas du corps.", "x": "Classiquement sur 4 séances par semaine (haut, bas, haut, bas), chaque muscle est travaillé 2 fois. C'est un excellent compromis entre volume par séance et récupération, très adapté aux intermédiaires.", "u": "Augmenter le volume par muscle tout en gardant une fréquence de 2 fois par semaine.", "e": "Lundi haut, mardi bas, jeudi haut, samedi bas.", "r": ["fullbody", "ppl", "split", "frequence"], "app": "Le générateur propose « Haut du corps » et « Bas du corps »."}, {"id": "ppl", "n": "Push / Pull / Legs", "ab": "PPL", "t": "Programme", "lv": "I", "d": "Une organisation en trois séances : poussée, tirage, jambes.", "x": "Push = pectoraux, épaules, triceps. Pull = dos, arrière d'épaule, biceps. Legs = jambes et fessiers. Fait une seule fois par semaine (3 séances), chaque muscle n'est travaillé qu'une fois ; en 6 séances par semaine, c'est 2 fois, mais cela demande du temps et une bonne récupération.", "u": "Regrouper les muscles qui travaillent ensemble pour des séances cohérentes.", "e": "Lundi push, mardi pull, mercredi legs, puis on recommence.", "r": ["fullbody", "upperlower", "split", "frequence"], "app": "Le générateur propose « Poussée » et « Tirage »."}, {"id": "split", "n": "Split", "ab": "", "t": "Programme", "lv": "I", "d": "Une organisation où les séances sont réparties par groupes musculaires.", "x": "Le « bro split » classique consacre une séance par muscle (pectoraux le lundi, dos le mardi…), donc chaque muscle une seule fois par semaine. Il reste populaire mais donne en général des résultats un peu moins bons que des organisations à 2 fois par semaine, à volume égal. PPL et haut/bas sont aussi des splits.", "u": "Choisir son organisation en connaissant les compromis.", "e": "Lundi pectoraux, mardi dos, mercredi jambes, jeudi épaules, vendredi bras.", "r": ["ppl", "upperlower", "fullbody", "frequence", "chestday"], "app": ""}, {"id": "hypertrophie", "n": "Hypertrophie musculaire", "ab": "", "t": "Physiologie", "lv": "D", "d": "L'augmentation de la taille des muscles grâce à l'entraînement.", "x": "Elle résulte surtout de la tension mécanique : des séries assez lourdes ou menées près de l'échec. Les repères actuels : 10 à 20 séries par muscle et par semaine, entre environ 6 et 30 répétitions par série, près de l'échec, avec assez de protéines et de récupération. Chez un débutant, on peut gagner nettement la première année, puis la progression ralentit.", "u": "Comprendre ce qui fait vraiment grossir un muscle pour ne pas se disperser.", "e": "Programme hypertrophie : 3 à 4 séries de 8 à 12 répétitions à 1-2 RIR, 2 fois par muscle et par semaine.", "r": ["volume", "serieeff", "surcharge", "proteines", "recup", "anabolisme", "natural", "pump", "m_fibres"], "app": ""}, {"id": "force", "n": "Force", "ab": "", "t": "Performance", "lv": "D", "d": "La capacité à produire beaucoup de tension, mesurée par la charge maximale soulevée.", "x": "Elle dépend de la taille des muscles mais aussi du système nerveux (coordination, recrutement) et de la technique. C'est pour cela que les débutants deviennent plus forts très vite, avant même que les muscles grossissent. On la développe surtout avec des séries lourdes de 1 à 6 répétitions.", "u": "Choisir ses plages de répétitions selon son objectif (force ou volume musculaire).", "e": "Programme force : 5 séries de 3 à 5 répétitions à 80-90 % de 1RM, 3 min de repos.", "r": ["1rm", "hypertrophie", "intensite", "powerlifting", "valsalva"], "app": ""}, {"id": "anabolisme", "n": "Anabolisme", "ab": "", "t": "Physiologie", "lv": "I", "d": "L'ensemble des processus qui construisent les tissus, dont la fabrication de protéines musculaires.", "x": "L'entraînement et un apport suffisant en protéines et en énergie stimulent l'anabolisme musculaire pendant 24 à 48 h. Le muscle grossit quand, sur la durée, la construction dépasse la dégradation (catabolisme). La fameuse « fenêtre anabolique » de 30 minutes après la séance est largement exagérée : l'apport total de la journée compte bien plus.", "u": "Mettre l'accent sur l'apport protéique quotidien plutôt que sur un timing parfait.", "e": "4 repas de 25 à 40 g de protéines dans la journée soutiennent bien l'anabolisme.", "r": ["catabolisme", "proteines", "hypertrophie", "leucine", "fenetre", "testo"], "app": ""}, {"id": "catabolisme", "n": "Catabolisme", "ab": "", "t": "Physiologie", "lv": "I", "d": "L'ensemble des processus qui dégradent les tissus pour produire de l'énergie.", "x": "Le catabolisme est normal et permanent. Il devient un problème quand il dépasse l'anabolisme sur la durée : déficit calorique trop fort, protéines insuffisantes, manque de sommeil ou d'entraînement. En sèche, garder des protéines élevées et continuer la musculation limite fortement la perte de muscle.", "u": "Préserver son muscle pendant une perte de poids.", "e": "En sèche : 2 g de protéines par kg et entraînement maintenu pour limiter le catabolisme.", "r": ["anabolisme", "cut", "deficit", "proteines", "cortisol"], "app": ""}, {"id": "mb", "n": "Métabolisme de base", "ab": "MB", "t": "Physiologie", "lv": "D", "d": "Aussi appelé métabolisme basal : l'énergie que ton corps dépense au repos complet pour rester en vie (respirer, faire battre le cœur, maintenir sa température).", "x": "Il représente souvent 60 à 70 % de la dépense quotidienne. On l'estime avec des formules selon le poids, la taille, l'âge et le sexe ; celle de Mifflin-St Jeor est l'une des plus fiables. Plus de muscle augmente un peu le métabolisme de base, mais moins qu'on ne le dit souvent.", "u": "Point de départ pour calculer ses besoins caloriques.", "e": "Homme de 75 kg, 178 cm, 30 ans : MB ≈ 10 × 75 + 6,25 × 178 − 5 × 30 + 5 ≈ 1 720 kcal.", "r": ["tdee", "neat", "maintenance"], "app": "La page Nutrition calcule ton métabolisme de base avec la formule de Mifflin-St Jeor."}, {"id": "neat", "n": "Thermogenèse d'activité non sportive", "ab": "NEAT", "t": "Physiologie", "lv": "I", "d": "Les calories dépensées par tous les mouvements du quotidien hors sport : marcher, rester debout, bouger, ranger…", "x": "Le NEAT (« Non-Exercise Activity Thermogenesis ») varie énormément d'une personne à l'autre, de quelques centaines à plus de 1 000 kcal par jour. Il baisse souvent sans qu'on s'en rende compte pendant une sèche, ce qui ralentit la perte de poids. Compter ses pas aide à le maintenir.", "u": "Comprendre pourquoi deux personnes au même entraînement ont des besoins très différents.", "e": "Passer de 4 000 à 10 000 pas par jour peut ajouter 200 à 300 kcal de dépense.", "r": ["tdee", "mb", "deficit"], "app": ""}, {"id": "tdee", "n": "Dépense énergétique totale", "ab": "TDEE", "t": "Nutrition", "lv": "D", "d": "Les calories que tu dépenses en tout sur une journée (« Total Daily Energy Expenditure »).", "x": "TDEE = métabolisme de base + NEAT + sport + énergie utilisée pour digérer (environ 10 % des calories). En pratique, on multiplie le métabolisme de base par un coefficient d'activité. Ce n'est qu'une estimation : la vraie référence reste l'évolution de ton poids sur 2 à 3 semaines.", "u": "Fixer ses calories selon l'objectif : au-dessus pour prendre, en dessous pour perdre.", "e": "MB de 1 720 kcal × 1,55 (activité modérée) ≈ 2 670 kcal de dépense totale.", "r": ["mb", "neat", "maintenance", "surplus", "deficit"], "app": "C'est la valeur « Entretien » affichée dans Nutrition."}, {"id": "masses", "n": "Masse grasse et masse maigre", "ab": "", "t": "Physiologie", "lv": "D", "d": "Le poids du corps se divise en masse grasse (graisse) et masse maigre (muscles, os, organes, eau).", "x": "Le taux de masse grasse en % est plus parlant que le poids seul : on peut garder le même poids en perdant du gras et en gagnant du muscle. Les balances à impédance donnent une estimation peu précise, mais utile pour suivre une tendance avec les mêmes conditions (le matin, à jeun).", "u": "Juger ses progrès autrement que par le chiffre de la balance.", "e": "80 kg à 20 % de masse grasse = 16 kg de graisse et 64 kg de masse maigre.", "r": ["recompo", "imc", "cut"], "app": ""}, {"id": "recompo", "n": "Recomposition corporelle", "ab": "Recompo", "t": "Concept", "lv": "I", "d": "Perdre du gras et gagner du muscle en même temps, avec un poids qui bouge peu.", "x": "Elle fonctionne surtout chez les débutants, les personnes en surpoids et celles qui reprennent après une pause. Elle demande des calories proches de la maintenance, beaucoup de protéines et un entraînement sérieux. Elle est plus lente que l'alternance prise de masse / sèche chez les pratiquants avancés.", "u": "Une stratégie simple pour débuter sans faire de prise de masse ni de sèche.", "e": "6 mois à la maintenance : poids stable, mais tour de taille en baisse et charges en hausse.", "r": ["maintenance", "masses", "bulk", "cut", "skinnyfat"], "app": ""}, {"id": "imc", "n": "Indice de masse corporelle", "ab": "IMC", "t": "Physiologie", "lv": "D", "d": "Le poids divisé par la taille au carré, utilisé pour situer la corpulence.", "x": "Normal entre 18,5 et 24,9. C'est un bon outil à l'échelle d'une population, mais il ne distingue pas muscle et graisse : un pratiquant musclé peut être classé « en surpoids » sans excès de graisse.", "u": "Repère rapide, à compléter par le tour de taille ou le taux de masse grasse.", "e": "75 kg pour 1,78 m : 75 / (1,78 × 1,78) ≈ 23,7.", "r": ["masses", "mb"], "app": "La page Nutrition affiche ton IMC avec cette précaution."}, {"id": "morphotype", "n": "Morphotype", "ab": "", "t": "Concept", "lv": "D", "d": "Une classification simplifiée des silhouettes : ectomorphe (fin), mésomorphe (athlétique), endomorphe (prend facilement).", "x": "Cette classification date des années 1940 et n'est pas un outil scientifique : la plupart des gens sont un mélange, et le corps change avec l'entraînement et l'alimentation. Elle reste utile comme ressenti : qui a du mal à prendre du poids a intérêt à manger dense et souvent ; qui prend facilement surveille davantage les quantités.", "u": "Adapter son alimentation à sa facilité, ou sa difficulté, à prendre du poids.", "e": "Un « ectomorphe » qui stagne en poids ajoute une collation et des aliments denses.", "r": ["bulk", "tdee", "maintenance", "hardgainer"], "app": "L'appli adapte les calories et les repas selon le morphotype ressenti de ton profil."}, {"id": "glycogene", "n": "Glycogène", "ab": "", "t": "Physiologie", "lv": "I", "d": "La forme sous laquelle les glucides sont stockés dans les muscles et le foie.", "x": "C'est le carburant principal des efforts intenses comme la musculation. Des réserves basses (régime très pauvre en glucides) réduisent les performances et donnent un aspect « plat » aux muscles. Le glycogène retient de l'eau : c'est pourquoi on perd vite 1 à 2 kg en coupant les glucides, sans que ce soit du gras.", "u": "Comprendre les variations rapides de poids et l'intérêt des glucides autour des séances.", "e": "Après un refeed riche en glucides, le poids remonte de 1 kg : c'est surtout de l'eau et du glycogène.", "r": ["glucides", "refeed", "cut"], "app": ""}, {"id": "maintenance", "n": "Maintenance calorique", "ab": "", "t": "Nutrition", "lv": "D", "d": "Le nombre de calories qui garde ton poids stable.", "x": "Elle correspond à ta dépense totale (TDEE). On la calcule d'abord avec une formule, puis on l'ajuste : si ton poids est stable sur 2 à 3 semaines en mangeant X kcal, X est ta maintenance. Elle évolue avec le poids, l'activité et le NEAT.", "u": "Point de repère pour fixer un surplus ou un déficit.", "e": "Poids stable à 2 600 kcal/jour → maintenance ≈ 2 600 kcal.", "r": ["tdee", "surplus", "deficit", "recompo"], "app": "« Entretien » dans Nutrition, ajusté automatiquement selon tes pesées."}, {"id": "surplus", "n": "Surplus calorique", "ab": "", "t": "Nutrition", "lv": "D", "d": "Manger plus de calories que ce qu'on dépense, pour prendre du poids.", "x": "Un surplus modéré, d'environ 5 à 15 % au-dessus de la maintenance (souvent 200 à 400 kcal), favorise la prise de muscle en limitant le gras. Un surplus trop fort fait surtout gagner de la graisse. Repère de rythme : +0,25 à +0,5 % du poids par semaine.", "u": "Prendre du muscle efficacement sans trop grossir.", "e": "Maintenance 2 600 kcal → 2 900 kcal en prise de masse.", "r": ["bulk", "leanbulk", "maintenance", "deficit"], "app": ""}, {"id": "deficit", "n": "Déficit calorique", "ab": "", "t": "Nutrition", "lv": "D", "d": "Manger moins de calories que ce qu'on dépense, pour perdre du poids.", "x": "Un déficit raisonnable fait perdre environ 0,5 à 1 % du poids par semaine. Plus fort, il augmente la faim, la fatigue et le risque de perdre du muscle. Garder des protéines élevées et continuer la musculation protège la masse maigre. Un kilo de graisse représente environ 7 700 kcal.", "u": "Perdre du gras sans perdre ses muscles ni sa motivation.", "e": "Maintenance 2 600 kcal → 2 100 kcal : environ 0,4 à 0,5 kg perdu par semaine.", "r": ["cut", "seche", "maintenance", "catabolisme", "refeed", "bruleurs", "jeune"], "app": ""}, {"id": "bulk", "n": "Prise de masse", "ab": "Bulk", "t": "Nutrition", "lv": "D", "d": "Une période où l'on mange en surplus pour maximiser la prise de muscle.", "x": "Le terme anglais « bulk » désigne la prise de masse. Pratiquée trop agressivement (« dirty bulk »), elle fait prendre beaucoup de gras qu'il faudra ensuite perdre. Une prise de masse dure en général plusieurs mois, suivie d'une sèche si besoin.", "u": "Accélérer la prise de muscle, surtout chez les personnes minces.", "e": "4 mois de prise de masse à +300 kcal/jour, +3 kg sur la balance.", "r": ["leanbulk", "surplus", "cut", "morphotype", "densitecal", "dirtybulk", "hardgainer"], "app": "Mode « Prise de masse » de la page Nutrition."}, {"id": "leanbulk", "n": "Prise de masse propre", "ab": "Lean bulk", "t": "Nutrition", "lv": "I", "d": "Une prise de masse avec un surplus léger pour limiter la prise de gras.", "x": "On vise un surplus d'environ 5 à 10 %, avec des aliments peu transformés et des protéines suffisantes. La prise de poids est plus lente, mais la part de muscle dans les kilos gagnés est plus élevée, et la sèche suivante plus courte.", "u": "La stratégie de prise de masse la plus recommandée pour la plupart des pratiquants.", "e": "+200 kcal/jour et +1 kg par mois environ.", "r": ["bulk", "surplus", "cut"], "app": ""}, {"id": "cut", "n": "Cut", "ab": "", "t": "Nutrition", "lv": "D", "d": "Une période en déficit calorique pour perdre de la graisse en gardant un maximum de muscle.", "x": "« Cut » est le terme anglais, « sèche » le terme français. Les clés : déficit modéré, protéines élevées (1,8 à 2,4 g/kg), musculation maintenue avec des charges lourdes, sommeil suffisant. La durée dépend du gras à perdre ; des pauses à la maintenance peuvent aider sur les longues sèches.", "u": "Révéler les muscles construits pendant la prise de masse.", "e": "12 semaines à −500 kcal/jour, de 82 à 76 kg en gardant ses charges.", "r": ["seche", "deficit", "refeed", "catabolisme", "bulk", "densitecal", "bruleurs", "shredded"], "app": "Mode « Perte de poids » de la page Nutrition."}, {"id": "seche", "n": "Sèche", "ab": "", "t": "Nutrition", "lv": "D", "d": "Le terme français pour une phase de perte de graisse en préservant le muscle.", "x": "Même chose que « cut ». En compétition de culturisme, la sèche est poussée très loin pour atteindre un taux de graisse très bas, mais pour la plupart des pratiquants l'objectif est simplement de perdre du gras de façon durable.", "u": "Voir la fiche « Cut » pour les repères pratiques : déficit, protéines, durée.", "e": "« Je commence ma sèche lundi : −400 kcal par jour. »", "r": ["cut", "deficit", "refeed"], "app": ""}, {"id": "refeed", "n": "Refeed", "ab": "", "t": "Nutrition", "lv": "A", "d": "Un jour ou deux à la maintenance ou au-dessus, riche en glucides, pendant une sèche.", "x": "Le refeed recharge le glycogène, améliore souvent les performances et le moral, et peut rendre une longue sèche plus supportable. Ses effets hormonaux restent modestes. Il est surtout utile aux personnes déjà assez sèches ou en sèche depuis plusieurs semaines, et doit rester planifié.", "u": "Tenir une sèche longue en gardant de l'énergie à l'entraînement.", "e": "Samedi : 2 600 kcal avec 350 g de glucides au lieu de 2 100 kcal.", "r": ["cut", "glycogene", "cheatmeal", "deficit"], "app": ""}, {"id": "cheatmeal", "n": "Repas plaisir", "ab": "Cheat meal", "t": "Nutrition", "lv": "D", "d": "Un repas libre, hors du plan alimentaire, prévu à l'avance.", "x": "Bien géré, il aide à tenir son alimentation sur la durée. Mal géré (journée entière d'excès), il peut annuler le déficit de plusieurs jours. Mieux vaut l'intégrer dans les calories de la semaine que de le voir comme une « triche ».", "u": "Garder du plaisir et de la flexibilité sans saboter ses objectifs.", "e": "Une pizza le samedi soir, en mangeant un peu plus léger le midi.", "r": ["refeed", "deficit", "macros"], "app": ""}, {"id": "macros", "n": "Macronutriments", "ab": "Macros", "t": "Nutrition", "lv": "D", "d": "Les trois nutriments qui apportent les calories : protéines, glucides et lipides.", "x": "Protéines et glucides apportent environ 4 kcal par gramme, les lipides 9 kcal par gramme (l'alcool 7 kcal). « Compter ses macros », c'est suivre les grammes de chacun en plus des calories. Pour un pratiquant, un repère courant : protéines d'abord, lipides à environ 25 à 30 % des calories, le reste en glucides.", "u": "Construire une alimentation qui soutient l'entraînement et l'objectif de poids.", "e": "2 750 kcal = 95 g de protéines, 92 g de lipides, 386 g de glucides.", "r": ["proteines", "glucides", "lipides", "micros", "tdee", "iifym"], "app": "La page Nutrition répartit tes macros selon ton objectif et ton morphotype."}, {"id": "micros", "n": "Micronutriments", "ab": "", "t": "Nutrition", "lv": "D", "d": "Les vitamines et minéraux, nécessaires en petites quantités et sans calories.", "x": "Fer, calcium, magnésium, zinc, vitamines D, B12, C… Ils participent à la récupération, à l'énergie, au système immunitaire et à la solidité des os. Une alimentation variée avec fruits, légumes, légumineuses, laitiers et produits complets couvre la plupart des besoins. La vitamine D est souvent basse en hiver en France.", "u": "Ne pas réduire l'alimentation aux seules calories et protéines.", "e": "Ajouter des légumes et un fruit à chaque repas couvre une bonne partie des besoins.", "r": ["macros", "fibres", "hydratation", "vitd", "electrolytes"], "app": ""}, {"id": "proteines", "n": "Protéines", "ab": "", "t": "Nutrition", "lv": "D", "d": "Le macronutriment qui fournit les acides aminés nécessaires pour construire et réparer les muscles.", "x": "Pour un pratiquant de musculation, le repère scientifique est d'environ 1,6 à 2,2 g par kg de poids de corps et par jour (plutôt le haut de la fourchette en sèche). Répartir sur 3 à 5 repas d'environ 0,4 g/kg chacun est efficace. Sources : viande, poisson, œufs, laitiers, légumineuses, tofu, et compléments si besoin.", "u": "Le nutriment le plus important pour la prise de muscle, après les calories totales.", "e": "75 kg × 1,8 g = 135 g de protéines par jour, en 4 repas d'environ 34 g.", "r": ["macros", "whey", "caseine", "leucine", "eaa", "anabolisme", "protveg", "fenetre", "timing"], "app": "L'appli calcule ton besoin en protéines et la quantité par repas."}, {"id": "glucides", "n": "Glucides", "ab": "", "t": "Nutrition", "lv": "D", "d": "Le macronutriment qui sert de carburant principal aux efforts intenses.", "x": "Ils sont stockés sous forme de glycogène dans les muscles et le foie. On distingue surtout les aliments riches en fibres et peu transformés (flocons d'avoine, riz complet, légumineuses, fruits) des produits sucrés. En musculation, des glucides suffisants améliorent les performances et la récupération.", "u": "Avoir de l'énergie à l'entraînement et bien récupérer.", "e": "Un repas avec riz ou pâtes 1 à 3 h avant la séance.", "r": ["macros", "glycogene", "ig", "fibres"], "app": ""}, {"id": "lipides", "n": "Lipides", "ab": "", "t": "Nutrition", "lv": "D", "d": "Les graisses alimentaires, indispensables au fonctionnement hormonal et à l'absorption de certaines vitamines.", "x": "Elles apportent 9 kcal par gramme. On privilégie les graisses insaturées (huile d'olive ou de colza, oléagineux, avocat, poissons gras riches en oméga-3) et on limite les graisses trans. Descendre trop bas (sous environ 20 % des calories) peut nuire à l'équilibre hormonal.", "u": "Couvrir ses besoins et ajouter facilement des calories en prise de masse.", "e": "Une cuillère à soupe d'huile d'olive (10 g) = 90 kcal.", "r": ["macros", "omega3"], "app": ""}, {"id": "fibres", "n": "Fibres alimentaires", "ab": "", "t": "Nutrition", "lv": "D", "d": "La partie des végétaux que l'on ne digère pas, utile à la digestion et à la satiété.", "x": "On les trouve dans les légumes, fruits, légumineuses et céréales complètes. Elles rassasient, régulent le transit et la glycémie. Les autorités de santé françaises recommandent environ 30 g par jour ; la plupart des gens en mangent moins.", "u": "Mieux contrôler la faim en sèche et préserver sa santé digestive.", "e": "Une portion de lentilles (200 g cuites) apporte plus de 10 g de fibres, soit un tiers de l'objectif du jour.", "r": ["glucides", "micros", "ig"], "app": ""}, {"id": "ig", "n": "Indice glycémique", "ab": "IG", "t": "Nutrition", "lv": "I", "d": "La vitesse à laquelle un aliment fait monter le sucre dans le sang, comparée au glucose.", "x": "Un IG élevé (pain blanc, riz blanc) fait monter la glycémie vite ; un IG bas (légumineuses, flocons d'avoine) plus lentement. L'IG dépend aussi de la cuisson et de ce qu'on mange avec (fibres, protéines, graisses le réduisent). Pour la plupart des pratiquants, la quantité totale de glucides compte bien plus que l'IG.", "u": "Choisir des glucides rassasiants au quotidien et plus rapides autour des séances si besoin.", "e": "Riz blanc avec du poulet et des légumes : l'IG du repas est plus bas que celui du riz seul.", "r": ["glucides", "fibres"], "app": ""}, {"id": "hydratation", "n": "Hydratation", "ab": "", "t": "Nutrition", "lv": "D", "d": "L'apport en eau, essentiel aux performances et à la récupération.", "x": "Une perte d'eau de seulement 2 % du poids du corps réduit déjà les performances. Repère courant : environ 30 à 40 ml par kg et par jour, plus les pertes liées à la transpiration. Une urine claire est un bon indicateur. Les boissons sucrées ou énergisantes ne sont pas nécessaires pour une séance de musculation classique.", "u": "Garder son énergie et sa concentration à l'entraînement.", "e": "75 kg × 35 ml ≈ 2,6 L d'eau par jour, plus une gourde pendant la séance.", "r": ["micros", "creatine", "electrolytes"], "app": "La page Nutrition affiche ta quantité d'eau conseillée."}, {"id": "leucine", "n": "Leucine", "ab": "", "t": "Nutrition", "lv": "A", "d": "Un acide aminé essentiel qui déclenche la fabrication de protéines musculaires.", "x": "Il faut environ 2 à 3 g de leucine par repas pour stimuler efficacement la synthèse protéique, soit en général 25 à 40 g de protéines de bonne qualité. Les protéines animales et la whey en sont riches ; les protéines végétales en contiennent moins, d'où l'intérêt de varier et d'augmenter un peu les portions.", "u": "Comprendre pourquoi la qualité et la quantité de protéines par repas comptent.", "e": "Une dose de 30 g de whey apporte environ 2,5 g de leucine.", "r": ["eaa", "bcaa", "proteines", "anabolisme"], "app": ""}, {"id": "creatine", "n": "Créatine", "ab": "", "t": "Supplément", "lv": "D", "d": "Un complément qui augmente les réserves d'énergie rapide des muscles, et l'un des mieux étudiés.", "x": "La créatine monohydrate augmente le stock de phosphocréatine : on peut faire 1 à 2 répétitions de plus, ce qui améliore la force et la prise de muscle sur la durée. Dose efficace : 3 à 5 g par jour, tous les jours, à n'importe quelle heure ; la phase de charge et les cycles ne sont pas nécessaires. Elle fait prendre 1 à 2 kg d'eau dans les muscles. Elle est considérée comme sûre chez l'adulte en bonne santé ; en cas de problème rénal, demande l'avis d'un médecin.", "u": "Le complément le plus utile pour la force et la masse musculaire, après une alimentation correcte.", "e": "5 g de créatine monohydrate par jour dans un verre d'eau ou un shaker.", "r": ["whey", "preworkout", "hydratation", "supplcontam"], "app": ""}, {"id": "whey", "n": "Protéine de lactosérum", "ab": "Whey", "t": "Supplément", "lv": "D", "d": "Une poudre de protéines issue du lait, digérée rapidement et riche en leucine.", "x": "La whey est un aliment pratique, pas un produit magique : elle aide seulement si l'alimentation ne couvre pas le besoin en protéines. La whey « isolate » contient moins de lactose que la « concentrée ». Une dose de 25 à 30 g apporte environ 20 à 25 g de protéines. Inutile si tu atteins facilement ton objectif en mangeant.", "u": "Compléter facilement les protéines quand le besoin est élevé ou le temps manque.", "e": "Un shaker de 30 g de whey avec du lait en collation.", "r": ["caseine", "proteines", "leucine", "eaa"], "app": "L'appli ne propose la whey que si ton besoin en protéines est difficile à couvrir en mangeant."}, {"id": "caseine", "n": "Caséine", "ab": "", "t": "Supplément", "lv": "I", "d": "La principale protéine du lait, digérée lentement.", "x": "Elle forme une sorte de gel dans l'estomac et libère ses acides aminés sur plusieurs heures. On la prend souvent le soir, mais le fromage blanc et le skyr en sont naturellement riches et font aussi bien. Son intérêt par rapport à la whey reste surtout pratique.", "u": "Un apport protéique durable, par exemple avant de dormir.", "e": "250 g de fromage blanc le soir ≈ 20 g de protéines, surtout de la caséine.", "r": ["whey", "proteines"], "app": ""}, {"id": "bcaa", "n": "Acides aminés ramifiés", "ab": "BCAA", "t": "Supplément", "lv": "I", "d": "Trois acides aminés essentiels : leucine, isoleucine et valine (« Branched-Chain Amino Acids »).", "x": "Très vendus, les BCAA sont peu utiles quand l'apport en protéines est suffisant : seuls, ils ne suffisent pas à construire du muscle, car il faut les neuf acides aminés essentiels. Une portion de whey ou un repas protéiné en apporte autant, pour moins cher.", "u": "Savoir que ce n'est pas une priorité et éviter une dépense inutile.", "e": "30 g de whey contiennent déjà environ 6 g de BCAA.", "r": ["eaa", "leucine", "whey"], "app": ""}, {"id": "eaa", "n": "Acides aminés essentiels", "ab": "EAA", "t": "Supplément", "lv": "I", "d": "Les 9 acides aminés que le corps ne sait pas fabriquer et qu'il faut trouver dans l'alimentation (« Essential Amino Acids »).", "x": "Ce sont eux qui permettent la synthèse des protéines musculaires. Ils sont plus complets que les BCAA, mais toutes les protéines animales, la whey et les associations végétales (céréales + légumineuses) les apportent déjà. Les compléments d'EAA n'ont d'intérêt que dans des cas particuliers, comme une alimentation végétale peu variée.", "u": "Comprendre la qualité d'une source de protéines.", "e": "Riz + lentilles : une association végétale qui couvre tous les acides aminés essentiels.", "r": ["bcaa", "leucine", "proteines"], "app": ""}, {"id": "preworkout", "n": "Pré-workout", "ab": "", "t": "Supplément", "lv": "I", "d": "Un complément pris avant la séance pour l'énergie et la concentration, le plus souvent à base de caféine.", "x": "Les ingrédients utiles sont surtout la caféine (efficace autour de 3 mg/kg), la bêta-alanine (provoque des picotements sans danger) et la citrulline. Beaucoup de produits contiennent de fortes doses de caféine : pour un adulte en bonne santé, les autorités européennes situent la limite à environ 400 mg par jour et 200 mg en une prise. Évite-le en fin de journée, il gêne le sommeil.", "u": "Un coup de fouet ponctuel ; un café fait souvent aussi bien pour moins cher.", "e": "Un expresso (environ 80 mg de caféine) 30 à 45 minutes avant la séance.", "r": ["cafeine", "creatine", "sommeil", "supplcontam"], "app": ""}, {"id": "cafeine", "n": "Caféine", "ab": "", "t": "Supplément", "lv": "D", "d": "Un stimulant qui réduit la sensation de fatigue et améliore un peu la force et l'endurance.", "x": "Effet maximal 30 à 60 minutes après la prise, pendant plusieurs heures. Elle perturbe le sommeil si elle est prise tard : son effet peut durer 6 h ou plus. Repères de sécurité européens pour un adulte : 400 mg par jour au maximum, 200 mg en une prise. Le café, le thé et les boissons énergisantes en contiennent.", "u": "Améliorer une séance ponctuellement, sans sacrifier son sommeil.", "e": "Une tasse de café filtre (≈ 90 mg) avant une séance en milieu de journée.", "r": ["preworkout", "sommeil"], "app": ""}, {"id": "omega3", "n": "Oméga-3", "ab": "", "t": "Nutrition", "lv": "I", "d": "Des acides gras essentiels présents surtout dans les poissons gras, utiles au cœur et au cerveau.", "x": "EPA et DHA viennent principalement des poissons gras (sardine, maquereau, saumon) ; les végétaux comme le colza ou les noix apportent surtout de l'ALA, moins bien converti. Manger du poisson gras 1 à 2 fois par semaine couvre en général les besoins. Leur effet direct sur la prise de muscle est faible.", "u": "Équilibrer ses lipides pour la santé globale.", "e": "Sardines au déjeuner deux fois par semaine.", "r": ["lipides", "micros"], "app": ""}, {"id": "cardio", "n": "Cardio", "ab": "", "t": "Concept", "lv": "D", "d": "L'entraînement de l'endurance : vélo, course, rameur, marche rapide…", "x": "Bon pour le cœur, la santé et la dépense calorique. Il ne freine que peu la prise de muscle s'il reste modéré et séparé des séances de jambes lourdes. En sèche, il aide à augmenter la dépense, mais le déficit alimentaire reste le levier principal.", "u": "Améliorer sa santé et sa récupération entre les séries et les séances.", "e": "2 séances de 30 min de vélo par semaine en plus de la musculation.", "r": ["hiit", "liss", "neat", "zone2", "hybrid"], "app": ""}, {"id": "hiit", "n": "Entraînement fractionné à haute intensité", "ab": "HIIT", "t": "Méthode d'entraînement", "lv": "I", "d": "Alterner des efforts très intenses et courts avec des récupérations (« High-Intensity Interval Training »).", "x": "Très efficace en peu de temps pour l'endurance, mais fatigant : il peut gêner la récupération des jambes s'il est fréquent. 1 à 2 séances par semaine suffisent en complément de la musculation.", "u": "Améliorer son cardio quand le temps manque.", "e": "Vélo : 30 s à fond / 90 s tranquille, 8 fois.", "r": ["cardio", "liss"], "app": ""}, {"id": "liss", "n": "Cardio basse intensité", "ab": "LISS", "t": "Méthode d'entraînement", "lv": "D", "d": "Un effort d'endurance modéré et continu, où l'on peut encore parler (« Low-Intensity Steady State »).", "x": "Marche rapide, vélo tranquille ou tapis incliné pendant 20 à 60 minutes. Il fatigue peu, interfère très peu avec la musculation et aide la récupération. Pratique en sèche pour augmenter la dépense sans épuiser.", "u": "Augmenter la dépense calorique sans nuire à la récupération.", "e": "40 min de marche rapide sur tapis incliné après la séance de haut du corps.", "r": ["cardio", "hiit", "neat", "zone2"], "app": ""}, {"id": "testo", "n": "Testostérone", "ab": "", "t": "Hormone", "lv": "D", "d": "La principale hormone androgène, présente chez l'homme et en plus petite quantité chez la femme, qui favorise la masse musculaire.", "x": "Elle est produite surtout par les testicules chez l'homme, et par les ovaires et les glandes surrénales chez la femme. Elle participe à la construction musculaire, à la densité osseuse, à la libido et à l'énergie. Son taux varie d'une personne à l'autre et baisse doucement avec l'âge. Les variations naturelles dues à l'entraînement sont petites et passagères : elles n'expliquent pas les différences de progression entre pratiquants. Ce qui la fait baisser : manque de sommeil, déficit calorique sévère, graisses alimentaires trop basses, alcool, surpoids important.", "u": "Savoir ce qui la soutient naturellement : sommeil, alimentation suffisante, poids de forme. Fatigue persistante, libido en berne ou perte de force inexpliquée : un médecin peut faire une prise de sang.", "e": "Passer de 5 h à 8 h de sommeil améliore souvent l'énergie et la récupération, en partie via les hormones.", "r": ["hormones", "sommeil", "lipides", "aas", "dopage", "natural"], "app": ""}, {"id": "hormones", "n": "Hormones et muscle", "ab": "", "t": "Hormone", "lv": "I", "d": "Des messagers chimiques du corps qui influencent la prise de muscle, la perte de gras et la récupération.", "x": "Les principales en musculation : la testostérone (construction musculaire), l'hormone de croissance et l'IGF-1 (réparation des tissus), l'insuline (stockage des nutriments), le cortisol (hormone du stress, mobilise l'énergie) et les œstrogènes (santé des os, rôle aussi chez l'homme). Chez une personne en bonne santé, les leviers naturels sont simples : dormir, manger assez, gérer son stress et s'entraîner régulièrement. Les « boosters de testostérone » vendus en complément n'ont pas d'effet démontré chez les personnes au taux normal.", "u": "Ne pas se laisser vendre des produits « hormonaux » miracles, et comprendre le rôle du sommeil et de l'alimentation.", "e": "Stress, nuits courtes et sèche sévère en même temps : le cortisol monte, la testostérone baisse, la progression ralentit.", "r": ["testo", "cortisol", "insuline", "gh", "sommeil"], "app": ""}, {"id": "cortisol", "n": "Cortisol", "ab": "", "t": "Hormone", "lv": "I", "d": "L'hormone du stress, qui mobilise l'énergie et règle l'inflammation.", "x": "Il monte naturellement le matin, pendant l'effort et en cas de stress. C'est normal et utile. Il devient un frein quand il reste élevé longtemps : stress chronique, manque de sommeil, déficit calorique sévère, entraînement excessif sans récupération. On ne le « bloque » pas avec des compléments ; on le régule avec le sommeil, la gestion du stress et une charge d'entraînement adaptée.", "u": "Comprendre pourquoi le stress de la vie quotidienne pèse aussi sur la récupération.", "e": "Semaine de partiels ou de rush au travail : mieux vaut une semaine plus légère que forcer.", "r": ["hormones", "recup", "sommeil", "surentrainement", "catabolisme"], "app": ""}, {"id": "insuline", "n": "Insuline", "ab": "", "t": "Hormone", "lv": "I", "d": "L'hormone qui fait entrer le sucre et les nutriments dans les cellules après un repas.", "x": "Sécrétée par le pancréas, elle aide à stocker le glucose dans les muscles (glycogène) et le foie, et limite la dégradation des protéines. Elle n'est pas « l'hormone qui fait grossir » : on prend du gras quand on mange plus de calories qu'on n'en dépense, quelle que soit la place des glucides. Les personnes diabétiques suivent un traitement médical précis : ne jamais modifier ses doses sans médecin.", "u": "Comprendre l'intérêt d'un repas avec glucides et protéines après la séance, sans tomber dans les mythes.", "e": "Riz + poulet après l'entraînement : l'insuline aide à recharger le glycogène et à utiliser les protéines.", "r": ["glucides", "glycogene", "ig", "hormones"], "app": ""}, {"id": "gh", "n": "Hormone de croissance", "ab": "GH", "t": "Hormone", "lv": "A", "d": "Une hormone qui participe à la réparation des tissus, à la croissance et à l'utilisation des graisses.", "x": "Elle est sécrétée surtout pendant le sommeil profond, et agit en grande partie via l'IGF-1 produit par le foie. Les hausses naturelles après une séance sont brèves et n'ont pas d'effet notable sur la prise de muscle. Utilisée hors prescription médicale, l'hormone de croissance est un produit dopant interdit, avec des risques sérieux (diabète, problèmes cardiaques, croissance anormale des os et des organes).", "u": "Retenir que le meilleur moyen de soutenir sa production naturelle est le sommeil.", "e": "Dormir 8 h favorise les pics nocturnes d'hormone de croissance.", "r": ["hormones", "sommeil", "dopage"], "app": ""}, {"id": "dopage", "n": "Dopage", "ab": "", "t": "Dopage", "lv": "D", "d": "L'usage de substances ou de méthodes interdites pour améliorer artificiellement les performances ou le physique.", "x": "La liste des produits interdits est publiée chaque année par l'Agence mondiale antidopage (AMA) ; en France, c'est l'Agence française de lutte contre le dopage (AFLD) qui contrôle. Elle comprend notamment les stéroïdes anabolisants, l'hormone de croissance, certains stimulants, les diurétiques et les SARMs. En France, le trafic de produits dopants est un délit, et leur usage est sanctionné en compétition. Au-delà de la triche, les risques pour la santé sont réels : cœur, foie, fertilité, hormones, santé mentale, sans compter les produits contrefaits ou mal dosés vendus sur internet. Pour un pratiquant de loisir, le jeu n'en vaut pas la chandelle : des progrès naturels importants sont possibles pendant des années.", "u": "Comprendre ce qui se cache derrière certains physiques sur les réseaux sociaux et protéger sa santé.", "e": "Un physique très musclé et très sec obtenu en un an : souvent pas naturel, inutile de s'y comparer.", "r": ["aas", "sarms", "natural", "supplcontam", "gh", "bruleurs"], "app": ""}, {"id": "aas", "n": "Stéroïdes anabolisants", "ab": "AAS", "t": "Dopage", "lv": "I", "d": "Des dérivés synthétiques de la testostérone, interdits hors prescription médicale et en compétition.", "x": "Ils augmentent fortement la prise de muscle et la récupération, mais au prix d'effets indésirables fréquents : baisse ou arrêt de la production naturelle de testostérone, infertilité, gynécomastie, acné, chute de cheveux, hausse de la tension et du mauvais cholestérol, risques cardiaques, atteintes du foie (surtout les formes orales), troubles de l'humeur, agressivité, dépendance. Certains effets peuvent persister après l'arrêt. Les produits du marché noir sont souvent contrefaits ou contaminés. Si tu en prends ou envisages d'en prendre, parles-en franchement à un médecin : il est tenu au secret médical.", "u": "Connaître les risques réels plutôt que les promesses des forums.", "e": "« Il a pris 10 kg de muscle en 3 mois » : avec des stéroïdes, souvent au prix d'effets secondaires qu'on ne montre pas.", "r": ["dopage", "testo", "gynecomastie", "natural", "sarms"], "app": ""}, {"id": "sarms", "n": "SARMs", "ab": "SARMs", "t": "Dopage", "lv": "I", "d": "Des molécules expérimentales vendues comme des « stéroïdes plus sûrs », en réalité non autorisées et interdites dans le sport.", "x": "Les SARMs (modulateurs sélectifs des récepteurs aux androgènes) n'ont jamais été autorisés comme médicaments. Ils suppriment aussi la production naturelle de testostérone, et des atteintes du foie et des problèmes cardiovasculaires ont été rapportés. Les analyses montrent que beaucoup de produits vendus en ligne ne contienne
